each a minimal page type demonstrating one capability so tests exercise the full surface without pinning to any production type's shape. `tests/conftest.py` flips it on for the whole run at import, ahead of collection, so test modules can resolve fixtures at module level.\n\nThe mechanism matters: entering **empties `REGISTRY` into a private stash** and leaving puts it back, so production types are unreachable through the map itself and not merely behind the accessors. The map is mutated in place, never rebound, so a reference taken before the switch stays live. `guard_production_type(tag)` — shared by `get_page_type` and page creation — reads the stash and raises `ProductionTypeInTestError`, steering the author to a `test-*` fixture rather than leaving them with a silently missing type. `is_test_mode()` is the supported way to ask which registry is in play (the docs generator's `_bindings_module` branches on it).\n\n`_test_registry()` imports `src.testtypes` at call time, not at module top, because the fixtures build on this package's core blocks — a top-level import would be circular.\n\n### Other accessors\n\n- `is_auto_child_type(parent_type, child_type)` — whether a child is auto-created. Being an auto-child is what makes a page *pinned*: it cannot be reparented, reordered, or archived on its own. That fact lives on the parent type and is never stored as a field on the child.\n- `workspace_guidance_fields()` — every declared guidance field mapped to the first spec to declare it. Reads whichever registry is in play, so a fixture's field is never offered in production.\n\n---\n\n## How the rest of the codebase consumes this\n\n```mermaid\ngraph LR\n    SRV[server.py<br/>MCP tools] --> ST[store.py]\n    ST --> CMD[commands.py<br/>apply]\n    ST --> RND[render.py]\n    CMD --> PT[pagetypes]\n    RND --> PT\n    ST --> PT\n    DOC[docsgen.py] --> PT\n```\n\n- **`src/server.py` → `src/store.py`** — every page-facing MCP tool (`renderPage`, `archivePage`, `unarchivePage`, …) reaches a page type through `get_page_type` → `registered_pagetypes`, so test mode applies at every entry point.\n- **`src/commands.py`** resolves the target `FieldSpec` via `get_pagetype_field` before applying an add, an element transition, or a field-setter edge, and enforces the positioning guard the `_INDEX`/`_PRECEDING` args declare.\n- **`src/store.py`** owns everything cross-page: `collect_ref_ids` for inline-ref integrity, `get_page_type` + `is_auto_child_type` for pinned-child protection, `_create_auto_children` for `AutoChildSpec`, and the evaluation of `RefCheck` / `ChildStateGuard` / `ParentStateGuard`.\n- **`src/render.py`** walks the tree resolving each page's type, and reads `block_element_fields` so an element's block-bearing fields are not rendered as scalar text.\n- **`src/docsgen.py`** seeds pages with `initial_sections` and branches on `is_test_mode()`.\n\n---\n\n## Adding or changing a page type\n\n1. Create `src/pagetypes/<name>.py` with a module-private `_MY_TYPE = PageType(...)`.\n2. Build sections from `_scalar` / `_prose` / `_list` / `_blocks`. Put the authoring instruction on `FieldSpec.description` — once, there, not on the setter.\n3. Build the command surface from the helpers. Spread `list_cmds(...)` / `blocks_cmds(...)` into `commands=(...)`; add `add_link_cmd()` and `set_title_cmd()` unless the type is command-less.\n4. Declare the `FSMSpec` with its states, initial status, `terminal_states`, and per-status `status_guidance`. Write each edge as a `transition_cmd` — never as a transition table.\n5. Register the tag in `REGISTRY` in `_registry.py`.\n6. Run the tests. `validate_registry()` fires at load and reports every declaration error at once.\n\n### Invariants that hold by construction\n\n- Every list field has a reorder, and every add supports a positioned insert — `list_cmds` always emits them with the anchored `toIndex` + `precedingId` guard.\n- A status edge lives in exactly one place: the command that declares it.\n- A block's kind travels as data inside the argument, which is what replaced one add command per kind. There is no in-place block edit — remove and re-add at the slot; the replacement is a new block with a new id.\n- A field's block vocabulary is declared once and flows to the command arg, the describe output, and the validator.\n\n### Rough edges worth knowing\n\n- **Two different `<noun>Id` derivations.** `list_cmds` and `element_blocks_cmds` derive their noun from the *field* (falling back to the section only when the field is the generic `items`); `element_cmds` and `set_element_field_cmd` derive it from the *section* unconditionally. On a list whose field key is not `items`, the add/remove ids and the element-transition ids will disagree unless you pass `singular=` to match.\n- `core/validation.py`'s module docstring describes only the inline/block grammar; the module also holds all the declaration validators. Similarly, `is_field_setter`'s docstring refers to \"PageType's post-init validation\" — post-init no longer validates, and the caller is `validate_pagetype_field_setters`.\n- `PageType`'s frozen-ness is real for callers but bypassed internally via `object.__setattr__` in post-init. If you add a derived field, follow the same pattern and mark it `init=False, compare=False` so it stays out of the spec's identity.","project-documentation":"# Project Documentation\n\n# Project Documentation\n\nThe root-level documentation surface of the pasta repository: the human-facing `README.md` and the agent-facing `CLAUDE.md` / `AGENTS.md`. These three files are the entry point for anyone — person or coding agent — arriving at the repo with no context. They are hand-authored prose, not generated, and they sit alongside (but are distinct from) the generated Sphinx reference under `docsite/`.\n\n## Purpose and audience split\n\nThe module exists because pasta has two kinds of reader with genuinely different needs, and conflating them produces documentation that serves neither.\n\n| File | Reader | Content | Stability |\n| --- | --- | --- | --- |\n| `README.md` | A developer evaluating or setting up pasta | What the server is, why the FSM-per-page design exists, quick start, the page-type lineup, how to write your own process | Hand-authored; changes when the product story changes |\n| `CLAUDE.md` | A coding agent working *on* this repo | Project hints (vocabulary, test invocation), which MCP servers to prefer for code search, plus a tool-managed GitNexus block | Hand-authored top; machine-managed bottom |\n| `AGENTS.md` | Same, for agents reading the vendor-neutral filename | Currently the GitNexus block only | Entirely machine-managed |\n\n`README.md` is a *pitch plus a manual*. It leads with the problem statement (process in a prompt gets outcompeted by later tokens), then shows the mechanism — the `next` block with its `do` / `blocked` / `humanGates` / `attention` buckets — then the feature lifecycle as prose. It deliberately quotes real stage guidance verbatim rather than paraphrasing it, so the README doubles as a worked example of what the server actually returns.\n\n`CLAUDE.md` is *operating instructions*. It carries no narrative; every line is an imperative an agent can act on.\n\n## The managed-block convention\n\n`CLAUDE.md` and `AGENTS.md` both contain a region fenced by HTML comments:\n\n```markdown\n<!-- gitnexus:start -->\n# GitNexus — Code Intelligence\n...\n<!-- gitnexus:end -->\n```\n\nEverything between those markers is written by the GitNexus tooling and will be rewritten wholesale when the index is refreshed (the block embeds live counts — currently 2304 symbols, 6006 relationships, 199 execution flows). **Hand edits inside the markers are lost.** Project-specific guidance belongs above `<!-- gitnexus:start -->`, which is where the `# Project hints` and `# graphify` sections live in `CLAUDE.md`.\n\n`AGENTS.md` currently consists of nothing *but* the managed block. If you want a hint to reach agents that read `AGENTS.md` rather than `CLAUDE.md`, you have to add it there explicitly — the two files are not symlinked or otherwise kept in sync.\n\nNote that the GitNexus block and the `# graphify` hint point at two different code-intelligence MCP servers. Both are installed in this repo (`.gitnexus/`, `graphify-out/`, and the matching skills under `.claude/skills/`). The GitNexus block's rules are the stricter ones — impact analysis before editing a symbol, `detect_changes` before committing, `rename` instead of find-and-replace, and `risk: UNKNOWN` treated as unresolved rather than clear.\n\n## Claims the README makes, and where they are backed\n\nWhen you edit `README.md`, these are the statements that can silently drift out of true. Each is checkable against one place in the tree:\n\n- **`uv run python main.py` → `http://localhost:8000`** — `main.py` defaults to `--host 0.0.0.0 --port 8000` and dispatches to `run_dev_server` in `src/hmr_server.py`. The undocumented `--stdio` flag takes the other branch, importing `src.server.mcp` directly and calling `mcp.run(transport=\"stdio\")` for clients that spawn the server as a subprocess.\n- **MCP at `/pasta/mcp`, web UI at `/`** — the mount is `Mount(\"/pasta\", app=mcp_asgi)` plus `Mount(\"/\", app=fastapi_dispatch)` in `src/hmr_server.py`; the non-reloading path mounts the same prefix in `src/server.py`.\n- **Workspaces under `./.pasta-data`, overridable with `PASTA_DATA_DIR`** — `src/server.py` reads `os.environ.get(\"PASTA_DATA_DIR\", \".pasta-data\")`.\n- **Python 3.14** — `requires-python = \">=3.14\"` in `pyproject.toml`.\n- **Hot reload keeps agent sessions connected** — the `/pasta/mcp` session manager lives in the stable outer ASGI app in `src/hmr_server.py`, which is why a module edit doesn't drop connections.\n- **Stage prose lives in one file** — `src/pagetypes/_stage_guidance.py`. The per-type declarations (`feature.py`, `bug_report.py`, `epic.py`, `simple_change.py`, `architecture.py`, `decision_record.py`, `document.py`, `toc.py`) sit next to it under `src/pagetypes/`, registered through `src/pagetypes/_registry.py`.\n- **The pure/impure split** — README names `model`, `pagetypes`, `fsm`, `commands`, `serialize` as the I/O-free core and `store`, `server` as the stateful shell. All seven exist as modules under `src/`.\n- **The bundled skills** — `.claude/skills/pasta/SKILL.md` and `.claude/skills/cook/SKILL.md` are byte-identical apart from the `name:` frontmatter, matching the README's \"same with a funnier name.\" Both are four lines of body telling the agent to call the server's `instructions` tool and nothing else, which is the point: the process lives in the server, not in the skill.\n\n## Relationship to the generated docs\n\n`README.md` documents the `just` recipes but is not itself part of any build. The generated documentation is a separate pipeline that the README only advertises:\n\n```mermaid\ngraph LR\n    R[src/pagetypes registry] --> D[src/docsgen.py]\n    D --> S[scripts/gen_page_type_docs.py]\n    S --> P[\"docsite/page-types/*.md<br/>(gitignored)\"]\n    P --> B[sphinx-build]\n    C[docsite/conf.py] --> B\n    B --> H[docsite/_build/html]\n```\n\n`src/docsgen.py` holds all the content logic and is unit-tested: `all_state_docs()` returns one markdown document per page-type *state*, `render_states_index()` produces the toctree index at the stem named by `STATES_INDEX_STEM`, and `reachable_states()` / `page_machine_qualname()` supply the graph walk and the `statemachine-diagram` target. `scripts/gen_page_type_docs.py` is a thin driver that only does filesystem I/O, skipping unchanged files. The result is 40+ files like `feature-brief-building.md` and `bug-report-draft.md`, all under a gitignored `docsite/page-types/`.\n\nTwo things to know before touching this boundary:\n\n- `docsite/page-types/` and `docsite/apidocs/` are both in `.gitignore`. Nothing in them is a source file; a clean checkout has no page-type docs until you run `just docs`.\n- `just docs` opens with `rm -rf docsite/page-types`, while the generator's own docstring promises it does *not* delete stale files and does *not* touch hand-authored per-type overview docs at `page-types/<tag>.md`. Today no such hand-authored files exist, so the two are consistent. If you add one, the `rm -rf` will eat it — move it out of `page-types/` or drop the `rm` from the recipe.\n\nThe Sphinx build itself is configured by `docsite/conf.py`, which inserts the repo root on `sys.path` so `statemachine.contrib.diagram.sphinx_ext` can resolve the machine classes exposed in `src/statecharts.py`, and renders API docs via `autodoc2` over the `src` package.\n\n## Task reference\n\nThe README lists a subset of the `justfile`. The full set, for contributors:\n\n| Recipe | What it does |\n| --- | --- |\n| `just test` / `just testincr` | Full suite / `pytest --testmon` incremental. Both set `PYTHONDONTWRITEBYTECODE=1` |\n| `just types` | `basedpyright` (config in `pyproject.toml`, `typeCheckingMode = \"recommended\"`, `include = [\"src/**/*\"]`) |\n| `just main` | Run the server |\n| `just docs` | Wipe `docsite/page-types`, regenerate, full `sphinx-build -a` |\n| `just sphinx` | `sphinx-autobuild` on port 8081, watching `src`, regenerating page-type docs pre-build |\n| `just dev` | `main` and `sphinx` in parallel (`[parallel]` attribute) |\n| `just probe` | `scripts/mcp_probe.py` |\n| `just brief-probe *ARGS` | Walk a feature brief through its whole lifecycle against a running server, printing each stage's `do` rollup (`--keep` to skip the archive) |\n| `just validate` | `scripts/validate_workspace.py` |\n| `just klaus` | Serve the repo with `klaus` |\n\n`just probe`, `just brief-probe`, `just validate` and `just klaus` are undocumented in the README. `brief-probe` in particular is the fastest way to see the effect of a stage-guidance or edge change end to end, and is worth knowing about if you are editing `src/pagetypes/_stage_guidance.py`.\n\n## Contributing to this module\n\n**Editing `README.md`.** Keep the two-voice structure: argument first, mechanism second, reference last. The quoted `building` guidance and the `next`-block JSON are load-bearing examples — if you change the shape of the `next` envelope in `src/server.py` or the prose in `_stage_guidance.py`, the README quotes them and goes stale. Same for the feature lifecycle diagram: it mirrors `src/pagetypes/feature.py`, and the canonical rendering of that machine is the generated `docsite/page-types/feature-brief-*.md`, not the ASCII in the README. Adding a status to `feature.py` means touching the README's lifecycle block by hand.\n\n**Editing `CLAUDE.md`.** Add above the `gitnexus:start` marker. Keep lines imperative and testable — `Use the word \"create\" instead of \"mint\"` is a good hint because an agent can comply with it unambiguously. To refresh the managed block, re-run the GitNexus indexer (`node .gitnexus/run.cjs analyze --index-only`) rather than hand-updating the symbol counts.\n\n**Editing `AGENTS.md`.** Treat it as a second delivery channel for the same guidance, not a mirror. If a hint matters, put it in both files.\n\n**The `docs/` directory** holds the README's screenshots (`pasta-ui-bug-example.png`, `pasta-ui-bug-model.png`) plus a vendored copy of the python-statemachine documentation under `docs/python-statemachine/`. That vendored tree is upstream reference material for working with the FSM library — not pasta's own docs, and not part of the `docsite/` build.","state-machines-statecharts":"# State Machines & Statecharts\n\n# State Machines & Statecharts\n\n`src/fsm.py` and `src/statecharts.py` are the FSM layer: the place where \"is this transition legal?\" and \"what status does it leave the page in?\" are answered. Everything above them — the command layer, the store, the MCP tools, the docs generator — defers to this layer instead of re-deriving status rules from transition tables.\n\nTwo files, two jobs:\n\n| File | Job |\n| --- | --- |\n| `src/fsm.py` | Build a `python-statemachine` class from a spec; evaluate legality and transitions against it. |\n| `src/statecharts.py` | Serve each page type's status machine under a stable, importable name for the Sphinx diagram directive. |\n\nThe fixture counterpart of `statecharts` is `src/testcharts.py`, which binds the same names for the hand-authored `test-*` page types.\n\n## The core idea: the machine is the authority\n\nA `FSMSpec` (page status) or `ElementFSMSpec` (a list element's own lifecycle) is data — states, an initial state, and a transition table of `(event, source, dest, agency)` tuples. `fsm.py` turns that data into a real `StateMachine` subclass exactly once, and every legality question is then answered by *running* that machine rather than by scanning the tuples.\n\nThis matters because the tuple table and the machine can disagree in ways that only the library can see: unreachable states, trap states, an event whose alternatives fan out from several sources. Building the class is itself the well-formedness check — see [Validation](#validation-building-is-the-check).\n\nEvaluation is stateless from the caller's point of view. `fire` and `allowed_events` each construct an *ephemeral* machine instance seeded at the caller's current status, ask it one question, and throw it away. No FSM instance is ever persisted; a page's status string is the only state that lives anywhere.\n\n```python\nmachine = machine_class(fsm)(start_value=current_status)\n```\n\n## Public surface of `fsm.py`\n\n### `build_machine(fsm) -> type[StateMachine]`\n\nConstructs the class. Uncached by design — the caller keeps what it builds. Three details of the construction are load-bearing:\n\n**States are named by value, not by attribute.** Each state is stored as `state_<value>` with `State(value, value=value, ...)`. This is what lets a page type declare an `open` state *and* an `open` event (bug-report does exactly this) without an attribute collision. Because of this, the current status is always read back from `configuration_values` — the state *values* — never from the attribute name. `_current_value` is the single place that does this read, and it assumes flat FSMs (exactly one active state).\n\n**Terminal states are inferred.** python-statemachine's trap-state validation demands that a state with no outgoing transition be declared `final=True`. Rather than making every spec author remember that, `build_machine` computes the set of source states from the transition table and marks anything absent from it as final. Cyclic FSMs (architecture, bug-report) have no such states and are unaffected.\n\n> This inference is about graph shape only. It is unrelated to `FSMSpec.terminal_states`, which is an explicit authoring-lock declaration consumed by `legal_commands` — a status can be authoring-locked while still offering a `reopen` edge, and a state with no outgoing edges is not automatically authoring-locked.\n\n**Transitions are grouped by event and wrapped in `Event`.** Alternatives sharing an event id are OR-combined (`by_event[event] | segment`), so one command legal in several source statuses becomes one event with several segments. Each event is wrapped in `Event(transitions, name=event)` so generated diagrams label edges with the exact command name (`markStale`) instead of python-statemachine's title-cased default (`Markstale`). The attribute name still fixes the event id, so `send()` and `allowed_events` are unaffected by the display name.\n\nThe `agency` element of each transition tuple (`\"agent\"` / `\"human\"` / `\"either\"`) is not consumed here — it is carried for describe/next-actions purposes and deliberately ignored by the machine.\n\n### `try_build_machine(fsm) -> (class | None, InvalidDefinition | None)`\n\nThe non-raising form: returns the class, or the `InvalidDefinition` that stopped it, never both. This exists so a malformed spec hands its error back to whoever owns it instead of exploding out of class creation at import time.\n\n### `machine_class(fsm) -> type[StateMachine]`\n\nReturns `fsm.machine` — the class built when the owning page type was declared. **It never builds.** A spec that no page type declares is unreachable in normal operation, so this raises `LookupError` rather than building on demand; building here would hand out a fresh, non-identical class on every call.\n\n### `allowed_events(fsm, current_status) -> set[str]`\n\nThe event ids legal from a status, **by FSM topology only**. Required-content preconditions, the `legal_in` status lock, terminal-status authoring locks, and cross-page guards are all layered on top by `commands.py` and the store — none of them are visible here.\n\n### `fire(fsm, current_status, event) -> str`\n\nSends the event and returns the resulting status value. A `TransitionNotAllowed` from the library is translated into the project's `IllegalCommandError`, so callers above this layer never see a python-statemachine exception.\n\n### `is_valid_status(fsm, status) -> bool`\n\nPlain membership in `fsm.states`. Used by the direct-status-edit path, which bypasses transitions entirely.\n\n## Where machines come from\n\nNothing in `fsm.py` owns a registry or a cache. A `PageType`, in `__post_init__`, derives its status transition table from its own transition/compound commands (`_status_transitions`), then calls `_build_machines`, which routes each spec through `_store_machine` → `try_build_machine` and stores whichever of `machine` / `machine_error` came back. `machine` and `machine_error` are `compare=False, init=False` dataclass fields, so they take no part in a spec's identity — one `ElementFSMSpec` shared by several page types stays a single value, and the first declaring type to build it wins (`_build_machines` skips a spec that already has a machine or an error).\n\n```mermaid\ngraph LR\n    PT[\"PageType.__post_init__\"] --> SM[\"_store_machine\"]\n    SM --> TB[\"try_build_machine\"]\n    TB --> BM[\"build_machine\"]\n    BM -->|class| SPEC[\"spec.machine\"]\n    TB -->|InvalidDefinition| ERR[\"spec.machine_error\"]\n    SPEC --> MC[\"machine_class\"]\n    ERR --> VAL[\"validate_page_machine\"]\n```\n\nThe set of specs a page type declares is exactly: its own `fsm`, plus every `element_fsm` hanging off a list field (enumerated by `element_fsm_sites`). There is no other attachment point, which is why an undeclared element spec is genuinely unreachable.\n\n## Validation: building is the check\n\n`validate_page_machine` (in `pagetypes/core/validation.py`) re-derives nothing. It simply reads `machine_error` off the status spec and off every element spec, and turns a non-`None` error into a validation message. python-statemachine's connectivity, unreachable-state and trap-state checks already ran during the build.\n\nOne translation happens on the way out: `_in_declared_names` rewrites `state_<value>` back to the state name the author declared, longest-first so a state whose name prefixes another isn't substituted inside it. Without this, an author would read an error about `state_shipped` for a state they wrote as `shipped`.\n\n## How callers use this layer\n\n`fsm.py` has **no outgoing calls** outside itself — it depends only on `python-statemachine`, `errors.IllegalCommandError`, and the two spec dataclasses. Everything is inbound.\n\n**`commands.py`** is the main consumer, and it consistently treats `allowed_events` as *one* input among several:\n\n- `legal_commands` calls `allowed_events` once per page, then combines topology (`_topology_ok`) with the `legal_in` status lock (`_status_ok`), required-content preconditions (`unmet_requirements`), and the terminal-status authoring lock.\n- `_check_legal` calls `allowed_events` a second time purely to produce a better error: if topology permits the event but content is unmet, it names the empty fields instead of complaining about the status.\n- `_apply` calls `fire` for a `TRANSITION` command and assigns the result to `page.status`.\n- `_element_transition` calls `fire` against the *field's* `element_fsm`, using the element's own `status` (defaulting to the spec's `initial`), which is how an illegal element mark is rejected.\n- `field_setter_edges` subtracts parent-blocked events from `allowed_events` before deciding which field setters to surface.\n\n**`store.py`** uses `allowed_events` in `next_actions` when walking a subtree, and `is_valid_status` in `set_page_status` — the direct-edit path that assigns a status without firing an event, so it needs membership rather than reachability.\n\nThree MCP tools bottom out here through short, uniform paths:\n\n```\ndescribeMutations → describe_mutations → legal_commands → allowed_events\nnextActions       → next_actions       → legal_commands → allowed_events\nroute_set_page_status → set_page_status → is_valid_status\n```\n\nDoc generation follows the same shape offline: `scripts/gen_page_type_docs.py::main` → `all_state_docs` → `state_docs` → `describe_mutations` → `legal_commands` → `allowed_events`. Note that `state_docs` runs `legal_commands` with `ignore_requirements=True`, so a content-less page still enumerates a status's outgoing transitions on topology alone.\n\n## `statecharts.py` — importable names for diagrams\n\nThe Sphinx `statemachine-diagram` directive addresses a machine by dotted import path. Page types build their machines at declaration time and hold them on the spec; `statecharts.py` exists only to give those classes an address.\n\nIt is a module-level `__getattr__`: on `src.statecharts.ArchitectureMachine`, it scans `REGISTRY` for a page type whose `fsm.name + \"Machine\"` matches, and returns `machine_class(page_type.fsm)`. An unmatched name raises `AttributeError`, which keeps `hasattr` honest.\n\nTwo properties are deliberate:\n\n- **Resolved per call, against the live `REGISTRY`.** No snapshot is taken at import, so an HMR reload of the page types cannot leave a stale class bound here.\n- **Production registry only.** The documentation site publishes the production types, so this module reads `REGISTRY` directly rather than whatever `registered_pagetypes()` currently returns. The test-mode counterpart is `testcharts.py`, which binds fixture machines as plain module attributes (`TestFlowMachine = machine_class(_page_fsm(\"test-flow\"))`). `docsgen._bindings_module` picks between the two based on `is_test_mode()`, importing lazily so fixtures never enter a live server's import graph.\n\n**Only page-status machines are served.** An element machine is reached through the field that declares it (`element_fsm_sites`) and is never diagrammed, so it needs no importable address.\n\nThe naming contract — spec name + `Machine` suffix — is enforced from the other side by `docsgen.page_machine_qualname`, which `hasattr`-checks the binding and raises `KeyError` if a type has no machine bound. That check is what stops a newly added page type from going silently undocumented, and `tests/test_docsgen.py` asserts it resolves for every registered and every production type.\n\n## Contributing notes\n\n- **Adding a status or transition to a page type** means editing its commands, not this module. `_status_transitions` derives the table from each `TRANSITION`/`COMPOUND` command's `legal_in` (source) and `dest` (destination), so a status edge lives in exactly one place. Nested compound sub-steps are not walked — the outer command owns the edge.\n- **A spec that won't build** surfaces as a validation error from `validate_page_types`, not as an import-time crash. Read the message: it has already been rewritten into your declared state names.\n- **Don't call `build_machine` from feature code.** Each call returns a *new* class, so identity comparisons and any per-class state would diverge. Go through `machine_class`, and if it raises `LookupError`, the real fix is to attach the spec to a page type.\n- **Don't add guards or actions to the generated classes.** `docsgen` documents them as guardless: required-content preconditions and cross-page guards (`ChildStateGuard`, `ParentStateGuard`, `RefCheck`) live in `commands.py` and the store, and the diagram layer assumes the machine shows pure topology.\n- **`_current_value` assumes flat FSMs.** If nested or parallel states are ever introduced, that `next(iter(...))` is the first thing that breaks.\n- Tests live in `tests/test_fsm.py` (topology, illegal transitions, the shared state/event-name cycle, the undeclared-spec `LookupError`), `tests/test_statecharts.py` (registry resolution) and `tests/test_docsgen.py` (qualname binding for every type).","test-fixtures":"# Test Fixtures\n\n# Test Fixtures (`src/testtypes.py`, `src/testcharts.py`)\n\nHand-authored page types that exist only to be tested against. They are **capability fixtures, not clones** of production types: each one is a deliberately small, purpose-built demonstration of a single capability cluster of the page-type system, named for the mechanic it exercises rather than for any production role.\n\nThe point of the split is churn isolation. Production page types can be enriched — a new field, a new status, a reworded description — without breaking a single assertion, because the assertions live against `test-*` fixtures instead. Production types are then verified only through the generic invariants, the registered set, the description directive, and doc generation.\n\n---\n\n## How fixtures enter the system\n\nUnder test mode, `registered_pagetypes()` (see `src.pagetypes._registry`) hands back `TEST_REGISTRY` instead of the production registry. Everything downstream — the store, the renderer, the pure core, `describePageType` — then treats a `test-lifecycle` page exactly like any other page. Outside test mode the fixtures neither resolve nor list; nothing has to be conditionally skipped, because they simply are not in the registry.\n\n```mermaid\nflowchart LR\n    TT[testtypes.py<br/>TEST_REGISTRY] -->|test mode| REG[registered_pagetypes]\n    PT[production types] -->|normal mode| REG\n    REG --> STORE[store / renderer / pure core]\n    REG --> DESC[describePageType]\n    TT --> TC[testcharts.py<br/>Test*Machine]\n    TC --> DOCS[doc generation]\n```\n\n`TEST_REGISTRY` is just a tag-keyed dict built over the six module-level `PageType` constants:\n\n```python\nTEST_REGISTRY: dict[str, PageType] = {\n    page_type.tag: page_type\n    for page_type in (TEST_FIELDS, TEST_BLOCKS, TEST_ELEMENT_BLOCKS, TEST_FLOW, TEST_LIFECYCLE,\n                      TEST_CHILD)\n}\n```\n\n### Declaration uses the production helpers\n\nEvery fixture declares its commands through the **same shared factories the production types use** — `set_prose_cmd`, `set_scalar_cmd`, `list_cmds`, `element_cmds`, `set_element_field_cmd`, `blocks_cmds`, `element_blocks_cmds`, `transition_cmd`, `transition_on_add_cmd`, all imported from `src.pagetypes.core.commands` — plus the field specs (`_scalar`, `_prose`, `_list`, `_blocks`, `SectionSpec`) and arg specs (`_text`, `_boolean`, `_code_block`, `_paragraph_runs`, `_paragraph_text`, `_list_block`, `standard_blocks`, `BlockKindSpec`, `ElementBlocksSpec`).\n\nTwo consequences worth keeping in mind when editing:\n\n1. A fixture reads like a production type, and doubles as coverage of those helpers.\n2. The resulting command surface — names, args, legality, FSM edges, guards, ref-checks — is still exactly what it was when hand-written. The helpers are a spelling, not an abstraction that hides behaviour.\n\nThe only thing declared *locally* is the element FSMs, and only because of naming (below).\n\n---\n\n## Element FSMs\n\nThree `ElementFSMSpec`s sit at the top of the module, prefixed and named distinctly from production:\n\n| Spec | `name` | States | `checkmark_done` |\n| --- | --- | --- | --- |\n| `_STEP_FSM` | `TestStep` | `todo`, `done`, `skipped` | `done` |\n| `_CHECK_FSM` | `TestCheck` | `pending`, `passed`, `failed`, `skipped` | `passed` |\n| `_QUESTION_FSM` | `TestQuestion` | `open`, `answered` | — (none) |\n\nThe distinct naming is not cosmetic: **python-statemachine registers each class it builds under its qualname**, so a name collision with a production element FSM would be a real conflict, and the names also appear as diagram labels.\n\n`_QUESTION_FSM` intentionally omits `checkmark_done` — that is the fixture for elements that render *without* a checkbox. Between `_STEP_FSM` and `_CHECK_FSM`, every checkbox render case is covered.\n\n---\n\n## The six fixtures\n\n### `test-fields` — every non-block field kind\n\nA pure content surface with no lifecycle: a single `active` status via `FSMSpec(name=\"TestFields\", initial=\"active\", states=(\"active\",))`.\n\nCovers the field kinds — plain `_scalar(\"label\")`, enum `_scalar(\"kind\", choices=(\"alpha\", \"beta\", \"gamma\"))`, `_prose(\"body\")`, and a plain `_list(\"items\", element_fields=(\"text\", \"note\", \"flagged\"))` with a required element field, an optional one, and a set-able flag. Commands cover the mutation patterns over them: `set_scalar_cmd`, `set_prose_cmd`, the `list_cmds` family (append, positioned insert, remove, reorder), and `set_element_field_cmd(..., const=(\"flagged\", True))`.\n\n### `test-blocks` — the blocks field\n\nThe richest content surface in four commands. `_blocks(\"body\", standard_blocks(), ...)` declares no narrowed vocabulary, so the field accepts **every** standard block kind, and `blocks_cmds(\"body\")` gives one add taking an array of kinded blocks, one generalized set that replaces any block whatever its kind, plus reorder, remove, and positioned insert.\n\nThe single terminal `active` status doubles as the single-state / terminal case for `render` and `reachable_states`.\n\n### `test-element-blocks` — blocks on element fields\n\nA list whose elements carry blocks under a **per-field kind restriction**, with both restriction cases present:\n\n```python\nelement_blocks=(ElementBlocksSpec(\"snippet\", (_code_block(),)),\n                ElementBlocksSpec(\"detail\", (_paragraph_runs(), _code_block(), _list_block()))),\n```\n\n`snippet` is code-only; `detail` is paragraph/code/list. The element carries `_STEP_FSM` too, so a checkbox, a title, and blocks render together.\n\nThe two-state `draft → ready` FSM exists for one reason: `markReady` `requires=((\"items\", \"items\"),)`, and the element-scoped commands are `legal_in=(\"draft\",)`. That is the only way to observe **both** the draft-only content lock on those commands **and** their absence from the self-direction `do` list.\n\n### `test-flow` — the simple status FSM\n\n`draft → open → closed`, with `closed → open` back.\n\nThree things are deliberate here:\n\n- **Name collision.** The `open` *state* and the `open` *event* share a name; the FSM engine must handle it.\n- **Compound transition.** `close` is declared with `transition_on_add_cmd`, so it records a commit into `resolution.commits` **and** fires `open -> closed`, atomically.\n- **Terminal + override.** `closed` is in `terminal_states` yet keeps its `reopen` edge — the fixture for the terminal-status authoring lock's \"transitions still allowed if any\" branch. And `reorderCommit` names `closed` in its `legal_in`, fixturing the `legal_in` override of that lock.\n\n`status_guidance` is supplied for `open` only, leaving `draft` and `closed` to fixture the unguided paths.\n\n### `test-lifecycle` — the rich status FSM\n\n```mermaid\nstateDiagram-v2\n    [*] --> draft\n    draft --> planning[\"planning:\"] beginPlanning\n    planning --> building[\"building:\"] beginImplementation\n    building --> review[\"review:\"] submitForReview\n    review --> building[\"building:\"] requestChanges\n    review --> done[\"done:\"] ship\n    building --> planning[\"planning:\"] reopenPlanning\n    draft --> abandoned[\"abandoned:\"] abandon\n```\n\n(`abandon` is multi-source — `legal_in=(\"draft\", \"planning\", \"building\", \"review\")`, OR-combined to the terminal `abandoned`; only one edge is drawn above to keep the diagram readable.)\n\nWhat this fixture carries that no other does:\n\n- **Required-content preconditions** — `beginPlanning` requires `summary.body`; `beginImplementation` requires `parts.items`.\n- **Agency variety** — `agent` (default), `human` on `submitForReview` and `ship`, `either` on `reopenPlanning`, `requestChanges`, and `abandon`.\n- **A page-status `ChildStateGuard`** — `beginImplementation` also requires the pinned `test-child` to be `ready`. It carries *both* a content precondition and a guard.\n- **Element-status `ChildStateGuard`s** — `submitForReview` and `ship` each require every `test-child` step to be `done`-or-`skipped` (`section=\"steps\"`) and every check `passed`-or-`skipped` (`section=\"checks\"`). A skipped item counts as addressed at both gates. These are evaluated in the store, across the page's child pages.\n- **A questions element-FSM + escalate** — `questions.items` carries `_QUESTION_FSM`; `answerQuestion` drives `open → answered`, and `escalateQuestion` sets `needsHuman` via `set_element_field_cmd`, feeding `attention`.\n- **A pinned auto-child** — `auto_children=(AutoChildSpec(\"test-child\"),)`, created in the same commit as the page.\n- **Workspace guidance** — three `WorkspaceGuidanceSpec`s: one shown across two statuses (`buildTool`), one at a single status (`reviewHint`), one at the initial status (`draftHint`).\n- **A wrapped multi-line field description** on `summary.body`, which no other fixture carries. It is what makes an instruction render as an indented block rather than inline after its marker — in generated docs and everywhere else a field's instruction is echoed.\n\n### `test-child` — the pinned auto-child\n\nThe counterpart to `test-lifecycle`, and the densest fixture.\n\n**Two element FSMs.** `steps.items` uses `_STEP_FSM`, `checks.items` uses `_CHECK_FSM` — together covering every checkbox render case.\n\n**A `legal_in` content lock.** Structural edits (add/remove/reorder, `addDecision`, `addNote`) are `legal_in=(\"draft\",)`; element-status marks (`markStepDone`, `markCheckPassed`, …) are `legal_in=(\"draft\", \"ready\")`. Progress can still be recorded on a finalized plan; its shape cannot change.\n\n**Two cross-page ref checks to the parent's questions**, covering both add paths:\n\n```python\nRefCheck(arg=\"questionId\", scope=\"parent\", section=\"questions\", field=\"items\")\n```\n\nOne rides the `notes` list add (`list_cmds(..., ref_check=...)`); the other rides a custom `decision` block kind, which appears in *both* the `decisions` blocks field and the `note` element-blocks field on `steps`. The element-blocks placement is the important one — it is the only fixture for integrity a command-level check could never provide, because a block created together with its element hides its `questionId` inside an array entry, where `store._check_ref` (which reads one scalar argument) cannot see it.\n\n**A per-field vocabulary with arg overrides.** The `decisions` field declares its own kinds rather than reusing `standard_blocks()`:\n\n```python\n_blocks(\"body\", (\n    BlockKindSpec(\"decision\", body_args=(_text(\"questionId\"), _text()),\n                  ref_check=RefCheck(arg=\"questionId\", scope=\"parent\",\n                                     section=\"questions\", field=\"items\")),\n    _paragraph_text(),\n), \"decisions, each linked to a parent question\"),\n```\n\nA custom kind the standard helpers do not provide, beside a standard `paragraph` whose body args are overridden to plain text. No other fixture exercises either, and both are the reason a blocks field may declare its own vocabulary.\n\n**A `ParentStateGuard`.** `markReady` carries both a required-content precondition (`steps.items`) and:\n\n```python\n_PARENT_IN_PLANNING_OR_LATER = ParentStateGuard(\n    parent_type=\"test-lifecycle\",\n    required_statuses=(\"planning\", \"building\", \"review\", \"done\"),\n    message=\"the test-lifecycle parent must be in planning or later\",\n)\n```\n\nA pinned child may only be finalized once its parent has reached `planning` or later — not while the parent is still `draft` (its base is not established), nor once `abandoned`. Evaluated in the store, this pair is the fixture for **parent-gated stage exposure**: the child's stage-required content is not yet the child's work, so `next_actions` withholds `addStep` from `do` until the parent unlocks the stage.\n\n**A guided initial status.** `status_guidance=((\"draft\", ...),)` on the initial state is what makes `createPage`'s guidance echo testable.\n\n---\n\n## `src/testcharts.py` — the machine bindings\n\nThe fixture counterpart of `statecharts`. Because `registered_pagetypes()` returns the `test-*` types under test mode, **doc generation runs over them**, and the doc renderer resolves an importable machine class per page type by qualname. `testcharts` supplies exactly that:\n\n```python\ndef _page_fsm(tag: str):\n    page = TEST_REGISTRY.get(tag)\n    if page is None:\n        raise KeyError(f\"Unknown page type {tag!r}.\")\n    return page.fsm\n\nTestFieldsMachine = machine_class(_page_fsm(\"test-fields\"))\n# ... one per fixture\n```\n\nTwo deliberate boundaries:\n\n- **Bound here, not beside production.** Keeping these out of `statecharts` keeps that module's names to the types the documentation site actually publishes — so doc generation covers the fixtures without the site ever naming one.\n- **Page machines only.** Element machines are not bound. Only a page's *status* machine is resolved by qualname, for the diagram directive on its state pages.\n\n`_page_fsm` raises `KeyError` on an unknown tag, so a typo in a binding fails loudly at import rather than producing a silently missing machine.\n\n---\n\n## Contributing\n\n**Adding a fixture.** Declare the `PageType` in `testtypes.py`, add it to the `TEST_REGISTRY` tuple, and bind a `Test<Name>Machine` in `testcharts.py`. Skipping the binding leaves doc generation without a resolvable machine for the new type.\n\n**Adding an element FSM.** Declare it locally in `testtypes.py` with a `Test`-prefixed, production-distinct `name` — python-statemachine registers the built class under its qualname, and the name also becomes the diagram label.\n\n**Before enriching a fixture, ask what it is *for*.** Each one is scoped to a capability cluster, and several of its oddities are load-bearing:\n\n- the `open` state/event collision in `test-flow`\n- `closed` being terminal *and* keeping `reopen`, plus `reorderCommit`'s `legal_in` override\n- the wrapped multi-line description on `test-lifecycle`'s `summary.body`\n- `_QUESTION_FSM` having no `checkmark_done`\n- the `decision` block kind on `test-child`'s `steps.note` element field\n- `test-element-blocks`' `markReady` requiring `items`\n\nEach of these is the *only* instance of its case in the fixture set. Removing or \"tidying\" one silently drops coverage rather than failing a test. Prefer adding a new fixture over broadening an existing one past its stated cluster — and when a fixture does grow, extend the module or fixture docstring to say which mechanic the addition covers.\n\n**Keep declaration going through the shared helpers.** A fixture that hand-rolls a command spec stops doubling as coverage of the helper it bypassed.","workspace-store-persistence":"# Workspace Store & Persistence\n\n# Workspace Store & Persistence\n\nThe store is pasta's stateful shell. Everything above it — the MCP tools and web routes in `src/server.py` — is I/O-free request handling; everything below it (`src/commands.py`, `src/fsm.py`, `src/render.py`, the page types) is pure. `Store` is the only place that touches the filesystem, takes locks, generates ids, or stamps timestamps.\n\nOne JSON file per workspace holds the workspace metadata and every page in it. There is no database, no per-page file, and no partial write: a workspace is loaded whole, mutated in memory, and written back whole.\n\n## Layout\n\n| File | Role |\n| --- | --- |\n| `src/store.py` | `Store` — the transactional API. Locks, file I/O, cross-page validation, id/revision stamping. |\n| `src/model.py` | `Workspace` and `Page` dataclasses. Plain JSON-able values only. |\n| `src/serialize.py` | `workspace_to_dict` / `workspace_from_dict` — the explicit on-disk shape. |\n| `src/rwlock.py` | `ReadWriteLock` — writer-preferred, in-process. |\n| `src/ids.py` | Id and revision-token generation, plus the `IdFactory` / `RevisionFactory` injection points. |\n| `src/cleanup.py` | The hourly stamp/backup/prune sweep. Classification is pure; `Store` owns the transaction. |\n\n`src/server.py:34-35` creates the single process-wide instance:\n\n```python\nDATA_DIR = os.environ.get(\"PASTA_DATA_DIR\", \".pasta-data\")\nSTORE = Store(DATA_DIR)\n```\n\nThe root directory is created on construction. Workspace files live directly under it as `<id>.json`, with `:` rewritten to `_` — `_path_for` does the mapping because `:` is not a legal Windows filename character, and `_id_for_path` inverts it (replacing only the *first* `_`) so `list_workspaces` can lock a file before it has parsed the id inside. Backups live one level down in `backups/`, deliberately not beside the live files: `list_workspaces` globs `*.json` non-recursively, so a backup sitting next to its original would be listed as a duplicate workspace.\n\n## The write pattern\n\nEvery mutating method follows the same four steps, and the docstring at the top of `store.py` is the canonical statement of it:\n\n1. take the workspace's **transaction lock**,\n2. `load_workspace` — parse a fresh in-memory copy from disk,\n3. apply pure-core mutations to that copy,\n4. `_touch_and_save` — serialize to a temp file and `os.replace` it over the destination.\n\nBecause step 2 re-reads from disk inside the lock, a write never operates on state another writer has already superseded. Because step 4 replaces the file atomically, a reader sees either the whole old workspace or the whole new one.\n\n```mermaid\nflowchart LR\n    A[\"_transaction_lock_for(ws)\"] --> B[\"load_workspace<br/>(rw read lock)\"]\n    B --> C[\"pure mutation<br/>commands.apply_command\"]\n    C --> D[\"_touch_and_save\"]\n    D --> E[\"write tmp file\"]\n    E --> F[\"os.replace<br/>(rw write lock)\"]\n```\n\n### Two locks, and why neither replaces the other\n\nEach workspace gets a `threading.Lock` (`_transaction_lock_for`) and a `ReadWriteLock` (`_rw_lock_for`), both lazily created in dicts guarded by `self._locks_guard`.\n\n- The **transaction lock** serializes writers across steps 1–4, so no update is lost. Readers never take it — a read is a single load, and making it queue behind a whole transaction would be pointless contention.\n- The **readers-writer lock** is held per *file operation*, not per transaction. Its only job is to keep a reader out of the `os.replace` in `_write_file`. Readers reach that moment without holding the transaction lock, so the transaction lock cannot protect them.\n\nThey never nest in a cycle: the rw lock is always taken *and released inside* the transaction lock, never the other way around. `ReadWriteLock.read()` is a no-op when the calling thread already holds the write lock, and `write()` is reentrant for its owner — but taking `write()` while holding `read()` self-deadlocks, which is the one ordering to keep in mind when adding code.\n\n`_write_file` serializes the JSON and writes the temp file *outside* the lock — only `os.replace` is guarded. The temp name carries the pid and thread id so concurrent writers cannot collide, and the replace is retried once after a 0.1s sleep, because a transient permission error on Windows is usually a scanner holding the handle for a moment.\n\nConcurrency is in-process only. Cross-process locking is a documented later step; two server processes pointed at the same `PASTA_DATA_DIR` will not coordinate.\n\n## Reads\n\nReads take only the rw read lock, parse outside it, and return fresh objects — `load_workspace` deserializes on every call, so a caller never holds a reference into shared state.\n\n- **`load_workspace` / `get_page`** — the primitives. A missing file or page raises `NotFoundError`; unparseable JSON raises `PastaError` naming the workspace as corrupt.\n- **`list_workspaces`** — id, name and status for each `*.json` in the root. A file that fails to parse is *skipped*, not fatal: a half-written or hand-edited file must not take down the whole listing.\n- **`tree`** — an ordered outline, structure and metadata only. Archived pages and their subtrees are hidden unless `include_archived`, in which case they are flagged `archived: true`. The `ordered` helper sinks archived siblings below live ones at each level using a stable `sorted`, preserving explicit reorder/reparent order within each group.\n- **`outline`** — one page's section tree (key, name, order, field kinds) from its `PageType`, no body content.\n- **`render_markdown` / `render_html`** — delegate to `src/render.py` and `src/render_html.py` after resolving the page type and building a ref context. `render_markdown` is what the `renderPage` MCP tool returns and renders unescaped; `render_html` always passes `escape_plain_text=True` for the web view. `show_archived` rides onto inline-ref links as `?archived=true` so following a reference keeps the archived view — it does not change which pages a tree render includes.\n- **`search`** — case-insensitive word-prefix scoring of query terms against `render.page_text`. Only *live* pages are scored, where live means neither the page nor any ancestor is archived (`_archived_in_ancestry`) — the same subtree rule `tree` applies, so the two agree on what exists. A query starting with `id:` (`ID_QUERY_PREFIX`) switches to id resolution instead and *does* include archived pages, since an id you are holding may have been archived since you got it.\n\n`_archived_in_ancestry` walks up through `parent_id` rather than trusting the flag, because archiving cascades only onto pinned children — an ordinary descendant of an archived page keeps `archived = False`. The walk carries a `seen` set so a corrupted parent cycle terminates instead of hanging, and a dangling `parent_id` simply ends the walk.\n\n## Self-direction: `next_actions` and `attention`\n\n`next_actions` is the store's answer to \"what should I do on this page now\". It walks a subtree (or the whole workspace) and partitions the model-declared edges into four lists that all key on a singular `command`:\n\n| Bucket | Meaning |\n| --- | --- |\n| `do` | Edges to drive now — either a status `TRANSITION` (`kind='transition'`) or a stage-relevant field setter (`kind='field'`, from `commands.field_setter_edges`). |\n| `blocked` | Agent transitions with the unmet precondition spelled out in `reason`. |\n| `humanGates` | `agency == \"human\"` transitions. Stop and hand off. |\n| `attention` | List elements awaiting a human — `_awaits_human`: `needsHuman` set and `status == \"open\"`. |\n\nThe precedence inside the loop matters. A **parent-state guard** failing means this page's stage has not been unlocked yet — nothing authored here can clear it — so those events land in `parent_blocked`, their reason outranks any unmet-content reason, and `commands.field_setter_edges` withholds the field setters that only serve them. A **child-state guard** failing means some *other* page's work is unfinished, which does not make authoring here premature, so it never suppresses a setter. `_first_guard_failure` applies the same order (child, then parent) for the enforcement path.\n\nWhen called with a `page_id`, the result also carries guidance for that focused page: `status_guidance` for its current status, plus any workspace-level guidance texts configured for that status via the module-level `workspace_guidance` helper (an empty stored value clears the field). A whole-workspace roll-up has no focused page and no guidance.\n\n`attention` is the standalone workspace-wide scan, sharing `_page_attention`.\n\n## Write transactions\n\n### Creating\n\n`create_page` resolves the type tag against the registry (an unknown tag raises `ValidationError` listing `registered_pagetypes()`), builds the page through the pure `commands.create_page`, stamps a fresh revision token, files it under its parent or in `root_page_ids`, then creates any pinned children declared by the type's `auto_children` — all in the same transaction. It returns a `CreatePageResult` carrying the page and the children, so callers can report both from one commit.\n\n### `mutate_page_batch` — the main write path\n\nAn ordered list of commands applied to one page as a single atomic commit. Each command is decided against the state the previous one left; if any is rejected the whole batch aborts and **nothing is written**, with the error naming the failing index and command:\n\n```\nBatch aborted at command 2 ('setScalar'): ...\n```\n\nBefore handing a command to the pure core, the store runs the checks that only it can run, because they need the whole workspace rather than one page:\n\n| Check | Enforces |\n| --- | --- |\n| `_check_ref` | A command-level `RefCheck` — a list add naming an element that must exist on the parent page. |\n| `_check_block_refs` | Refs carried *inside* block arguments, which `_check_ref` cannot see: it reads one scalar arg and cannot reach into an array entry. |\n| `_check_inline_refs` | Every inline `{ref: pageId}` in rich-text args exists in this workspace (grammar is validated in the pure core; *existence* is cross-page). A ref to an archived page resolves — archived pages remain in `workspace.pages`. |\n| `_check_guards` | Child- and parent-state guards, via `_first_guard_failure`. |\n| `_check_link` | The universal `addLink` command, routed through the same `_validate_link` as the top-level `link` tool so both obey identical rules. |\n\n`_check_ref` and `_check_block_refs` both funnel into `_resolve_ref`, so the rule and its error message live in one place. A `None` ref value is left to `apply_command`'s arg validation; a present-but-dangling id aborts here, before anything is written.\n\n### Optimistic concurrency: `statusRevisionToken`\n\nEvery command in a batch must present the page's current `status_revision_token`, popped out of `args` before the command reaches the pure core. A status transition regenerates the token via `_next_revision`, which loops until it draws a value different from the current one — so a stale token a caller still holds can never accidentally re-match the page after it moved.\n\nThe practical consequence: **a batch may hold at most one status transition, and only as its final command.** Anything after a transition would carry a token that is now stale.\n\n`_revision_conflict` produces two different messages depending on whether the token the batch had *reached* still equals the one *stored* on disk. That distinction is the point — an abort writes nothing, so a token regenerated mid-batch dies with the abort, and the message always tells the caller to retry with the revision the page actually keeps rather than the one the discarded working copy had reached.\n\n`set_page_status` regenerates the token too. It is a human admin override (the web page view's status dropdown) that jumps to any status valid in the type's FSM, bypassing the modelled transition guards — so it must invalidate held tokens the same way an in-band move does.\n\n### Tree structure\n\n`reparent_page`, `reorder_page` and `rename_page` operate on the tree rather than page content.\n\n- `reparent_page` appends to the new siblings and rejects a cycle by checking the new parent against `_subtree_pages(page_id)` — a page cannot become its own ancestor. Positioning is `reorder_page`'s job.\n- `reorder_page` uses `commands.resolve_anchored_slot`, the same anchored guard blocks and elements use: the sibling now before `to_index` must equal `preceding_id` (`None` iff the index is 0), else a stale-read `ConflictError`. It operates on the stored order, archived siblings included.\n- `rename_page` only rejects a blank title. Sibling titles are not reserved anywhere — a title is a display label, never an identifier — so it is permitted on archived and pinned pages, which alter no structure or lifecycle status.\n\nBoth helpers here are worth knowing before you edit: `_sibling_ids` returns the *live* list (mutating it edits the tree), and `_is_pinned_child` derives pinned-ness from the registry (`is_auto_child_type`) rather than any field on `Page`. A pinned auto-created child cannot be reparented, reordered, or archived on its own — you act on its parent, and `_set_page_archived` cascades the flag down onto pinned children only.\n\n### Links\n\n`link_page` / `unlink_page` maintain directed typed edges `from --role--> to`, stored on the source page as `{\"to\": ..., \"role\": ...}`. `_validate_link` rejects a missing target, an archived source, a self-link, an empty role, and a duplicate `(to, role)` pair; the *target* may be archived, since references still resolve. It reads `source.links` directly so it stays correct against the working copy mid-batch, which is what lets the `addLink` page command reuse it.\n\n### Workspace-level\n\n`archive_workspace` / `unarchive_workspace` flip `Workspace.status` through `_set_workspace_status`. `set_workspace_guidance` stores text under a field, validated against `workspace_guidance_fields()` — the union of what the registered page types declare — with an empty string clearing it.\n\n## Cleanup: stamp, back up, prune\n\n`src/cleanup.py` implements the recurring sweep that garbage-collects pages nobody can find. It never imports `store` — the dependency runs one way, `store → cleanup` — and all of its classification is pure, so it unit-tests with no filesystem.\n\n`reachability` walks down from `root_page_ids` through `child_ids` (the same structure the tree renders from; `parent_id` is ignored so a stale pointer can never cause a deletion) and sorts every page into:\n\n- `findable` — reached, nothing archived on the path,\n- `hidden` — reached, but something on the path is archived,\n- `unfiled` — never reached at all.\n\n`classify` then decides one pass. Both orphan arms are stamp targets. A page already carrying an expiry is never re-stamped — otherwise the deadline would move every hour and nothing would ever expire — and a page that became findable again has its stamp cleared. `prune` names only maximal subtree roots (`_descendants` removes covered children), so a nested expired page is deleted once, with its parent. `expiry_for` lands at 12:00 UTC `GRACE_DAYS` (5) days out, uniform so pages stamped the same day share a deadline; real grace therefore ranges from 4½ to 5½ days.\n\n`Store.cleanup_workspace` owns the transaction, and the ordering inside it is the safety property:\n\n```mermaid\nflowchart TD\n    A[cleanup.classify] --> B{prune non-empty?}\n    B -- no --> E[stamp + clear + save]\n    B -- yes --> C[write_backup]\n    C -- OSError --> D[\"abort: SweepReport(error=...node[\")\"]<br/>nothing written\"]\n    C -- ok --> E\n    E --> F[delete_subtree per root]\n```\n\nThe backup is written **before any mutation**, inside the workspace lock, so a prune only ever happens on top of a backup and nothing can land between the two. A backup that fails to write aborts the whole pass — no stamps either, leaving the workspace exactly as it was — and the failure comes back as a `SweepReport` with `error` set rather than an exception.\n\n`delete_subtree` removes the root and every descendant, unlinks the root from wherever it was filed (deleting the flagged page alone would leave its children unfiled), and strips links from surviving pages to removed ones so nothing dangles.\n\nThe timer is a single module-level task. `start_scheduler` is idempotent because both `server.app_lifespan` and `hmr_server.reloader_lifespan` call it (only the latter runs under the dev server), and `PASTA_CLEANUP=0` disables it. The loop wakes every `MAX_SLEEP_SECONDS` (30) and sweeps only when the `:05` tick has just gone by, rather than sleeping the full hour to it. `run_once` sweeps each workspace in its own `try/except`, so one bad workspace neither ends the pass nor kills the timer. For hot reload, `_stop_for_reload` is registered via `on_dispose` to cancel the task before the reloader swaps the module — otherwise the old task survives into the new namespace with nothing left holding a handle to cancel it.\n\n## Ids and injection\n\n`src/ids.py` is the one impure source of identifiers. `new_id(prefix)` produces `prefix:<base36-ms>-<hex6>` (e.g. `architecture:mqtcfkx1-a3f9c1`), time-ordered and collision-resistant. `new_revision_token` produces a short 6-digit stamp.\n\nThe pure core never calls these directly — it takes an `id_factory` argument. `Store.__init__` accepts both `id_factory: IdFactory` and `revision_factory: RevisionFactory`, defaulting to `default_id_factory` / `default_revision_factory`, so tests can inject a deterministic counter and assert on exact ids. `default_id_factory` returns a prefixed id for a non-empty prefix (pages) and a bare token otherwise (list elements).\n\n## Serialization and schema evolution\n\n`serialize.py` is a near-identity mapping — field values are already JSON-able — and exists to pin an explicit, stable on-disk shape independent of the dataclass internals. The asymmetry is where the compatibility lives: `*_to_dict` writes every field, while `*_from_dict` uses `.get` with defaults. That is what lets an older file load: `status` defaults to `\"active\"`, `guidance_config` to `{}`, `archived` to `False`, and `status_revision_token` to `None` (a page created before the feature carries `None` until its first transition).\n\nWhen you add a field to `Page` or `Workspace`, give it a default in the dataclass, write it in `*_to_dict`, and read it with a matching default in `*_from_dict`. If it is a mutable container, copy it on the way through `Page.copy()` as well — `apply_command` relies on that copy to keep the pure path from mutating its input.\n\n## Errors\n\nThe store raises the types in `src/errors.py`, and the distinction is what the server turns into status codes and what an agent is told to do next:\n\n| Error | Raised when |\n| --- | --- |\n| `NotFoundError` | Missing workspace, page, parent, or link edge. |\n| `ValidationError` | Bad input — blank name/title, unknown type tag, dangling ref, invalid status, unknown guidance field, empty batch, naive datetime. |\n| `ConflictError` | Optimistic-concurrency and stale-read failures — revision token mismatch, reparent cycle, anchored-slot mismatch, duplicate link. |\n| `IllegalCommandError` | Legal input, illegal in this state — mutating an archived page, a failing guard, touching a pinned child. |\n| `PastaError` | Corrupt workspace file, or a page whose type is not registered. |\n\n## Contributing notes\n\n- **Anything that writes must hold the transaction lock and re-load inside it.** Mutating a `Workspace` you loaded outside the lock races with every other writer.\n- **Keep cross-page logic here and per-page logic pure.** If a rule needs to look at another page — a ref target, a guard, a link endpoint — it belongs in `Store` and must run *before* `commands.apply_command`, so a rejection leaves nothing written. If it only needs the one page, it belongs in `commands.py` or the page type.\n- **Never write `status_revision_token` or `expires_at` from a page-type command.** The token is the store's; the expiry is the sweep's.\n- **Lock dicts are never evicted.** `_transaction_locks` and `_rw_locks` grow one entry per workspace id touched, for the process lifetime. Fine at current scale, worth knowing if workspace counts grow.\n- **Reads are tolerant, writes are not.** `list_workspaces` swallows a broken file; every write path raises. Preserve that asymmetry — a listing that dies on one corrupt file makes the whole server look down."};

(function() {
  var activePage = 'overview';

  document.addEventListener('DOMContentLoaded', function() {
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });
    renderMeta();
    renderNav();
    document.getElementById('menu-toggle').addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('open');
    });
    if (location.hash && location.hash.length > 1) {
      activePage = decodeURIComponent(location.hash.slice(1));
    }
    navigateTo(activePage);
  });

  function renderMeta() {
    if (!META) return;
    var el = document.getElementById('meta-info');
    var parts = [];
    if (META.generatedAt) {
      parts.push(new Date(META.generatedAt).toLocaleDateString());
    }
    if (META.model) parts.push(META.model);
    if (META.fromCommit) parts.push(META.fromCommit.slice(0, 8));
    el.textContent = parts.join(' \u00b7 ');
  }

  function renderNav() {
    var container = document.getElementById('nav-tree');
    var html = '<div class="nav-section">';
    html += '<a class="nav-item overview" data-page="overview" href="#overview">Overview</a>';
    html += '</div>';
    if (TREE.length > 0) {
      html += '<div class="nav-group-label">Modules</div>';
      html += buildNavTree(TREE);
    }
    container.innerHTML = html;
    container.addEventListener('click', function(e) {
      var target = e.target;
      while (target && !target.dataset.page) { target = target.parentElement; }
      if (target && target.dataset.page) {
        e.preventDefault();
        navigateTo(target.dataset.page);
      }
    });
  }

  function buildNavTree(nodes) {
    var html = '';
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      html += '<div class="nav-section">';
      html += '<a class="nav-item" data-page="' + escH(node.slug) + '" href="#' + encodeURIComponent(node.slug) + '">' + escH(node.name) + '</a>';
      if (node.children && node.children.length > 0) {
        html += '<div class="nav-children">' + buildNavTree(node.children) + '</div>';
      }
      html += '</div>';
    }
    return html;
  }

  function escH(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function navigateTo(page) {
    activePage = page;
    location.hash = encodeURIComponent(page);

    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      if (items[i].dataset.page === page) {
        items[i].classList.add('active');
      } else {
        items[i].classList.remove('active');
      }
    }

    var contentEl = document.getElementById('content');
    var md = PAGES[page];

    if (!md) {
      contentEl.innerHTML = '<div class="empty-state"><h2>Page not found</h2><p>' + escH(page) + '.md does not exist.</p></div>';
      return;
    }

    contentEl.innerHTML = marked.parse(md);

    // Rewrite .md links to hash navigation
    var links = contentEl.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href');
      if (href && href.endsWith('.md') && href.indexOf('://') === -1) {
        var slug = href.replace(/\.md$/, '');
        links[i].setAttribute('href', '#' + encodeURIComponent(slug));
        (function(s) {
          links[i].addEventListener('click', function(e) {
            e.preventDefault();
            navigateTo(s);
          });
        })(slug);
      }
    }

    // Convert mermaid code blocks into mermaid divs
    var mermaidBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
    for (var i = 0; i < mermaidBlocks.length; i++) {
      var pre = mermaidBlocks[i].parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = mermaidBlocks[i].textContent;
      pre.parentNode.replaceChild(div, pre);
    }
    try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}

    window.scrollTo(0, 0);
    document.getElementById('sidebar').classList.remove('open');
  }
})();

</script>
</body>
</html>
