` | `page.html` — sidebar nav + `STORE.render_html()` |\n| `POST .../page/{pageId}/archive` \\| `/unarchive` | archive toggle, then `ws_reloader.refresh()`, 202 |\n| `POST .../page/{pageId}/status` | direct status override (`status` form field), then refresh, 202 |\n\nNote the path shape: the workspace id is split so that the literal `ws:` prefix stays in the URL (`/ws:mrteq0c5-238cf6`), and each handler reassembles `workspace_id = f\"ws:{workspaceIdPart}\"`. Generated links elsewhere (`_page_link` in `render_html.py`) emit `/{workspace_id}/page/{page_id}`, which matches.\n\n`?archived=true` is the single view flag, threaded through `show_archived` into the tree, the nav, and the render context. `?markdown=true` on the page route swaps the structured HTML body for the Markdown render run through `md2html`, which is how you eyeball what the `renderPage` MCP tool would return.\n\nThe page route also feeds `page.html` the controls at the bottom: `page_type.fsm.states` for the status dropdown (with the current one preselected), `page.archived` for the Archive/Unarchive button label, and `page_type_doc = f\"{page.type}-{page.status}\"` for the Model overlay's iframe target under `/sphinx/page-types/`.\n\n### The POST routes are deliberate asymmetries\n\n`archive`/`unarchive` mirror the `archivePage`/`unarchivePage` MCP tools because a browser cannot call MCP. The `status` route has **no** MCP equivalent: it is an admin override that bypasses the FSM entirely, letting a human force any state the type declares. Both kinds fire `ws_reloader.refresh()` exactly as the tools do.\n\n## Live reload\n\n```mermaid\ngraph LR\n  A[file change] --> B[hmr_server]\n  C[MCP write tool] --> D[ws_reloader.refresh]\n  E[web POST route] --> D\n  B --> D\n  D -->|refresh: 1| F[browser _reloader.js]\n  F --> G[location.reload]\n```\n\n`ws_reloader` is a process-wide `ReloaderConnectionManager` singleton living in `src/hmr_live_refresh.py`, **excluded from the hot-reload set on purpose**: it holds live `WebSocket` objects in `self.active`, and re-executing the module on every source change would drop them and silently kill auto-refresh. Both the reactively-reloaded `src.server` and the stable `src.hmr_server` import that one instance.\n\nThe route itself is a keepalive loop:\n\n```python\n@app.websocket(\"/ws/reloader\")\nasync def fastapi_reloader(websocket: WebSocket):\n    await ws_reloader.connect(websocket)\n    # background task sends {\"refresh\": 0} every 5s; inbound frames are discarded\n```\n\n`{\"refresh\": 0}` is a no-op heartbeat; `{\"refresh\": 1}` (sent by `ws_reloader.refresh()`) tells the client to reload. `_reloader.js` closes the socket with code 1000 before reloading, saves `window.scrollY` into `sessionStorage` on `beforeunload`, restores it on `DOMContentLoaded`, and auto-reconnects one second after any close — so a dev-server restart reconnects without a manual refresh. The `window.__ws_reloader_loaded` guard keeps the inlined script idempotent.\n\nThe visibilitychange handler is intentionally inert: reloading on tab focus breaks when the server is offline (the page reloads into nothing). The comment in `_reloader.js` records the intended fix — a server-side timestamp carried on `{refresh: <ts>}` and compared against the page's load-time stamp.\n\n## Structured HTML rendering (`src/render_html.py`)\n\nA second render path exists **by design**. The Markdown renderer (`src/render.py`) is a returned contract — it is what `renderPage` gives an agent — and stays as it is. The HTML path exists because a list element carrying several fields reads badly as one flattened bullet; here each element becomes its own titled card with labelled rows.\n\n`render_page_html(page, page_type, ref_context)` is the only public entry besides `element_view`. It is pure: model objects in, an HTML string out. `Store.render_html()` is what wires it up — it loads the workspace, resolves the page type, builds a `RefContext` via `render.build_ref_context(workspace, show_archived, escape_plain_text=True)`, and calls it.\n\nStructure of the output:\n\n1. `<header>` with title, `type · status`, and the `statusRevisionToken` as `rev …` (so the token a batch needs is readable off the page).\n2. `_contents_html` — a link strip over every section plus `References` and `Child pages`, each carrying its element count.\n3. One `_section_html` per declared section, one `_field_html` per field.\n4. `References` (outgoing typed links with their role) and `Child pages`.\n\nA `toc` page short-circuits: header plus `_children_html` only, because its child list *is* the table of contents.\n\n### Field dispatch\n\n`_field_html` branches on `field_spec.kind`:\n\n- `SCALAR` — a single `<dt>/<dd>` row, keeping its label even when unset; a field keyed `url` becomes a `_url_link`.\n- `PROSE` — `_text_html`: blank lines split paragraphs, single newlines collapse to spaces (matching how a Markdown reflow reads).\n- `LIST` — `_list_html` → `element_view` → `_element_html`.\n- `BLOCKS` — back onto the Markdown pipeline: `render_blocks(value, ref_context)` then `md2html.render(...)`, applied to this one field's fragment rather than the whole document.\n\nEmpty fields render `_NONE_HTML` (`<p class=\"empty\">None.<\/p>`) rather than vanishing, so a page's shape is visible before it is filled.\n\n### `element_view` — the one home of the element display rules\n\n`element_view(element, index, field_spec) -> ElementView` decomposes a stored element *before any HTML exists*, which is why it is the most heavily tested function in the file. Its rules:\n\n- The heading comes from `title_element_field(field_spec)` — the field the **type** declares as the heading (`title` or `name`) — and from nothing else. A type declaring neither yields elements headed by their ordinal alone. An empty heading value still consumes the field, so the field never reappears as a row and an element's shape never moves with an author's edits.\n- `block_element_fields(field_spec)` are pulled out into `block_rows` and rendered after the plain rows, through the Markdown pipeline.\n- Row order is declared-fields-first, then any stored key the type does *not* declare — nothing on the element is hidden. `id` is structural and `status` gets its own chip, so both are excluded.\n- `checkbox_state(status, field_spec.element_fsm)` decides the ☑/☐ glyph; a field with no element FSM gets no checkbox.\n\n`_element_html` then emits the ordinal as a link to `#element-<id>`, so a single item of a long list can be pointed at.\n\n### Escaping and link resolution\n\nEvery author-provided leaf goes through `_escape` (`html.escape(..., quote=True)`) before reaching the output. `_url_link` escapes for both `href` and visible text and emits `target=\"_blank\" rel=\"noopener noreferrer\"`.\n\n`_page_link(page_id, ref_context)` returns the titled `type · status` link for an id, or `None` when it resolves to no page. It resolves **on the value, not on a declared field kind** — a page id can reach a reader as ordinary text inside a list element field, and resolving by value means any such field reads as its target rather than as a bare id. An archived target is prefixed with `(A)` so a reader sees it is archived without following the link, and `show_archived` rides along as `?archived=true` so the archived view survives navigation. Without a `RefContext`, links degrade to escaped bare ids.\n\n## Templates and client scripts\n\n`_base.html` is the root: preloaded water.css light/dark sheets, `styles.css` overrides, an inlined `_reloader.js`, a theme radio form, and an inlined `_theme.js`. The body ships `display:none; visibility:hidden` and is revealed by `_theme.js` after it has applied the stored theme, which avoids a flash of the wrong sheet. `_theme.js` persists the choice in `localStorage`, swaps the `#js-stylesheet` href, mirrors the theme onto a body class, then removes the startup stylesheet.\n\n`_nav.html` extends `_base.html` and adds the two-column layout (sidebar tree + main), plus the **Page | Model** toggle. `_view_toggle.js` lazily sets the iframe `src` from `data-src` on the first Model open — pointing at `/sphinx/page-types/{type}-{status}.html`, the Sphinx doc for this page's type *at its current status* — and overlays it on the rendered body. All three scripts use a `window.__*_loaded` guard, because HMR reloads re-inject them.\n\n`page.html` extends `_nav.html` and adds `#page-actions`: the archive form and, when `statuses` is non-empty, the status override form. Both forms scroll to top on submit; both POST and get a 202 back.\n\nTemplate contexts are passed with `request=request` as the first argument to `TemplateResponse` (the non-deprecated FastAPI signature), and rendered bodies are injected with `| safe` — which is sound only because `render_html.py` and `md2html` own the escaping upstream.\n\nStyling for the structured render lives in `styles.css` scoped entirely under `.pasta-page`, so it cannot reach the sidebar, the workspace index, or the tree view. Every colour is a water.css custom property defined by both sheets, so the whole block follows the theme automatically.\n\n## Running it\n\n```bash\npython main.py                    # HTTP on 0.0.0.0:8000 with hot module reload\npython main.py --port 9000\npython main.py --stdio            # MCP over stdio, no hot reload\n```\n\nThe `--stdio` branch imports `src.server.mcp` directly — safe, because that path has no hot reload. The HTTP branch must **not** import `src.server` at top level; `src/hmr_server.py` imports it through the reactive finder so it becomes hot-reloadable. Importing it eagerly turns the hot reload into a silent no-op.\n\n`PASTA_DATA_DIR` selects the store directory (default `.pasta-data`); it is read once at import, so changing it requires a restart rather than a reload.\n\nThe trailing `from . import _hmr_debug` at the bottom of `src/server.py` is import-for-side-effect: it captures HMR reload errors to `hmr_debug.log`. It sits last, and carries `# noqa: E402, F401`, so a failure inside it cannot prevent the app and tools from being defined.\n\n## Adding to this module\n\n**A new MCP tool.** Add an `async def` under `@mcp.tool` in the right section, wrap the body in `with _guard_tool():`, delegate to a `STORE` method, and — if it writes — `await ws_reloader.refresh()` and include `STORE.next_actions(...)` as `next` in the return value. The docstring is the tool description an agent reads, so it carries the contract (legality rules, rejection conditions, response shape), not just a label.\n\n**A new web route.** Wrap in `with _guard_http():`, reassemble `workspace_id` from the `ws:`-prefixed path part, thread `archived` through as `show_archived`, and render through `templates.TemplateResponse`. A mutating route should mirror an MCP tool where one exists, fire the refresh, and return a 202 — the page reloads via the websocket rather than via the response body.\n\n**A new field kind or element rule.** The display decision belongs in `element_view` (pure, cheap to unit-test) rather than in `_element_html`; the tests in `tests/test_render_html.py` exercise `element_view`, `_field_html`, `_list_html`, `_children_html`, and `render_page_html` directly, with and without a `RefContext`.","other":"# Other\n\n# `tests/` — the pasta test suite\n\nThe suite is one package: a single `conftest.py` that reconfigures the page-type registry for the whole process, plus seventeen test modules layered to match `src/`. There are no markers, no plugins beyond `pytest-testmon`, and no shared fixture library — each module builds what it needs from a handful of small local helpers that repeat, deliberately, across files.\n\nConfiguration lives in `pyproject.toml`:\n\n```toml\n[tool.pytest.ini_options]\npythonpath = [\".\"]\ntestpaths = [\"tests\"]\n```\n\nRun it with `uv run pytest`, or `uv run pytest --testmon` for red-green work (the project hint; `pytest-testmon` is in the dev group).\n\n---\n\n## Test mode: the one thing to understand first\n\n`tests/conftest.py` calls `set_test_mode(True)` **at import**, before collection:\n\n```python\nfrom src.pagetypes._registry import set_test_mode\n\nset_test_mode(True)\n```\n\nThis is not a flag that gates lookups — it *empties* `_registry.REGISTRY` and puts the hand-authored fixtures from `src.testtypes` in its place. The consequences that shape every test in the suite:\n\n- `get_page_type(\"test-fields\")` resolves; `get_page_type(\"feature-brief\")` raises `ProductionTypeInTestError`.\n- `registered_pagetypes()` returns `TEST_REGISTRY`, so anything that enumerates the registry — the `describePageType` listing, doc generation in `src.docsgen` — sees only fixtures.\n- Reaching past the accessor into `_registry.REGISTRY` finds `{}`, so a test cannot depend on a production type by reading the map directly either.\n- `store.create_page(ws, \"test-fields\", ...)` works under test; the same call on a live server is a `ValidationError`.\n\nThe flag is set at import because test modules resolve their page types at module level (`FIELDS = get_page_type(\"test-fields\")`). Nothing restores it — the flag lives for the process, and the process is the run.\n\nA test that genuinely needs production asks for the `production_mode` fixture:\n\n```python\n@pytest.fixture\ndef production_mode():\n    set_test_mode(False)\n    yield\n    set_test_mode(True)\n```\n\nIt's used sparingly and always for the same reason: the assertion is *about* the production set. `test_docsgen.test_page_machine_qualname_resolves_for_every_production_type`, `test_fsm.test_every_production_page_type_holds_its_machine`, `test_statecharts` (both tests), and `test_pagetypes.test_production_types_are_exactly_the_registered_ones` are the whole list. `tests/test_testtypes.py` uses it most, because that file owns the seam itself.\n\n## The fixture page types\n\n`src.testtypes` supplies purpose-built capability fixtures — not clones of production types. The membership is pinned in `test_testtypes.TEST_TAGS`:\n\n| Tag | Demonstrates |\n| --- | --- |\n| `test-fields` | scalar / enum / prose / list fields, `set_element_field`, anchored reorder |\n| `test-blocks` | the full blocks vocabulary (all standard kinds), single-state FSM |\n| `test-element-blocks` | block-bearing element fields (`snippet`, `detail`), element-scoped add/remove/reorder |\n| `test-flow` | a 3-state status FSM, a compound `close`, a terminal state that keeps a transition |\n| `test-lifecycle` | a rich lifecycle FSM, required-field preconditions, element-FSM questions, auto-children |\n| `test-child` | step/check element FSMs, a `legal_in` content lock, a pinned child with a cross-page ref |\n\nThe payoff is stated in almost every module docstring: enriching a production page type never churns these assertions. When you add a capability, add it to the fixture that owns that axis — or, if none does, prefer extending an existing fixture over minting a seventh.\n\n`test-flow` earns special mention: its event `open` and its state `open` share a name on purpose, so `src.fsm` has to keep the two namespaces distinct.\n\n## Layering\n\n```mermaid\nflowchart TD\n  A[\"test_server.py · test_web.py · test_workspace_guidance.py<br/>in-memory MCP client, FastAPI TestClient\"] --> B\n  B[\"test_store.py · test_cleanup.py<br/>real files, locks, transactions\"] --> C\n  C[\"test_commands.py · test_fsm.py · test_describe.py<br/>test_render.py · test_render_html.py · test_docsgen.py<br/>pure functions, no I/O\"] --> D\n  D[\"test_pagetypes.py · test_testtypes.py<br/>declaration integrity, the registry seam\"]\n```\n\nEach tier assumes the one below is already covered and does not re-test it. Concretely:\n\n- `test_commands.py` builds pages straight from `create_page` and never touches a `Store`. Its docstring on `addLink` is the rule in miniature: *the pure core appends the edge to `Page.links`; cross-page validation — existence, dedup — is the store's job.*\n- `test_cleanup.py` builds `Workspace` objects from `src.model` by hand (`_ws` / `_p` helpers) because classification is pure. The store-backed transaction is covered once, in `test_store.py`.\n- `test_store.py` exercises real files: persistence across a fresh `Store` over the same directory, atomic replace, and the readers-writer lock under contention.\n- `test_server.py` and `test_web.py` drive the top layer end to end and assert wiring, not semantics.\n\n## Shared idioms\n\n### The deterministic id factory\n\nEvery module that calls into the pure core carries its own copy, named `make_counter` or `_counter`:\n\n```python\ndef make_counter():\n    state = {\"n\": 0}\n\n    def factory(prefix: str) -> str:\n        state[\"n\"] += 1\n        return f\"{prefix}:{state['n']}\" if prefix else f\"el{state['n']}\"\n\n    return factory\n```\n\nPages get `<prefix>:N`, elements and blocks get `elN`. Reuse one factory across a chain of `apply_command` calls in a single test so ids stay stable and orderings are assertable.\n\n### Threading the revision token\n\n`mutate_page_batch` requires each command to present the page's current `status_revision_token` inside its `args`. Three modules carry a near-identical `_mutate` wrapper that reads the token and stamps it on, because that is the ordinary caller pattern — read, then write against what you read:\n\n```python\ndef _mutate(store, workspace_id, page_id, commands):\n    token = store.get_page(workspace_id, page_id).status_revision_token\n    stamped = [{**command, \"args\": {\"statusRevisionToken\": token, **(command.get(\"args\") or {})}}\n               for command in commands]\n    return store.mutate_page_batch(workspace_id, page_id, stamped)\n```\n\n`test_server.py`'s version goes through `getPage` and reads the raw serialized `status_revision_token` key instead. A batch that transitions mid-sequence is *not* expressible through these helpers — a transition regenerates the token, so a later command's stamp is stale by construction. Tests covering that case present tokens explicitly (see the `status_revision_token` section at the tail of `test_store.py`, and the `revstore` fixture there that makes tokens a predictable `\"000001\"`, `\"000002\"`, … sequence).\n\n### Repointing the module-global store\n\nBoth integration entry points resolve `server.STORE` at call time, so the fixture just reassigns it:\n\n```python\n@pytest.fixture\ndef mcp(tmp_path):\n    server.STORE = Store(tmp_path)   # tools resolve STORE from the module at call time\n    return server.mcp\n```\n\n`test_web.py` does the same and hands back a `TestClient(server.app)`. MCP calls go through `fastmcp.Client` against the in-memory server, wrapped in a local `call(mcp, name, args)` that runs the coroutine with `asyncio.run`.\n\n### Ad-hoc, unregistered page types\n\nWhere no fixture covers the case — and adding one would be overreach — tests construct a `PageType` inline and never register it. These are conventionally tagged `xtest-*`:\n\n```python\npage_type = PageType(\n    tag=\"xtest-terminal-optin\", name=\"Opt-in\", description=\"ad-hoc\",\n    sections=(SectionSpec(\"note\", \"Note\", (_prose(\"body\", ...),)), ...),\n    commands=(set_prose_cmd(\"note\", legal_in=(\"open\",)), transition_cmd(\"finish\", \"open -> done\")),\n    fsm=FSMSpec(name=\"XOptIn\", initial=\"open\", states=(\"open\", \"done\"), terminal_states=(\"done\",)),\n)\n```\n\nThis is how `test_commands.py` reaches `field_setter_edges` blocks-grouping, how `test_fsm.py` proves a machine that cannot be built is *held as an error* rather than raised at construction, and how `test_pagetypes.py` feeds `validate_page_types` a type with two independent defects to confirm both surface in one raise. Each such helper carries a comment saying why a shared fixture wouldn't do.\n\n### Parametrized structural invariants\n\n`test_pagetypes.py` is the integrity harness. Its first ~370 lines are `@pytest.mark.parametrize(\"tag\", list(ALL_TYPES))` invariants that must hold for *every* page type:\n\n```python\nPRODUCTION_TYPES = {page_type.tag: page_type for page_type in (\n    _ARCHITECTURE, _DECISION_RECORD, _BUG_REPORT, _SIMPLE_CHANGE, _FEATURE_BRIEF, ...)}\nALL_TYPES = {**PRODUCTION_TYPES, **TEST_REGISTRY}\n```\n\n`PRODUCTION_TYPES` is written out by hand, importing each `_CONSTANT` from its module, precisely because test mode empties `REGISTRY` — the invariants must keep covering production regardless. `test_production_types_are_exactly_the_registered_ones` (under `production_mode`) is the guard that keeps that hand-written list honest; it is what fails when someone adds a page type and forgets the list.\n\nThe invariants themselves cover: FSM well-formedness, transition commands declaring a real source and a single destination per event, content commands targeting real `section.field` pairs, `requires` pointing at real fields, element transitions firing events their field's element FSM declares, block commands targeting `BLOCKS` fields (or a `LIST` field's declared block-bearing element field), and — the \"extend to all fields\" contract — every ordered field having its matching reorder command.\n\nBelow that divider the file switches to content-specific assertions pinned to the fixtures, then to the validator surface (`validate_page_type`, `validate_page_types`, `validate_registry`).\n\n## Module notes\n\n**`test_commands.py`** — the largest pure-core file. Organized by capability with `# ---` banners: create, scalar/enum, prose, list add/remove/set-element-field, argument validation, purity (`test_apply_command_does_not_mutate_input`), anchored reorder, then per-fixture sections for `test-flow`, `test-lifecycle`, `test-child`, and block-bearing element fields. `resolve_anchored_slot` gets its own direct tests — it is the shared guard behind block reorder, element reorder, and `store.reorder_page` — including the `BatchContext` case where ids created earlier in the same batch are opaque and the guard walks left past them.\n\n**`test_fsm.py`** — pins that page types own their status machine: `PageType.__post_init__` builds it, a machine that can't be built (an unreachable state) is *kept* as `fsm.machine_error` rather than raised, and `sm_registry._REGISTRY[f\"src.fsm.{name}\"]` is the library's record that the build happened. Nothing in the production loops builds a machine, so finding one on every spec is the evidence that construction did it.\n\n**`test_describe.py` / `test_docsgen.py`** — the read-only introspection and doc-generation surfaces. `test_docsgen` asserts registry-wide coverage (`all_state_docs` covers every reachable state of every registered type), idempotency, and that the `statemachine-diagram` directive paths resolve — against `src.testcharts` under test mode, `src.statecharts` under `production_mode`.\n\n**`test_store.py`** — the largest file overall. Beyond CRUD and persistence it owns the page tree (reparent/reorder), the link graph, pinned auto-created children, the cleanup transaction, and the revision-token protocol. The concurrency tests are the load-bearing ones: 20 threads released together by a `threading.Barrier` must all land their `addItem` (no lost updates), a reader arriving mid-replace waits for the destination copy rather than reading the old file, and writer preference holds.\n\n**`test_rwlock.py`** — pure threading, no I/O. Pins the exclusion rules `src.store` relies on: concurrent readers, writer excludes readers, a waiting writer blocks arriving readers, the write lock is reentrant for its owner and released only at the outermost exit, and `read()` inside `write()` does not deadlock. Uses `Event`/`Barrier` with short negative-wait timeouts (`assert not event.wait(timeout=0.2)`) to assert blocking.\n\n**`test_serialize.py`** — round-trip plus a forward-compat pattern worth copying: for each field added since the format was first written (`links`, `expires_at`, `status_revision_token`), one test round-trips it and one deletes the key from a serialized dict to prove a legacy file still loads.\n\n**`test_testtypes.py`** — owns the seam and nothing else. The fixtures' internal *shape* is asserted by whichever test exercises that capability; their structural well-formedness comes from `test_pagetypes`'s parametrized loop. This file only checks that the mode swaps the map, empties `REGISTRY` rather than merely gating it, restores it *in place* (so a reference taken before the switch is still live), and that resolution and the listing read that same one map.\n\n## Adding tests\n\n- **Pick the tier.** If the behaviour is pure, test it from `create_page` / `apply_command` without a `Store`. Only drop to `test_store.py` if files, locks, or cross-page validation are actually involved.\n- **Use a fixture page type, and prefer an existing one.** `ProductionTypeInTestError` exists to steer you here. Reach for an ad-hoc `xtest-*` `PageType` only when the case is genuinely not a capability any fixture should own — and say so in a comment.\n- **Extending a fixture is a registry change.** A new field or command on a `test-*` type must satisfy the parametrized invariants in `test_pagetypes.py`; the \"every ordered field has a reorder command\" rule in particular catches half-finished additions.\n- **Adding a production page type** means updating `PRODUCTION_TYPES` in `test_pagetypes.py` and binding its status machine — `test_page_machine_qualname_resolves_for_every_production_type` is what fails when the binding is missed.\n- **Write the comment that says why.** The suite's prevailing style is a one-line explanation of what would break without the assertion (`\"returns; does not hang\"`, `\"the original untouched\"`, `\"a zero means unseen\"`), rather than a restatement of the code.","overview":"# pasta — Wiki\n\n# pasta\n\n**A structured wiki over MCP that tells your coding agent what to do next, and won't let it skip ahead.**\n\nPasta is a single Python service that serves two audiences from one process: coding agents over MCP, and humans over a read-only web UI. The things a project needs to write down — features, bug reports, decision records, architecture notes — live in it as **typed pages**, and every page carries a **status state machine**.\n\nThe point is *when* instructions arrive. A process written into a prompt is read once and then competes with every token that follows. In pasta, the instruction is stored against the state, and the state machine decides when the agent gets to see it. Every write answers with the moves that are legal right now, the guidance for the exact stage the work is in, the edges that are blocked and why, and the sign-offs only a human may cross.\n\n> *Pages are driven by an FSM, and an FSM is of course the Flying Spaghetti Monster. Hence pasta.*\n\n## The big idea, in one paragraph\n\nA **page type** is a declaration, not a class: a frozen dataclass naming the sections and fields a page is made of, the commands that may edit them, and the state machine its status moves through. Nothing downstream branches on the type — the MCP tool surface, the mutation engine, the renderer and the docs generator all read that one declaration. Adding a new lifecycle to pasta means writing a new `PageType` value and registering it; no consumer changes.\n\n## Architecture\n\nThe codebase is a **pure core wrapped in a thin stateful shell**. Everything that touches the filesystem, takes a lock, generates an id or reads the clock lives in exactly one module. Everything else takes values and returns values.\n\n```mermaid\ngraph TD\n    Clients[\"Agents (MCP) · Humans (HTML)\"]\n    Server[\"MCP Server & Web Interface<br/>src/server.py\"]\n    Store[\"Workspace Store<br/>src/store.py\"]\n    Disk[(\"One JSON file<br/>per workspace\")]\n\n    subgraph core[\"pure core — no I/O\"]\n        Commands[\"Command &amp; Mutation Engine\"]\n        FSM[\"State Machines &amp; Statecharts\"]\n        Framework[\"Page Type Framework\"]\n        Types[\"Page Type Definitions\"]\n        Render[\"Markdown Rendering\"]\n    end\n\n    Clients --> Server\n    Server --> Store\n    Server --> Render\n    Store --> Disk\n    Store --> Commands\n    Store --> Render\n    Commands --> FSM\n    Commands --> Framework\n    Types --> Framework\n    Framework --> FSM\n```\n\nRead it top to bottom: requests come in at the top, the store is the only layer that persists anything, and everything inside the box is deterministic and testable without a server.\n\n- [MCP Server & Web Interface](mcp-server-web-interface.md) builds one FastAPI app exposing MCP at `/pasta/mcp` (or stdio) and HTML at `/`, `/ws:<id>` and `/ws:<id>/page/<pageId>`. It is a deliberately uniform adapter: unwrap arguments, delegate to `Store`, fire a browser refresh on every write.\n- [Workspace Store & Persistence](workspace-store-persistence.md) is the stateful shell. One JSON file per workspace holds the metadata and every page in it, written copy → edit → batch → overwrite under a transaction lock, so there is no partial write and no per-page file to keep consistent.\n- [Command & Mutation Engine](command-mutation-engine.md) is the pure write path: given a `Page`, its `PageType`, a command name and an args dict, it returns a *new* `Page`. It never touches disk, the clock, or the input page — and [src/errors.py](command-mutation-engine.md) is the failure vocabulary it raises.\n- [State Machines & Statecharts](state-machines-statecharts.md) answers \"is this transition legal?\" and \"what status does it leave the page in?\" — every other layer defers to it rather than re-deriving status rules from a transition table.\n- [Page Type Framework](page-type-framework.md) defines what a page type *is* (specs, fields, commands, guards, validation); [Page Type Definitions](page-type-definitions.md) holds the actual lifecycles — feature, epic, simple change, bug report, decision record, architecture, document, TOC — one module each, plus the registry that resolves a tag to a type.\n- [Markdown Rendering](markdown-rendering.md) turns model objects into strings: a single page, a whole tree, a workspace. Everything it needs about *other* pages arrives as an explicit `RefContext`, which is why it needs no store to test.\n- [Introspection & Documentation Generation](introspection-documentation-generation.md) projects the registry into JSON schemas for `describePageType` / `describeMutations` and renders a generated Sphinx reference from the same source of truth.\n- [Developer Tooling & Hot Reload](developer-tooling-hot-reload.md) is the dev-time scaffolding: one uvicorn process that hot-reloads both surfaces in place, so editing a status or a line of stage guidance is live on the very next MCP request without dropping connected agent sessions.\n- [Test Fixtures](test-fixtures.md) are hand-authored page types that exist only to be tested against — capability demos, not clones of production types, so enriching a real lifecycle doesn't break a hundred assertions. The [test suite](other.md) itself layers to match `src/`.\n- [Project Documentation](project-documentation.md) covers the human-facing `README.md` and the agent-facing `CLAUDE.md` / `AGENTS.md`.\n\n## Key end-to-end flows\n\n**A write.** An agent calls a mutation tool. [`src/server.py`](mcp-server-web-interface.md) unwraps the arguments and hands them to [`Store`](workspace-store-persistence.md), which takes the workspace lock, loads a fresh in-memory copy, and runs the cross-page prechecks — the ones that no single page can answer alone, like whether a parent's gate is still held open by a child's unfinished step. It then calls into [`commands`](command-mutation-engine.md) for each mutation in the batch. Legality of any status move is asked of [`fsm`](state-machines-statecharts.md), and the shape of every field comes from the page's [declaration](page-type-framework.md). The resulting pages are serialized to a temp file and copied over the destination; if anything raised, nothing on disk moved. The response carries the `next` block: `do`, `blocked`, `humanGates`, `attention`.\n\n**A read.** `renderPage` enters at the server, goes through the store for the workspace snapshot, and then walks the page tree in the renderer — `render_tree` → `walk` → `render_page` → per-field rendering, where list elements that carry their own small state machines render as checkboxes and free text is escaped on the way out. The same rendering path feeds both the MCP text response and the HTML view.\n\n**A structural change.** Archiving, unarchiving, renaming, reparenting and reordering are store operations rather than page-type commands, because they change relationships between pages. They still consult the registry — unarchiving a page asks whether it is a pinned child of its parent's type before letting it back into the tree.\n\n## Setup\n\nRequires **Python 3.14** and [uv](https://docs.astral.sh/uv/).\n\n```text\nuv sync\nuv run python main.py        # http://localhost:8000\n```\n\nThat serves the MCP endpoint at `/pasta/mcp` and the web UI at `/` from one process, with hot reload on. Pass `--stdio` instead if your MCP client spawns the server as a subprocess.\n\nPoint a client at it:\n\n```json\n{\n  \"mcpServers\": {\n    \"pasta\": { \"type\": \"http\", \"url\": \"http://localhost:8000/pasta/mcp\" }\n  }\n}\n```\n\nWorkspaces are plain JSON files under `./.pasta-data` (override with `PASTA_DATA_DIR`), backed up before the hourly cleanup sweep deletes anything.\n\nDay-to-day tasks run through [just](https://github.com/casey/just):\n\n```text\njust test        # full suite\njust testincr    # incremental (pytest --testmon)\njust types       # basedpyright\njust main        # run the server\njust docs        # generate page-type docs + Sphinx site\njust dev         # server and a live docs site, in parallel\n```\n\n## Where to start reading\n\nIf you want to **understand the model**, start at [Page Type Definitions](page-type-definitions.md) — open `src/pagetypes/feature.py` and read a lifecycle as data, then `src/pagetypes/_stage_guidance.py`, where the whole process lives as prose in one file. If you want to **understand the machinery**, follow a single tool call down: [server](mcp-server-web-interface.md) → [store](workspace-store-persistence.md) → [commands](command-mutation-engine.md) → [fsm](state-machines-statecharts.md). If you want to **add a page type**, you need only [Page Type Framework](page-type-framework.md) and a new module beside its siblings; the tool surface, the renderer and the generated docs pick it up from the registry on their own.","page-type-definitions":"# Page Type Definitions\n\n# Page Type Definitions (`src/pagetypes/`)\n\nEvery page in pasta is an instance of a **page type**: a declaration of what sections a page has, what commands may edit them, what lifecycle statuses it moves through, and what must be true before it may move. This module holds those declarations — one module per type — plus the registry that resolves a tag to a type.\n\nThe declarations are pure data. Nothing here reads or writes a page, evaluates a guard, or renders anything. `PageType` is a frozen dataclass; the modules beside it are almost entirely one large literal each. All behaviour lives in the consumers (`src/store.py`, `src/commands.py`, `src/render*.py`, `src/describe.py`), which read these declarations to decide what is legal, what to persist, and what to advertise over MCP.\n\n## Layout\n\n| Path | Holds |\n| --- | --- |\n| `core/specs.py` | The kind constants (`SCALAR`/`PROSE`/`LIST`/`BLOCKS`, the command kinds) and the spec dataclasses that depend on neither a field nor a page type: `FSMSpec`, `ElementFSMSpec`, `RefCheck`, `ChildStateGuard`, `ParentStateGuard`, `AutoChildSpec`, `WorkspaceGuidanceSpec` |\n| `core/args.py` | `ArgSpec`, `BlockKindSpec`, `ElementBlocksSpec`, the arg helpers (`_text`, `_integer`, `_boolean`, `_array`, `_object`) and the block-kind helpers (`_paragraph_runs`, `_code_block`, `standard_blocks`, …) |\n| `core/fields.py` | `FieldSpec`, `SectionSpec`, and the declaration helpers `_scalar` / `_prose` / `_list` / `_blocks` |\n| `core/commands.py` | `CommandSpec` and the command factories (`set_prose_cmd`, `list_cmds`, `blocks_cmds`, `transition_cmd`, …) |\n| `core/pagetype.py` | `PageType`, its post-init setup, and the accessors `get_pagetype_field` / `get_pagetype_command` / `initial_sections` |\n| `core/validation.py` | Declaration-time validators plus the runtime block/inline-run grammar checks the command layer calls |\n| `architecture.py`, `bug_report.py`, `decision_record.py`, `document.py`, `epic.py`, `feature.py`, `simple_change.py`, `toc.py` | The twelve page types, one module per type — except `feature.py` and `epic.py`, which each declare a parent plus the children pinned under it |\n| `_stage_guidance.py` | The per-status stage instructions a type hangs on its FSM |\n| `_workspace_guidance.py` | The field names and descriptions for per-workspace configurable guidance |\n| `_registry.py` | `REGISTRY`, the accessors every consumer reads through, `validate_registry()`, and the test-mode switch |\n\n`__init__.py` and `core/__init__.py` deliberately re-export nothing — consumers import from the concrete submodules, so there is no export list to keep in step.\n\n## What a `PageType` declares\n\n```python\nPageType(\n    tag,                  # the stable identifier (\"feature-brief\")\n    name,                 # human label (\"Feature (root)\")\n    description,          # what the type is for, and when to pick it over a sibling\n    sections,             # tuple[SectionSpec, ...] - the content model\n    commands,             # tuple[CommandSpec, ...] - the whole authoring surface\n    fsm,                  # FSMSpec - the page's status lifecycle\n    auto_children=(),     # pinned children created with the page\n    workspace_guidance=(),# per-workspace texts surfaced at some statuses\n)\n```\n\n### Sections and fields\n\nA section is a named group of fields; a field is one of four kinds, each with a helper so the declaration reads as prose:\n\n| Helper | Kind | Shape on the page | Empty default |\n| --- | --- | --- | --- |\n| `_scalar(\"kind\", choices=...)` | `SCALAR` | one value, optionally an enum | `None` |\n| `_prose(\"body\")` | `PROSE` | one text blob | `\"\"` |\n| `_list(\"items\", element_fields=(...))` | `LIST` | ordered id'd elements, each with the named fields | `[]` |\n| `_blocks(\"body\", block_kinds=(...))` | `BLOCKS` | ordered id'd typed blocks | `[]` |\n\n`initial_sections(page_type, existing=None)` produces those defaults. It is idempotent: passing an existing page's sections backfills only what the type has gained since, so the same function seeds a new page and migrates an old one.\n\nEvery `FieldSpec.description` is the field's **authoring instruction** — the long, indented text you see throughout `feature.py` and friends. It is dedented and stripped in `FieldSpec.__post_init__`, and it belongs on the field exactly once: `validate_pagetype_setter_descriptions` rejects a command that copies it into its own description. The instruction reaches an agent through `describePageType`'s `sections` listing.\n\nA `LIST` field can carry two extras. `element_fsm=` gives each element its own tiny lifecycle (below), and `element_blocks=(ElementBlocksSpec(\"detail\", (...)),)` makes one element field hold blocks rather than a scalar — `implementation-plan`'s steps are the only production use, where each step's `detail` is a paragraph/code array. `title_element_field()` decides whether elements render with a heading, and it reads only the declaration: a list naming `title` or `name` in `element_fields` heads every element, one naming neither heads none.\n\n### Commands\n\nA command is a `CommandSpec`: a name, a kind, the args it takes, the `(section, field)` it targets, and where it is legal. The factories in `core/commands.py` are pure and return one spec or a tuple to spread into `commands=(...)`:\n\n| Factory | Produces |\n| --- | --- |\n| `set_prose_cmd(section)` | `set<Section>` for a prose field |\n| `set_scalar_cmd(section, field)` | `set<Field>` for a scalar |\n| `list_cmds(section, ...)` | `add<Noun>` / `remove<Noun>` / `reorder<Noun>`; any subset via `add=`/`remove=`/`reorder=` |\n| `element_cmds(section, marks=...)` | one `ELEMENT_TRANSITION` per mark, each led by the derived `<noun>Id` |\n| `set_element_field_cmd(section, name=, const=)` | stamps a fixed `(field, value)` onto one element — the flag shape (`markCommitStale`, `escalateQuestion`) |\n| `blocks_cmds(section)` | a blocks field's whole surface: add / remove / reorder |\n| `element_blocks_cmds(section, element_field)` | the same three for a block-bearing element field (`addStepDetail`, …) |\n| `transition_cmd(name, \"from -> to\")` | a page-status edge |\n| `transition_on_add_cmd(...)` | a `COMPOUND` that adds an element **and** fires a transition atomically |\n| `add_link_cmd()` / `set_title_cmd()` | the two universal commands, always legal, on every authorable type |\n\nNames and the `<noun>Id` argument are **derived** from the section/field, so the minimal call carries no plumbing: `list_cmds(\"constraints\", ...)` yields `addConstraint` / `removeConstraint` / `reorderConstraint`. The singularizer (`_singular`) handles `codeReferences → codeReference` and `dependencies → dependency`; where it misfires you pass `singular=`. Both real cases are in the tree and commented: `dispatches` would derive `addDispatche`, and `acceptance.criteria` would derive `criteria`.\n\nTwo structural invariants hold by construction rather than by convention: every `LIST` field gets a reorder, and every add supports a positioned insert. The shared `_INDEX` / `_PRECEDING` args carry that — `index` is the destination slot and `precedingId` is the stale-read guard, the id the caller expects immediately before it. Reorders use a required `toIndex` plus the same `precedingId`.\n\nThere is **no in-place block edit**. A block is replaced by removing it and adding at its slot, which the add's `index`/`precedingId` already express; the replacement gets a new id.\n\nTwo rules the validators enforce on a type's command set:\n\n- At most one *field setter* (`SET_SCALAR` / `SET_PROSE` / `ADD_ELEMENT` / page-level `ADD_BLOCK`) per `(section, field)`. `is_field_setter` is the shared classifier, and the self-direction `do` list names one command per field, so a second would be silently dropped rather than reported.\n- Every block-carrying argument must resolve to a real blocks field. `PageType` fills those vocabularies in best-effort; `validate_pagetype_block_args` is the matching check.\n\n### The status FSM\n\n`FSMSpec` stores the status set, the initial status, the terminal statuses and the per-status guidance — but **not** the transition table. That is derived from the commands by `_status_transitions(page_type)`: every `TRANSITION` or `COMPOUND` command with an `event` and a `dest` owns one edge, and `legal_in` supplies its source statuses. A command legal in several statuses expands to one `(event, source, dest, agency)` tuple per source. Nested `COMPOUND` sub-steps are not walked — the outer command owns the edge.\n\nThat is why `transition_cmd` reads the way it does: the description *is* the edge.\n\n```python\ntransition_cmd(\"submitForReview\", \"building -> review\")\n```\n\n`->` becomes `→`, the destination is the first word after the arrow (a trailing parenthetical is ignored, so `\"review -> shipped (human gate)\"` resolves to `shipped`), and the text before the arrow is the source unless `legal_in=` overrides it — which it must for a multi-source edge such as `abandon`. `event` defaults to the command name.\n\nOn top of FSM topology a transition may carry:\n\n- `requires=((section, field), ...)` — content that must be populated first. This is why `beginGrounding` needs only the summary while `beginSpec` needs the whole grounded base.\n- `guards=` / `parent_guards=` — cross-page preconditions, evaluated in the store (below).\n- `agency=\"agent\" | \"human\" | \"either\"` — who may fire it. `ship` and `close` are human gates.\n\n`terminal_states` is a blanket authoring lock: while a page sits in one, `legal_commands` (`src/commands.py`) refuses every authoring command but leaves status transitions alone, so a terminal status can still offer `reopen` or `author`. It is an explicit declaration, never inferred from a status having no outgoing edges. A single command can opt back in by naming the terminal status in its `legal_in` — the one production case is a decision record's `supersededBy`, `legal_in=(\"authoring\", \"accepted\")`, because a record is overtaken long after it is accepted.\n\n`legal_in` on a content command is the finer-grained alternative: the planning children use no `terminal_states` at all and instead scope structural edits to `(\"draft\",)` while leaving execution marks legal in `(\"draft\", \"ready\")`.\n\n### Element lifecycles\n\n`ElementFSMSpec` gives one list element its own small state machine — a step's `todo`/`done`, a case's `pending`/`passed`/`failed`, a dispatch's five states. Unlike the page FSM it **keeps its own transition table**, because an `element_transition` command names only the event it fires (its `legal_in` is the *page* status lock, not the element's source state), so there is nothing to derive.\n\n`checkmark_done` names the state that renders as `[x]`; the `initial` state is then `[ ]`, and every other state — and every element FSM leaving it `None` — renders with no box.\n\nOne spec may be declared on several page types (`_QUESTION_FSM` is declared in both `feature.py` and `epic.py`). `machine` and `machine_error` are excluded from the dataclass's identity and compare, so a shared spec stays one value.\n\n### Blocks\n\nA `BLOCKS` field declares a closed vocabulary of `BlockKindSpec`s, each with `body_args`. `standard_blocks()` is the full set (paragraph, heading, code, list, quote, table, divider) and only `document` takes it whole; typed pages take a narrow slice — `architecture.details` accepts a rich paragraph and a code block, `decision-record.consequences` accepts paragraphs only.\n\nThe same `kind` name can carry a different body in a different field, which is what a per-field override is: `_paragraph_runs()` gives a paragraph rich inline runs, `_paragraph_text()` gives it one plain `text` arg. Rich text is an array of **inline runs** — a bare string, `{\"text\", \"bold\"?, \"italic\"?, \"href\"?}`, `{\"code\"}`, or `{\"ref\": pageId}` — and markdown emphasis inside a text run is rejected outright (`_MARKDOWN_TOKENS`), so emphasis is structural.\n\nA block's kind travels as data inside the add's argument, which is what replaces one add command per kind. The field declares its vocabulary once; `PageType._resolve_block_vocabularies` copies it onto the argument so the command layer and the validator read a single declaration. `feature-spec.decisions` shows why a `BlockKindSpec` can own a `ref_check`: the referencing argument (`questionId`) lives *inside* a block, not flat on a command.\n\n### Cross-page declarations\n\nFour specs describe things a single page cannot check itself. All four are evaluated in `src/store.py`, which can see other pages; the declaration here says only what must hold.\n\n| Spec | Meaning |\n| --- | --- |\n| `RefCheck(arg, scope=\"parent\", section, field)` | the named argument must be an existing element id in the parent's list field; a dangling id aborts the commit |\n| `ChildStateGuard(child_type, allowed, message, section=, field=)` | over children: page form checks the child's own status; element form checks every element in that child's list field |\n| `ParentStateGuard(parent_type, required_statuses, message)` | the mirror image — the parent's status must be in the set; a page with no such parent is unconstrained |\n| `AutoChildSpec(type)` | a child created in the same commit as the page. Being an auto-child is what makes a page *pinned*: it cannot be reparented, reordered, or archived alone. The fact lives on the parent type and is never stored on the child |\n\nChild guards are checked before parent guards, in both `_first_guard_failure` and `_check_guards`.\n\n### Guidance\n\nTwo kinds, both surfaced to agents rather than enforced:\n\n**Stage guidance** (`_stage_guidance.py`) is the instruction a page hands an agent on entering a status, declared as `status_guidance=((\"building\", BUILDING), ...)` and normalized by `FSMSpec.__post_init__` exactly as a field description is. It lives in its own module so one working discipline can reach several types and can be read as prose. The naming rule is load-bearing: a **bare** name is the only text for that status anywhere (`REVIEW`, shared by `simple-change` and `bug-report`), while a **prefixed** name is one type's own take on a status several types claim (`FEATURE_BRIEF_REVIEW`, `BUG_REPORT_DRAFT`, `SIMPLE_CHANGE_DRAFT`).\n\n**Workspace guidance** (`_workspace_guidance.py`) is mutable and per-workspace: only the field name and description are fixed in code. Two fields exist — `mergeProcess` and `testingTool` — declared by `bug-report`, `simple-change` and `feature-brief` with `guidance_for` naming the statuses at which each shows. The descriptions are constants because `validate_workspace_guidance` requires every type sharing a field to give it the same description.\n\n## From declaration to served surface\n\n```mermaid\ngraph LR\n  M[\"page-type module<br/>(PageType literal)\"] --> P[\"PageType.__post_init__<br/>resolve block vocab<br/>derive FSM table<br/>build machines\"]\n  P --> R[\"REGISTRY<br/>tag → PageType\"]\n  R --> V[\"validate_registry()<br/>one aggregated ValueError\"]\n  V --> C[\"store / commands / render<br/>describe / docsgen\"]\n```\n\n`PageType.__post_init__` does the setup a declaration needs before anything reads it, in order: resolve each block argument's vocabulary from its target field, write the derived transition table onto the FSM, then build the status machine and every element machine the type declares (via `try_build_machine` in `src/fsm.py`). The build is each spec's own well-formedness check, so it runs at declaration rather than first use — but a failure is *held* in `machine_error`, not raised, so one bad type does not stop the package importing. `validate_page_machine` is what reports it.\n\nWell-formedness is a separate concern from setup. `validate_page_types(REGISTRY)` walks every type — every field, the FSM spec, the built machine, the field-setter and description rules, the block arguments — and raises one aggregated `ValueError` listing every finding, each prefixed with the page tag. `validate_registry()` is the single entry point the primary flows call (server start, HMR reload), so a misconfigured type fails loudly at load rather than surfacing piecemeal in a request.\n\n## The registry and test mode\n\n`_registry.py` holds `REGISTRY` (tag → `PageType`), but **read it through `registered_pagetypes()`**, not directly. The accessor is what applies test mode, so resolution, the `describePageType` listing and doc generation all agree on which types exist. `get_page_type(tag)` adds the off-limits guard and returns `None` for an unknown tag.\n\nTest mode swaps the hand-authored `test-*` fixtures in `src/testtypes.py` in for the production types. Entering it **empties** `REGISTRY` into a private stash and leaving puts it back, so production types are unreachable through the map itself and not merely behind the accessors. The map is mutated in place and never rebound, so a reference taken before the switch stays live. `guard_production_type` reads the stash and raises `ProductionTypeInTestError` from both resolution and creation, steering a test toward a fixture instead of leaving it with a missing type. `tests/conftest.py` flips it on for the whole run at import, ahead of collection.\n\nTwo more accessors round it out: `is_auto_child_type(parent_type, child_type)` answers whether a child is pinned, and `workspace_guidance_fields()` returns the fields a workspace may configure, mapped to the first spec that declared each.\n\n## The twelve types\n\n| Tag | Module | Statuses | Notes |\n| --- | --- | --- | --- |\n| `feature-brief` | `feature.py` | draft → grounding → spec → planning → planReview → building → review → shipped / abandoned | the full lifecycle; three pinned children |\n| `feature-spec` | `feature.py` | draft → sealed | terminal; sealing locks all authoring |\n| `implementation-plan` | `feature.py` | draft → ready | steps with a `todo/done/skipped` element FSM and block-bearing `detail` |\n| `testing-plan` | `feature.py` | draft → ready | cases with a `pending/passed/failed/skipped` element FSM |\n| `epic` | `epic.py` | draft → grounding → decomposition → planReview → executing → review → shipped / abandoned | decomposes into child feature-briefs |\n| `agent-plan` | `epic.py` | draft → ready | pinned under an epic; dispatches with a five-state element FSM |\n| `bug-report` | `bug_report.py` | draft → open → review → done → closed | no terminal statuses — `closed` stays authorable |\n| `simple-change` | `simple_change.py` | draft → open → review → done → closed | same flow, no planning or spec gates |\n| `architecture` | `architecture.py` | authoring ↔ current | documents code that exists; `current` is terminal |\n| `decision-record` | `decision_record.py` | authoring ↔ accepted | `accepted` is terminal bar `supersededBy` |\n| `document` | `document.py` | active | the richest block surface; `standard_blocks()` |\n| `toc` | `toc.py` | active | no sections, no commands at all |\n\n### The feature family\n\n`feature.py` declares four types in one module on purpose: they are designed against each other, and the coupling runs both ways.\n\n```mermaid\ngraph LR\n  B[\"feature-brief\"]\n  S[\"feature-spec\"]\n  I[\"implementation-plan\"]\n  T[\"testing-plan\"]\n  B -- \"beginPlanning / submitPlan<br/>need sealed\" --> S\n  B -- \"submitPlan needs ready<br/>ship needs steps done/skipped\" --> I\n  B -- \"submitPlan needs ready<br/>ship needs cases passed/skipped\" --> T\n  S -- \"markSealed needs brief in spec+\" --> B\n  I -- \"markReady needs brief in planning+\" --> B\n```\n\nDownward, the brief's transitions carry `ChildStateGuard`s: `submitPlan` needs both plans `ready` and the spec still `sealed` — the spec guard is repeated even though `beginPlanning` already required it, because a spec can be `reopen`ed mid-planning. `submitForReview` and `ship` use the element form, requiring every step done-or-skipped and every case passed-or-skipped; a deliberately skipped item counts as addressed at both gates.\n\nUpward, the children's finalize transitions carry `ParentStateGuard`s (`_FEATURE_IN_SPEC_OR_LATER`, `_FEATURE_IN_PLANNING_OR_LATER`), which is how the spec is unlocked one stage before the plans are.\n\nThe `implementation-plan` is also the module's most interesting content model. `list_cmds(\"steps\", add_args=(), element_blocks=(\"detail\",))` gives `addStep` a single optional blocks argument, so one command creates a step *and* fills it — which is what keeps a batch from having to name an id it has not committed. `element_blocks_cmds(\"steps\", \"detail\")` then supplies the append-later surface; without it a step's detail would be write-once, and fixing one would cost the step its id and its `todo`/`done` state.\n\n### The epic family\n\n`epic.py` follows the same shape one level up. An epic decomposes into child feature-briefs and is built by subagents dispatched from its pinned `agent-plan`. Its `ship` guard requires every child feature-brief to be `shipped`; its `submitForReview` guard uses the element form against the agent plan's dispatches, which is exactly why `accepted` is the single success terminal of `_DISPATCH_FSM` — a guard whose allowed set is just `(\"accepted\",)` only works if there is one way to succeed.\n\nA fix round is a `redispatch` of the same element rather than a new one, so the element itself records how many attempts a workstream took. The agent plan's `addDispatch` carries a `RefCheck` pointing `workstreamId` at the parent epic's `workstreams` list.\n\n### The lightweight trackers\n\n`bug-report` and `simple-change` share a flow (`draft → open → review → done → closed`), the `REVIEW` stage guidance, and both workspace-guidance fields. Both use `transition_on_add_cmd` for closing: `close` records a fix/change commit **and** fires `done → closed` atomically, with `closeWithoutCommit` as the message-only variant. Both are human gates. Neither declares `terminal_states`, so a closed page stays authorable and `reopen` returns it to `open`.\n\n### The knowledge pages\n\n`architecture` and `decision-record` both settle into a terminal status with an explicit way back (`author`). `architecture` is for code that exists today; `decision-record` is for the reasoning a shape cannot show, and is never edited to reverse itself — `supersededBy` is the forward pointer, and the one command that stays legal in the terminal status.\n\n`document` and `toc` are the two ends of the range. `document` takes the whole standard block vocabulary; `toc` declares no sections and no commands, making it the only type without even `addLink` — a toc is shaped entirely by what is reparented beneath it, and its rendered child-pages list *is* its content.\n\nOne drift worth knowing: `ARCHITECTURE_AUTHORING` talks about marking a page stale, but the declared statuses are only `authoring` and `current`, where `markCurrent` is `authoring → current` and `author` is the way back. The guidance prose describes a status the FSM does not have.\n\n## How the rest of the codebase reads this module\n\n| Consumer | Reads |\n| --- | --- |\n| `src/server.py` | `validate_registry()` at start; `get_page_type` / `registered_pagetypes` for the MCP surface |\n| `src/commands.py` | the pure mutation core — command kinds, `legal_commands` (which applies `legal_in`, `requires` and `terminal_states`), `initial_sections`, `guard_production_type` |\n| `src/store.py` | everything cross-page: `RefCheck`, both guard kinds, `auto_children`, `status_guidance`, `workspace_guidance` |\n| `src/describe.py` | `describePageType` / `describeMutations` — sections with their instructions, command summaries, status guidance, workspace-guidance fields |\n| `src/render.py`, `src/render_html.py` | field kinds, `block_element_fields`, `title_element_field` |\n| `src/fsm.py` | `try_build_machine(spec)` for both spec kinds |\n| `src/docsgen.py` | `registered_pagetypes()` and `initial_sections` to generate type docs |\n| `src/statecharts.py` | `REGISTRY` directly — the production types specifically are the point |\n\n## Adding or changing a page type\n\n1. New module beside the others, named for the tag, holding a single `_UPPER_CASE` `PageType` literal. Declare a parent and its pinned children in one module when they are designed against each other, as `feature.py` and `epic.py` do.\n2. Sections first. Put each field's authoring instruction on the `FieldSpec` and nowhere else.\n3. Commands next, via the factories. Let the names derive; pass `singular=` / `label=` / `name=` only where the derivation reads badly, and leave a comment saying why — every override in the tree has one.\n4. FSM last: statuses, initial, and `terminal_states` only if you want the blanket authoring lock. The transition table writes itself from your `transition_cmd`s.\n5. Register the tag in `REGISTRY` in `_registry.py`.\n6. Run the test suite. `validate_page_types` is the gate, and its messages are tag-prefixed and aggregated, so one run reports every problem.\n\nTraps worth naming up front:\n\n- **A type with two blocks fields must pass distinct `remove_name` / `reorder_name`** or the generated command names collide. `decision_record` (`decision` + `consequences`), `feature-spec` (`design` + `decisions`) and `implementation-plan` (`steps.detail` + `dataModels`) all do.\n- **A multi-source transition needs an explicit `legal_in`.** The description's \"from\" is prose in that case (`\"drop the work -> abandoned\"`) and only the destination is parsed out of it.\n- **Test new capabilities on a `test-*` fixture.** Production types are unreachable from the suite by design; always prefer extending an existing fixture in `src/testtypes.py` over cloning a production type's shape.","page-type-framework":"# Page Type Framework\n\n# Page Type Framework (`src/pagetypes`)\n\nA page type is a **declaration, not a class**: a frozen dataclass that says what a page of that type is made of (sections and fields), what can be done to it (commands), and how its status moves (an FSM). Everything downstream — the MCP tool surface, the mutation engine, the renderer, the docs generator — reads that one declaration instead of carrying per-type branches. Adding a page type means writing a `PageType` value in a new module and registering it; no consumer changes.\n\nThe package splits into three layers:\n\n| Layer | Files | Role |\n| --- | --- | --- |\n| Vocabulary | `core/specs.py` | Kind constants and the leaf spec dataclasses that depend on nothing else |\n| Building blocks | `core/args.py`, `core/fields.py`, `core/commands.py` | `ArgSpec` / `FieldSpec` / `CommandSpec` plus the terse factories a declaration is written with |\n| Assembly & checking | `core/pagetype.py`, `core/validation.py`, `_registry.py` | `PageType` and its post-init setup, the declaration validators, and the tag → type map |\n\nBoth `__init__.py` files are deliberately empty — nothing is re-exported, so consumers import from the concrete submodule (`from .core.commands import list_cmds`) and there is no export list to keep in step.\n\n---\n\n## The shape of a declaration\n\n```mermaid\ngraph TD\n    PT[PageType] --> S[SectionSpec]\n    PT --> C[CommandSpec]\n    PT --> F[FSMSpec<br/>page status]\n    S --> FS[FieldSpec]\n    FS --> EF[ElementFSMSpec<br/>per-element lifecycle]\n    FS --> EB[ElementBlocksSpec]\n    FS --> BK[BlockKindSpec]\n    C --> A[ArgSpec]\n    A -.resolved from field.-> BK\n```\n\nThe dotted edge is the one relationship not written by hand: a command's block-carrying argument gets its accepted kinds copied from the field it targets, at `PageType` construction time (see [Post-init](#post-init-what-construction-settles)).\n\n### Fields (`core/fields.py`)\n\n`FieldSpec` has four kinds, declared with the `_scalar` / `_prose` / `_list` / `_blocks` helpers:\n\n- **`SCALAR`** — one value, optionally an enum via `choices`.\n- **`PROSE`** — free text.\n- **`LIST`** — an ordered array of elements. `element_fields` names each element's keys; `element_fsm` optionally gives every element its own tiny lifecycle; `element_blocks` marks element fields that hold blocks rather than a scalar.\n- **`BLOCKS`** — an ordered array of typed blocks, constrained by `block_kinds`.\n\n`FieldSpec.__post_init__` normalizes `description` (dedent a newline-stripped block, then rstrip) so an authoring instruction can be written as an indented triple-quoted string.\n\nThree read accessors are written as free functions taking `self` rather than methods:\n\n- `get_element_blocks(field, element_field)` — the `ElementBlocksSpec` for an element field, or `None` if it holds a scalar.\n- `block_element_fields(field)` — the block-bearing element field names; what every consumer skips when treating an element's fields as scalar text (the renderer's `_render_list` calls this).\n- `title_element_field(field)` — the element field that heads each element, chosen from `TITLE_ELEMENT_FIELDS = (\"title\", \"name\")` in precedence order, excluding block-bearing fields. Heading-ness is **declared, never inferred from values**: every element of a field renders the same shape.\n\n### Args and block kinds (`core/args.py`)\n\n`ArgSpec` is a JSON-Schema-ish argument: `name`, `type`, `required`, `choices`, `description`, plus two content-shape fields:\n\n- `content` — which structured shape an `array`/`object` value must satisfy: `INLINE_RUNS`, `INLINE_RUN_LISTS`, `INLINE_RUN_GRID`, `TABLE_ALIGN`, or `BLOCK_ARRAY`. `None` means no shape check.\n- `block_kinds` — for a `BLOCK_ARRAY` arg, the vocabulary it accepts. **Never written by hand**; filled in from the target field by `PageType`.\n\nThe `_text` / `_integer` / `_boolean` / `_array` / `_object` factories exist so an arg list reads as `(_text(\"file\"), _integer(\"level\"))`. `_same_named(args)` derives an `element_map` in which each arg maps onto a same-named element field — which is why no helper call site passes `element_map` explicitly: **the arg names are the field names**.\n\nTwo module-level args are shared by every positioned write:\n\n```python\n_INDEX      # optional: destination slot (append when omitted)\n_PRECEDING  # optional: the id expected immediately before that slot\n```\n\n`precedingId` is the stale-read guard — a caller that read the list, then raced another writer, names an anchor that no longer holds and is rejected. The guard itself is enforced in the runtime mutation layer (`_resolve_slot` in `src/commands.py`), not here; this module only declares the args.\n\n`BlockKindSpec` is one accepted block kind: a `kind` name, the `body_args` a block of that kind carries, and an optional `ref_check`. The `ref_check` lives on the kind rather than flat on a command because the referencing argument sits *inside* a block. The same kind name can carry a different body in a different field — that is what a per-field override is.\n\nThe block-kind factories mirror the arg factories: `_paragraph_runs()`, `_heading_runs()`, `_code_block()`, `_list_block()`, `_quote_block()`, `_table_block()`, `_divider_block()`, plus `_paragraph_text()` / `_heading_text()` for fields that want plain text instead of rich runs. `standard_blocks()` returns the whole canonical vocabulary — what a field passes to accept everything.\n\n### Inline runs\n\nRich text inside a block is an ordered array of **runs**. A run is a plain string, `{\"text\": …, \"bold\"?, \"italic\"?, \"href\"?}`, `{\"code\": …}`, or `{\"ref\": \"<pageId>\"}`. Markdown syntax inside a text run is rejected: emphasis must be a structured run. The rejected token set (`_MARKDOWN_TOKENS = (\"**\", \"`\", \"](\")`) is kept deliberately narrow so ordinary prose containing a lone `*` or `_` survives.\n\nThe four content shapes nest predictably: `INLINE_RUNS` is `[run, …]`, `INLINE_RUN_LISTS` is `[[run, …], …]` (list items, quote paragraphs, table header cells), `INLINE_RUN_GRID` is rows of cells, and `TABLE_ALIGN` is a flat array of `left|center|right|None`.\n\n---\n\n## Commands (`core/commands.py`)\n\n`CommandSpec` is one declared operation. The kind constants:\n\n| Kind | Writes |\n| --- | --- |\n| `SET_SCALAR`, `SET_PROSE` | a scalar / prose field |\n| `ADD_ELEMENT`, `REMOVE_ELEMENT`, `REORDER_ELEMENT` | a `LIST` field |\n| `SET_ELEMENT_FIELD`, `ELEMENT_TRANSITION` | one element (a flag; its own FSM event) |\n| `ADD_BLOCK`, `REMOVE_BLOCK`, `REORDER_BLOCK` | a `BLOCKS` field, or an element's block array when `element_field` is set |\n| `TRANSITION`, `COMPOUND` | the page status (compound = ordered sub-steps applied atomically) |\n| `ADD_LINK`, `SET_TITLE` | the universal page-level operations |\n\nTwo fields deserve emphasis:\n\n- **`legal_in` is the uniform \"where is this legal\" declaration.** On a content command it is a status-scoped lock; on a `TRANSITION`/`COMPOUND` it is the *source* status(es) of the FSM edge. One concept, one field, across every kind.\n- **`element_field`** is the single seam routing an `ADD_BLOCK`/`REMOVE_BLOCK`/`REORDER_BLOCK` to an element's block array instead of the section's own. `None` means the section's own blocks field.\n\nCross-page concerns ride along as declarations evaluated later in the store, which is the only layer that can see other pages: `ref_check` (a `RefCheck` — an arg must name an existing element id), `guards` (`ChildStateGuard` — every child of a type, or every element in a child's list field, must be in an allowed status), and `parent_guards` (`ParentStateGuard` — the mirror image, looking up at the parent).\n\n### Declaration helpers\n\nEach helper is a pure factory returning a `CommandSpec` (or a tuple) to spread into `commands=(...)`. Names and the `<noun>Id` arg are **derived** from the section/field, so the minimal call carries no name plumbing:\n\n| Helper | Produces |\n| --- | --- |\n| `set_prose_cmd(section)` | `set<Section>` — `SET_PROSE` |\n| `set_scalar_cmd(section, field)` | `set<Field>` — `SET_SCALAR`, arg named after the field, carrying its `choices` |\n| `list_cmds(section, …)` | `add<Noun>` / `remove<Noun>` / `reorder<Noun>`; subset via `add=`/`remove=`/`reorder=` |\n| `element_cmds(section, marks=…)` | one `ELEMENT_TRANSITION` per `(name, event, description[, extra_args])` |\n| `set_element_field_cmd(…, const=…)` | `SET_ELEMENT_FIELD` stamping a constant onto the id'd element |\n| `blocks_cmds(section)` | `add<Label>` / `removeBlock` / `reorderBlock` for a page-level blocks field |\n| `element_blocks_cmds(section, element_field)` | the same three, each led by the element id |\n| `transition_cmd(name, \"from -> to\")` | a page-status `TRANSITION` |\n| `transition_on_add_cmd(…)` | a `COMPOUND` that adds an element *and* fires a transition |\n| `add_link_cmd()`, `set_title_cmd()` | the universal `addLink` / `setTitle` |\n\nNaming is done by four small functions: `_cap` (leaves the rest of the word alone, so `dataModel` → `DataModel`), `_a` (indefinite article, so a generated description reads \"an invariant\"), `_singular` (rule-based: `-ies` → `-y`, trailing `-s` dropped), and `_setter_label` (the section for the conventional `body` field, the field key otherwise). Any of these can be overridden — `singular=`, `label=`, `name=` — where the derivation reads badly or gets a plural wrong.\n\n`transition_cmd` parses its edge out of the description. A written `->` is substituted once to `→`, the text is split on it, and the **first word after the arrow is the destination** — a trailing parenthetical is ignored, so `\"drafting -> review (needs a summary)\"` resolves to `review`. The dest is not overridable; the source is the text before the arrow unless `legal_in` supplies it (for a multi-source edge, or one whose \"from\" is prose). `event` defaults to `name`. A description without a parseable arrow raises `ValueError` at import time.\n\n`is_field_setter(command)` is the page-type-agnostic classifier behind the self-direction \"do\" list: a `SET_SCALAR`, `SET_PROSE`, `ADD_ELEMENT`, or a *page-level* `ADD_BLOCK`. An element-scoped `ADD_BLOCK` is not a setter (the element it fills must exist first), and neither are the structure, flag, element-FSM, transition, or universal commands. It lives in this module so the declaration-time validator and the runtime rollup read one rule.\n\n---\n\n## `PageType` and the derived FSM (`core/pagetype.py`)\n\n```python\n@dataclass(frozen=True)\nclass PageType:\n    tag: str\n    name: str\n    description: str\n    sections: tuple[SectionSpec, ...]\n    commands: tuple[CommandSpec, ...]\n    fsm: FSMSpec\n    auto_children: tuple[AutoChildSpec, ...] = ()\n    workspace_guidance: tuple[WorkspaceGuidanceSpec, ...] = ()\n```\n\n`FSMSpec` holds **only** the status set, the initial status, `terminal_states`, and `status_guidance`. The transition table is derived, not declared. `terminal_states` is explicit, never inferred from a status merely lacking outgoing edges: while a page sits in one, every authoring command is locked (`describeMutations` reports them unavailable, `mutatePageBatch` rejects them) but status transitions stay legal, so a terminal status can still offer a `reopen`. A command opts out by naming the terminal status in its `legal_in`.\n\n`ElementFSMSpec` is the exception that proves the rule: it **does** keep its own transition table, because an `ELEMENT_TRANSITION` command only names the event it fires (its `legal_in` is the *page* status lock, not the element source state), so there is nothing to derive from.\n\n### Post-init: what construction settles\n\n```mermaid\ngraph LR\n    A[\"PageType(...node[\")\"]\"] --> B[_resolve_block_vocabularies]\n    B --> C[\"fsm.transitions =<br/>_status_transitions(self)\"]\n    C --> D[_build_machines]\n    D --> E[\"machine / machine_error<br/>on each FSM spec\"]\n    E --> F[\"validate_page_types(REGISTRY)<br/>at load\"]\n```\n\nThe dataclass is frozen, so all three steps write through `object.__setattr__`. None of them raise: **construction sets up, validation reports**. A failure is held on the spec for `validation.py` to surface, which is what lets the load-time validator aggregate every problem across the whole registry instead of dying on the first one.\n\n**1. Block vocabularies.** `_resolve_block_vocabularies` rebuilds `commands` with each `BLOCK_ARRAY` arg's `block_kinds` filled in from the field it targets. `_resolved_arg` picks the element field as `command.element_field or (arg.name if command.kind == ADD_ELEMENT else None)` — because a `list_cmds` add carries one block arg *named after* each block-bearing element field, while an element-scoped block command names the field on the command. With no element field, the target must be a `BLOCKS` field and its kinds are copied over. This is best-effort and only ever *fills in*, never checks: an unresolvable target leaves `block_kinds` as `None` (the \"not a block argument\" sentinel) for `validate_pagetype_block_args` to report. Safe, because the primary flows validate before serving.\n\n**2. The status table.** `_status_transitions` walks top-level commands and emits one `(event, source, dest, agency)` edge per source for every `TRANSITION`/`COMPOUND` with both `event` and `dest` set. A command legal in several statuses expands to several edges. **Nested `COMPOUND` sub-steps are not walked** — the outer command owns the edge, so the inner transition step does not double-count. Iteration follows declaration order.\n\n**3. The machines.** `_build_machines` calls `_store_machine` on the status FSM and on every element FSM found by `element_fsm_sites`, which stores whichever of the built class or the error `try_build_machine` (from `src/fsm.py`) returned. The build *is* the well-formedness check — python-statemachine validates connectivity, unreachable states and trap states when it creates the class — so it runs with the declaration rather than on first use. An element spec already carrying a machine is left alone, because one spec may be declared by several page types. `machine` and `machine_error` are `init=False, compare=False`, so a shared spec stays a single value.\n\n`element_fsm_sites(page_type)` returns `(section_key, field_key, spec)` for every element FSM. A list field is the only place one can attach, so this walk is the complete set.\n\n### `initial_sections`\n\n```python\ninitial_sections(page_type, existing=None) -> dict[str, dict[str, Any]]\n```\n\nThe section/field state a new page starts with — `\"\"` for prose, `[]` for list and blocks, `None` for scalar — or `existing` backfilled onto it. It is **idempotent**: anything already present in `existing` is carried over untouched, so the same function seeds a fresh page and backfills an older page against a type that has since gained a section or field.\n\n### Lookups\n\n`get_pagetype_command(page_type, name)` and `get_pagetype_field(page_type, section_key, field_key)` are linear scans returning `None` when absent. The mutation layer leans on the latter heavily (`_add_element`, `_element_transition`, `_field_setter_edge` all resolve their target field through it).\n\n---\n\n## Validation (`core/validation.py`)\n\nThis module carries two distinct jobs despite its module docstring naming only the first.\n\n### Runtime grammar — the block/inline checks\n\nPure predicates the command layer runs *before* applying a write:\n\n- `validate_inline_content(content, value)` — dispatches on the declared shape.\n- `validate_block(entry, block_kinds)` — the block must name a kind the field declares and carry exactly that kind's body args. Because the body args come from the matched `BlockKindSpec`, a per-field override is honoured. Tables additionally go through `validate_table`, which checks that every row and `align` matches the header's column count.\n- `validate_blocks(value, block_kinds)` — the array form.\n- `collect_ref_ids(content, value, block_kinds=None)` — pulls every `{\"ref\": pageId}` out of an arg value so the store can integrity-check inline page references before writing (`_check_inline_refs`). It is deliberately **defensive**: it runs before grammar validation, so it ignores anything malformed and leaves rejection to `validate_block`. For a `BLOCK_ARRAY` it recurses via `_block_ref_ids`, reading the run-bearing keys off the declared kinds — without `block_kinds` it yields nothing rather than guessing.\n\nA dangling `ref`'s *existence* is not checked here: the pure core cannot see other pages.\n\n### Declaration validation — the load-time checks\n\n`validate_page_types(registry)` is the single entry point. It walks every type, collects every error, and raises **one** aggregated `ValueError` listing all of them — or returns `None`. Per type, `validate_page_type` prefixes the page tag onto messages from:\n\n| Validator | Rule |\n| --- | --- |\n| `validate_field_spec` | `block_kinds` only on a blocks field (and a blocks field declares some); no kind named twice; `element_blocks` only on a list field, each naming a declared element field exactly once. Recurses via `validate_element_blocks_spec`. |\n| `validate_fsm_spec` | Every `status_guidance` pair names a declared status, none twice. Not folded into the machine build — python-statemachine has no notion of guidance. |\n| `validate_page_machine` | The status machine and every element machine actually built. Reports the held `machine_error`, rewritten through `_in_declared_names` so the library's `state_<name>` attribute names read back as the author's status names (longest state first, so one name cannot be substituted inside another). |\n| `validate_pagetype_field_setters` | At most one do-eligible setter per `(section, field)` — a second would be silently dropped from the self-direction rollup, failing as *missing guidance* rather than as an error. |\n| `validate_pagetype_setter_descriptions` | A setter carries a short one-line description (\"set the summary\"), never its field's authoring instruction — that text lives once on `FieldSpec.description` and reaches an agent through `describePageType` and the `instruction` key of a `next` edge. |\n| `validate_pagetype_block_args` | Every `BLOCK_ARRAY` arg resolved. The check side of the best-effort resolution above: an unfilled arg would accept any block, describe itself as an untyped array, and lose its cross-page ref check. |\n\n`validate_workspace_guidance(registry)` runs across the whole map, not per type: each `WorkspaceGuidanceSpec` needs a non-empty field name and description, a non-empty `guidance_for` naming only the declaring type's own statuses, and a description that **agrees across every type sharing the field**.\n\n---\n\n## The registry (`_registry.py`)\n\n`REGISTRY` maps tag → `PageType` for the twelve production types (architecture, decision record, bug report, simple change, the four feature types, epic, agent plan, document, toc). `validate_registry()` calls `validate_page_types(REGISTRY)` and is what the primary flows — server start, HMR reload — call so a misconfigured type fails loudly at load.\n\n**Read types through `registered_pagetypes()`, not from `REGISTRY`.** The accessor is what applies test mode, so resolution, the `describePageType` listing, and doc generation all agree on which types exist. Name `REGISTRY` directly only where the production types specifically are the point — as `validate_registry` does.\n\n### Test mode\n\n`set_test_mode(True)` swaps in the hand-authored `test-*` fixtures from `src/testtypes.py`,
