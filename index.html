var PAGES = {"command-mutation-engine":"# Command & Mutation Engine\n\n# Command & Mutation Engine\n\n`src/commands.py` — the pure write path. `src/errors.py` — the failure vocabulary it raises.\n\nEvery mutation in pasta lands here. A tool call arrives at the server, the store resolves the workspace and page and runs the cross-page prechecks, and then hands a `Page`, its `PageType`, a command name and an args dict to this module. What comes back is a *new* `Page`. Nothing in this file touches disk, the clock, the registry state, or the input page.\n\n## The contract\n\nThree rules define the module, and any new code in it has to keep all three:\n\n1. **Pure.** No I/O, no globals, no ambient time or randomness. Identifiers come in through an injected `IdFactory` (`Callable[[str], str]`) so tests can supply a deterministic counter instead of `ids.new_id`.\n2. **Copy–edit–return.** `apply_command` calls `page.copy()` (a deep copy) and edits the copy. The caller's page is never mutated, so a failed command leaves nothing behind. This is the in-memory half of the storage pattern in `store.py`: the store copies, calls in here, and only then writes the result back into the workspace.\n3. **Raise, don't return errors.** Every rejection is a `PastaError` subclass with a message written for the agent that will read it.\n\nThe one deliberate exception to \"no ambient state\" is `create_page`, which calls `guard_production_type` from the page-type registry — the test-mode guard has to fire even when a caller bypasses `get_page_type` and passes a resolved `PageType` straight in.\n\n## Public surface\n\n| Function | Role |\n| --- | --- |\n| `create_page(page_type, title, parent_id, id_factory)` | A fresh page in its FSM's initial status with `initial_sections(page_type)` |\n| `apply_command(page, page_type, command_name, args, id_factory, batch_context=None)` | Validate → check legality → apply; returns `CommandResult` |\n| `legal_commands(page, page_type, ignore_requirements=False)` | `{command_name: bool}` for the page's current state |\n| `unmet_requirements(page, command)` | The `(section, field)` preconditions still unpopulated |\n| `field_setter_edges(page, page_type, blocked_events=())` | The stage-relevant `do` edges for self-direction |\n| `resolve_anchored_slot(ids, index, preceding_id, context, batch_context=None)` | The shared stale-read guard for anchored placement |\n| `BatchContext(created_ids)` | Ids created earlier in the same batch |\n| `CommandResult(page, created_id, created_ids)` | The new page plus what the command created |\n\nEverything else is private and dispatch-internal.\n\n## How `apply_command` works\n\n```mermaid\nflowchart TD\n    A[apply_command] --> B[get_pagetype_command<br/>unknown name → ValidationError]\n    B --> C[_validate_args<br/>shape, type, choices, content]\n    C --> D[_check_legal<br/>legal_commands + diagnosis]\n    D --> E[page.copy + initial_sections backfill]\n    E --> F[_apply: dispatch on command.kind]\n    F --> G[CommandResult]\n```\n\nThe order matters. Argument validation runs before legality so a malformed call is reported as malformed rather than as illegal, and both run before the copy so an invalid command costs nothing.\n\nThe `initial_sections(page_type, working.sections)` call on the copy is a **backfill**, not an initialisation. `initial_sections` is idempotent: sections and fields already present are carried over untouched, and only ones the page type declares but the page lacks get their empty default (`\"\"` for prose, `[]` for list/blocks, `None` for scalar). That is what lets a page created before a section was added to its page type accept a write into that section instead of `KeyError`-ing inside `_apply`.\n\n### Argument validation\n\n`_validate_args` rejects unknown keys, missing required args, and type mismatches against `_PYTHON_TYPE` (the JSON-ish `\"string\"`/`\"integer\"`/`\"array\"`/… names a `ArgSpec.type` uses). Because `bool` is a subclass of `int` in Python, integers and booleans are guarded explicitly in both directions — a `True` passed where an integer is declared gets its own message.\n\nContent-shaped args go one level deeper: an arg whose `content` is `BLOCK_ARRAY` is handed to `validate_blocks` along with the `block_kinds` the field declares; any other `content` shape (`INLINE_RUNS`, `INLINE_RUN_LISTS`, `INLINE_RUN_GRID`, `TABLE_ALIGN`) goes to `validate_inline_content`. Both live in `pagetypes/core/validation.py`. By the time `_apply` runs, a block entry's `kind` is known to be one the field accepts.\n\n## Legality: four independent gates\n\n`legal_commands` is the single answer to \"what can this page do right now\", and it is also what `_check_legal` consults, what `describe.describe_mutations` reports, and what `store.next_actions` filters. A command is legal only when all four gates pass:\n\n- **FSM topology** (`_topology_ok`) — for a status transition, `command.event` must be in `fsm.allowed_events(page_type.fsm, page.status)`. Content commands pass this gate unconditionally.\n- **Status lock** (`_status_ok`) — `command.legal_in is None` (any status) or the current status is in it. For content commands this is the status-scoped authoring lock; for transitions `legal_in` names the *source* statuses of the edge, which is also where the page FSM table is derived from.\n- **Required content** (`unmet_requirements` + `_is_populated`) — every `(section, field)` in `command.requires` must be populated. \"Populated\" means non-blank for a string, non-empty for a list/dict, non-null for a scalar.\n- **Terminal-status authoring lock** — in a status listed in `fsm.terminal_states`, authoring is locked. Status transitions stay legal (so `reopen` still works), and a command can opt back in by *explicitly* naming that status in its `legal_in` (`_opts_into_terminal_status`) — which is how bookkeeping that outlives the work stays writable. `legal_in=None` does not opt in; silence means locked.\n\nA note on the transition/authoring split: `_is_status_transition` is true only for a `TRANSITION` or `COMPOUND` that carries an `event`. An `ELEMENT_TRANSITION` fires a *list element's* own FSM, not the page's, so from the page's point of view it is an authoring command and is locked in a terminal status like any other.\n\n`ignore_requirements=True` skips **only** the third gate. Doc generation uses it to enumerate a status's outgoing transitions on a content-less page; the other three gates still apply, and the flag is not exposed through the live `describeMutations` tool.\n\nCross-page rules — ref integrity, link validity, parent/child state guards — are deliberately *not* here. The store runs those (`_check_ref`, `_check_block_refs`, `_check_inline_refs`, `_check_guards`, `_check_link`) before calling in, and the pure core trusts that they ran.\n\n### Error messages that name the fix\n\n`_check_legal` distinguishes two failure modes rather than emitting one generic refusal. If the FSM allows the event but required fields are empty, the message lists exactly which `section.field` pairs to set. Otherwise it reports the wrong-status case and names the currently legal commands. Either way the raised `IllegalCommandError` carries `legal=` — the sorted list of what *is* possible — so a caller can recover without a second round-trip.\n\n## Applying: dispatch by `command.kind`\n\n`_apply` is a flat dispatch on `CommandSpec.kind`, returning `(created_id, created_ids)`.\n\n| Kind | Effect |\n| --- | --- |\n| `SET_SCALAR`, `SET_PROSE` | Write `args[command.args[0].name]` into `sections[section][field]` |\n| `ADD_ELEMENT` | `_add_element` — create an id'd element, seed its element-FSM status and block fields, place it |\n| `SET_ELEMENT_FIELD` | `_set_element_field` — apply mapped args and `element_const` literals to the element named by `args[0]`, id preserved |\n| `ELEMENT_TRANSITION` | `_element_transition` — fire the element FSM, then apply field writes |\n| `ADD_BLOCK` | `_add_block` — create a run of blocks, append or insert contiguously |\n| `REMOVE_ELEMENT`, `REMOVE_BLOCK` | `_remove_by_id` — one implementation, two kinds |\n| `REORDER_ELEMENT`, `REORDER_BLOCK` | `_reorder_entry` — anchored move, one implementation, two kinds |\n| `ADD_LINK` | Append `{\"to\": args[\"toId\"], \"role\": args[\"role\"].strip()}` to `page.links` |\n| `SET_TITLE` | Rename in place; blank title raises the same message as `create_page` / `store.rename_page` |\n| `TRANSITION` | `page.status = fsm.fire(page_type.fsm, page.status, command.event)` |\n| `COMPOUND` | Recurse over `command.steps` against the same working page and args |\n\n`COMPOUND` is where the two return values diverge in the aggregate: the last step's `created_id` wins as the positional report, while `created_ids` accumulates from every step. Adding a new kind means adding a constant in `pagetypes/core/specs.py`, a branch here, and a helper — the fall-through raises `ValidationError` for an unsupported kind, so a half-wired kind fails loudly.\n\nNote what `_apply` never writes: `status_revision_token`. The store regenerates that stamp when it observes `working.status != status_before`. A page-type command has no business minting a concurrency token.\n\n## Addressing conventions\n\nThree small helpers encode the whole positional-argument convention, and they are the part most worth internalising before editing:\n\n- **`args[0]` is the target id.** For element-scoped commands (`command.element_field` is set), `args[0]` is the *element* id and `args[1]` is the block id. `_entry_id` picks the right one.\n- **`_target_entries`** resolves the list a command operates on: the section's own field, or — when element-scoped — the block array hanging off the element named by `args[0]`. It *creates* that array if the element doesn't carry it yet, which is what lets an element stored before the block field was declared accept its first block.\n- **`_entry_context`** names that list for error messages: `steps.items`, or `steps.items[<elementId>].detail` when element-scoped. Every `NotFoundError`, range error and stale-read conflict routes through it, so an author can always tell which of the two ids was wrong.\n\n`index` and `precedingId` are positional args, never entries in `element_map`, so they never leak into the stored element body.\n\n## Anchored placement and stale reads\n\nOrdered insertion and reordering share one guard: `resolve_anchored_slot`.\n\nThe caller supplies `index` — the slot the entry will occupy — and `precedingId`, the id that must *currently* sit immediately before that slot (`None` if and only if `index` is 0). One check does four jobs: it range-checks the index, rejects a drifted index, rejects a predecessor that has moved or vanished, and enforces that `precedingId` is supplied for any non-front slot and omitted for the front (since a null can only match index 0). A mismatch is a `ConflictError` telling the caller to re-read and retry, rather than a silent landing in the wrong place.\n\nThis replaced two earlier failure modes: a whole-list reorder could drop ids written by a concurrent edit, and an index-only move could land in a stale slot. `_reorder_entry` now names only the moved id, its `toIndex` (the resting index *after* the item is removed) and the `precedingId` that must precede it.\n\nThe guard is shared by three callers: `_resolve_slot` (which adapts it to a `list[dict]` by projecting ids) for positioned adds and block/element reorders, and `store.reorder_page` directly for page siblings.\n\n### Batch-created ids\n\n`BatchContext.created_ids` carries the ids created by earlier commands in the same `mutatePageBatch`. A caller cannot name an id that has not been committed yet, so `resolve_anchored_slot` walks left past any batch-created ids when computing the expected predecessor, anchoring on the first *committed* id instead. With no batch context (a single mutation) the check is strict.\n\nThe store feeds this loop: it accumulates `result.created_ids` into `created_so_far` and passes `BatchContext(frozenset(created_so_far))` into each subsequent `apply_command`. That is why `CommandResult` has both fields — a block add creates a whole run but reports only the first id positionally (one `createdId` per command), while the batch's anchored-slot guard needs all of them.\n\n### Runs of blocks\n\n`_place_entry` takes an `offset` so a run lands contiguously from one anchored slot. The guard resolves once, against the slot the run starts at; members after the first use `index + offset`. Without this, N positioned inserts would each re-resolve the same index and the run would come out reversed. `_reject_dangling_preceding` catches the other end of the same idea: `precedingId` anchors a positioned insert, so it is meaningless without an `index`.\n\n## Blocks are built in exactly one place\n\n`_create_blocks` is the only function that constructs a block dict: `{\"id\": id_factory(\"\"), \"kind\": ..., **body_args}`. Three paths reach it — a page-level `ADD_BLOCK`, an element-scoped `ADD_BLOCK`, and `_element_blocks_from_args` for an element created holding its blocks — so a block is indistinguishable key for key whichever command made it. That invariant is directly tested (`test_a_block_created_with_its_element_matches_one_added_after`, `test_a_block_is_built_in_exactly_one_place`); route any new block-producing path through this helper.\n\nNote the empty prefix: `id_factory(\"\")` gives blocks and elements unprefixed ids, unlike pages, which get `id_factory(page_type.tag)`.\n\n## Element FSMs\n\nA `list` field may declare an `element_fsm` on its `FieldSpec`, giving its elements their own lifecycle independent of the page's. `_add_element` seeds `element[\"status\"]` from that FSM's initial state; `_element_transition` reads the element's current status (defaulting to the initial state for an element created before the FSM was declared), fires the event through `fsm.fire`, and then applies field writes. Firing is what rejects an illegal mark — `fsm.fire` surfaces python-statemachine's `TransitionNotAllowed` as an `IllegalCommandError`. A field with no `element_fsm` raises `ValidationError` if a transition command targets it.\n\n## `field_setter_edges` — the self-direction `do` list\n\nThis is the most subtle function in the module, and the one most likely to be misread as \"list the legal setters\". It answers a narrower question: *which fields is authoring right now what advances the current stage?*\n\nA field's setter belongs in `do` only when both hold: its `(section, field)` is a `requires` precondition of a transition **topologically** legal from the current status, and the setter is legal right now. The derivation is generic from the FSM with no per-page-type knowledge, which is what stops a `legal_in=None` \"always legal\" setter from adding noise in a status where its field is not the goal.\n\n`blocked_events` is the escape hatch for the outside world. The caller names events that cannot fire for a reason no authoring on *this* page can clear; those are dropped from the topology *before* requirements are collected. The store passes the page's **parent**-state-guard failures here, so a pinned plan child whose feature-brief is still `grounding` stays silent rather than advertising `addStep`/`addCase` while the base is still being established. **Child**-state guards are deliberately not passed — \"my children are unfinished\" does not make my own authoring premature.\n\nEvery entry has one shape, built by `_field_setter_edge`: `kind='field'` with the `(section, field)`, the field's `FieldSpec.description` as an inline `instruction`, the single `command` that writes it, and the page's `statusRevisionToken`. Inlining the instruction is the point — a `next` consumer needs no `describePageType` round-trip to know what to author.\n\nOne field, one edge, one command: a field's whole authoring content is reachable in a single command (a blocks field takes its blocks as an array; a list add carries the blocks its element is created holding). `is_field_setter` in `pagetypes/core/commands.py` is the classifier — `SET_SCALAR`, `SET_PROSE`, `ADD_ELEMENT`, and a *page-level* `ADD_BLOCK` only. Element-scoped block adds, removes, reorders, `SET_ELEMENT_FIELD`, `ELEMENT_TRANSITION`, transitions, `ADD_LINK` and `SET_TITLE` are not setters; `describeMutations` reports those. `PageType`'s post-init rejects a type declaring two setters for one field, which is why `setters.setdefault` can trust the first legal match it finds.\n\n## Errors (`src/errors.py`)\n\n```\nPastaError                      base for every expected (non-bug) failure\n├── NotFoundError               a workspace, page, or element id does not resolve\n├── ValidationError             bad args: unknown, missing, wrong type, not an enum member\n├── IllegalCommandError         not legal now; carries .legal = what is\n├── ConflictError               a structural/consistency rule broke — cycle, stale-read anchor\n└── ProductionTypeInTestError   a test touched a production page type in test mode\n```\n\nRaised by the pure core (`commands`, `fsm`, `serialize`) and by the storage shell (`store`); translated into FastMCP tool errors by the server. `ProductionTypeInTestError` comes from `guard_production_type` — production page types are off-limits to the test suite, which exercises capabilities on the hand-authored `test-*` fixtures in `src/testtypes.py`.\n\nWhen the store aborts a batch it re-raises the *same* error class with a `Batch aborted at command <n> ('<name>')` prefix, so adding a new error type keeps its classification through the batch boundary. Keep new failure modes inside this hierarchy; anything outside it reads as a bug rather than a rejection.\n\n## How it connects\n\n**Declarations in, mutations out.** This module owns no knowledge of any particular page type. Everything it needs comes from `PageType` via `get_pagetype_command`, `get_pagetype_field` and `initial_sections`, and every legality question about statuses goes to `fsm.allowed_events` / `fsm.fire`. Adding a page type requires no change here; adding a *command kind* does.\n\nCallers, and what each one wants from the module:\n\n- **`store.create_page` / `store._create_auto_children`** → `create_page`. The store handles parent wiring, persistence, and the initial revision stamp.\n- **`store.mutate_page_batch`** → `apply_command` per entry, with `BatchContext` threading created ids forward and a `statusRevisionToken` check per command. Cross-page prechecks run before each call; a `PastaError` anywhere aborts the whole batch and writes nothing.\n- **`store.next_actions`** → `legal_commands`, `unmet_requirements`, and `field_setter_edges(page, page_type, parent_blocked)` to build the self-direction rollup.\n- **`store.reorder_page`** → `resolve_anchored_slot` for page siblings, reusing the same stale-read guard as in-page reorders.\n- **`describe.describe_mutations`** → `legal_commands`, for the live tool.\n- **`docsgen.state_docs`** (via `describe_mutations`, driven by `scripts/gen_page_type_docs.py`) → `legal_commands` with `ignore_requirements=True`, to enumerate a status's outgoing transitions on a content-less page.\n\n## Contributing notes\n\n- **Adding a command kind:** constant in `pagetypes/core/specs.py` → branch in `_apply` → helper here. Decide explicitly whether it is a status transition (`_is_status_transition`) and whether it is a field setter (`is_field_setter`) — both classifications have downstream consequences for the terminal-status lock and the `do` list, and `PageType` post-init validation reads the latter.\n- **Reuse the shared guards.** Any new ordered insertion goes through `_place_entry`/`resolve_anchored_slot`; any new block through `_create_blocks`; any error context through `_entry_context`. These are single-point-of-truth by design, and the tests assert it.\n- **Don't add a cross-page check here.** If the rule needs to see another page, the workspace, or the filesystem, it belongs in the store's precheck layer. The purity of this module is what makes the write path testable without a workspace.\n- **Tests:** `tests/test_commands.py` builds pages with the `test-*` fixtures via `create_page` + `apply_command`, and `tests/test_render.py` reuses the same path to construct render inputs. Run with `pytest --testmon`.","developer-tooling-hot-reload":"# Developer Tooling & Hot Reload\n\n# Developer Tooling & Hot Reload\n\nThis module is the development-time scaffolding around the pasta server. None of it ships in the request path of a production deployment — it exists so that a developer editing `src/server.py` sees the result in a browser and in a connected MCP client *without* restarting anything, and so that when something does break there is a record to read afterwards.\n\nFour concerns, four files:\n\n| File | Concern |\n| --- | --- |\n| `src/hmr_server.py` | The dev server: one uvicorn process, in-process hot reload of both surfaces |\n| `src/hmr_live_refresh.py` | Browser live-reload sockets, deliberately excluded from reloading |\n| `src/_hmr_debug.py` | Capture reload-time errors that the reloader would otherwise swallow |\n| `scripts/mcp_probe.py`, `scripts/feature_brief_probe.py`, `scripts/validate_workspace.py` | Manual probes and an offline integrity checker |\n\n---\n\n## The problem the dev server solves\n\n`src.server` exposes two surfaces from one module: a FastMCP server (`src.server.mcp`) and a FastAPI app (`src.server.app`). Reloading by respawning the process — uvicorn's `--reload` — is cheap to set up and hostile to MCP: every respawn drops connected client sessions, and a client that has completed an `initialize` handshake has to redo it. An agent session mid-task does not survive that.\n\nSo `src/hmr_server.py` reloads *in process*. It merges two upstream patterns:\n\n- **`uvicorn-hmr`** — serve a reloaded ASGI app and push a refresh to connected browsers.\n- **`mcp-hmr`** — keep a stable outer proxy, swap what is mounted under it, and tell live sessions the tool list changed.\n\nThe result is a single uvicorn server, a single file watcher, and a single reactive context serving both surfaces.\n\n### Reactivity, not respawn\n\nThe hot part comes from `hmr` (`reactivity.hmr`). Instantiating the `Reloader` installs an **import finder**, after which `src.server` and its submodules load as *reactive modules*: when a file changes, that module re-executes in place and the change propagates along the dependency graph to everything that read from it.\n\nTwo `@derived(context=HMR_CONTEXT)` functions are the handles onto the reloaded module:\n\n```python\n@derived(context=HMR_CONTEXT)\ndef current_mcp() -> FastMCP:\n    return import_module(TARGET_MODULE).mcp\n\n@derived(context=HMR_CONTEXT)\ndef current_fastapi():\n    return import_module(TARGET_MODULE).app\n```\n\nReading either one *inside a reactive computation* subscribes that computation to reloads of `src.server`. That subscription is the entire reload mechanism — there is no explicit \"on file change, rebuild X\" wiring for the app objects themselves.\n\n> **The one rule that breaks everything:** `src.server` and `src.cleanup` must be imported **only** through the reloader's finder — via `import_module(...)` inside these functions, never at module top level. A top-level import resolves before the finder is installed, the module loads as an ordinary module, and hot reload silently degrades to a no-op. No error, just a dev server that stops noticing your edits.\n\n### The outer app\n\n`build_dev_app()` returns a stable Starlette app with two mounts:\n\n```mermaid\ngraph LR\n    R[request] --> S[Starlette<br/>dev app]\n    S -->|/pasta/mcp| P[base_app<br/>FastMCP proxy<br/>built once]\n    S -->|everything else| D[fastapi_dispatch]\n    P -.->|\"mount swapped<br/>on reload\"| M[src.server.mcp]\n    D -.->|\"re-pulled<br/>per request\"| A[src.server.app]\n```\n\nThe asymmetry is the point:\n\n- **MCP** needs a *stable* object, because client sessions are attached to it. `base_app = FastMCP(name=\"pasta-hmr-proxy\")` is built once and never rebuilt; its `http_app(path=\"/mcp\")` is mounted at `/pasta`. Only the inner mount swaps.\n- **FastAPI** needs no such care — browsers reconnect freely. `fastapi_dispatch` calls `current_fastapi()` on *every* request and forwards to whatever object comes back.\n\n`fastapi_dispatch` also doubles as the reload detector for logging. `src.server` re-executing rebuilds `app` as a new object, so a changed identity *is* the reload signal:\n\n```python\nif last_fastapi_app is not None and fastapi_app is not last_fastapi_app:\n    logger.info(\"[HMR] FastAPI app reloaded (src.server.app)\")\n```\n\nThe first request after startup is skipped — there is nothing to compare against yet.\n\n---\n\n## Swapping the MCP mount\n\nThis is the most intricate part of the module, and the part most likely to break on a dependency upgrade.\n\n### Mount / unmount\n\n`mount_mcp(mcp)` calls `base_app.mount(mcp)`, then grabs `base_app.providers[-1]` — each mount appends one `FastMCPProvider` — and returns a closure that removes exactly that provider. `base_app.providers` is a **fastmcp internal** (3.4.x at time of writing); it is how unmount is expressed because there is no public API for it.\n\nOnly one mount is live at a time. `serve_mcp` holds `mount_lock` for the lifetime of a mount and coordinates via two events:\n\n```python\nasync def serve_mcp(mcp: FastMCP, stop: Event, finish: Event):\n    async with mount_lock:\n        unmount = mount_mcp(mcp)\n        try:\n            await notify_sessions()\n            await stop.wait()\n        finally:\n            unmount()\n            finish.set()\n```\n\n`mcp_reload_effect` is the reactive driver. It distinguishes the first mount from a reload by whether a previous `stop_event`/`finish_event` pair exists, tears the old mount down (`stop_event.set()`, then `await finish_event.wait()`) *before* reading `current_mcp()`, and spawns a fresh `serve_mcp` task on the lifespan's `TaskGroup`. Reading `current_mcp()` inside the effect is what subscribes it to the next reload.\n\n### Keeping sessions alive across the swap\n\nA swapped tool set is useless if clients never hear about it. To notify them, the module must hold references to live `ServerSession` objects — and MCP gives no registry. So it wraps the constructor, adapted from `mcp-hmr`:\n\n```python\n_active_sessions: WeakSet[ServerSession] = WeakSet()\n```\n\n`_patch_session_init()` replaces `ServerSession.__init__` with a `capture_init` that calls through to the original, adds `self` to the `WeakSet`, decrements a pending counter, and self-restores once nothing else is waiting for a capture. `base_app._mcp_server.run` is wrapped as `_run_with_session_capture` so the patch is armed exactly while the low-level server is running, and unpatched in a `finally`. A `WeakSet` means closed sessions drop out on their own.\n\n`notify_sessions()` then fires all three list-changed notifications — `send_tool_list_changed`, `send_resource_list_changed`, `send_prompt_list_changed` — at every session, each wrapped in `suppress(Exception)` so one dead socket cannot abort the rest.\n\n### The cleanup scheduler\n\n`src.cleanup` runs the hourly workspace sweep, and a live background task must not be orphaned by a reload. `cleanup_reload_effect` handles this:\n\n```python\n@async_effect(context=HMR_CONTEXT, call_immediately=False)\nasync def cleanup_reload_effect():\n    cleanup = import_module(\"src.cleanup\")\n    await cleanup.stop_scheduler()\n    cleanup.start_scheduler(import_module(TARGET_MODULE).STORE)\n```\n\nThe reason it *reads an attribute* rather than merely importing is subtle: `ReactiveModule.load` is lazy, so an import alone would not necessarily subscribe the effect. Touching an attribute does, which makes an edit to `src/cleanup.py` re-execute this effect promptly. By the time it runs, the module's `on_dispose` hook has already cancelled the old sweep; this starts the new one.\n\n### Watching, and what is not watched\n\n```python\nclass Reloader(AsyncReloader):\n    def __init__(self):\n        super().__init__(_PACKAGE_DIR, includes=[_PACKAGE_DIR], excludes=[_LIVE_REFRESH_FILE])\n        self.error_filter.exclude_filenames.add(__file__)\n\n    def on_changes(self, files):\n        super().on_changes(files)\n        with suppress(RuntimeError):\n            asyncio.get_running_loop().create_task(ws_reloader.refresh())\n```\n\n`on_changes` orders the two halves deliberately: reload the modules first (reactive propagation, which swaps the MCP mount and rebuilds `app`), *then* refresh browsers — so a reloading browser fetches the new code, not the old. The `suppress(RuntimeError)` covers a change arriving with no running loop.\n\n`src/hmr_live_refresh.py` is excluded from the reload set, for reasons below.\n\n### Lifespan wiring\n\nThe outer app's lifespan is `combine_lifespans(mcp_asgi.lifespan, reloader_lifespan)`. The first starts the proxy's `StreamableHTTPSessionManager`; the second, `reloader_lifespan`, owns the reload machinery:\n\n1. `call_pre_reload_hooks()`\n2. Open a `TaskGroup`, publish it to the closure so effects can spawn tasks on it\n3. Construct `Reloader()` — **this installs the import finder**\n4. `await mcp_reload_effect()` — the first mount\n5. `call_post_reload_hooks()`\n6. Start `reloader.start_watching()` as a task\n7. `await cleanup_reload_effect()` — start the sweep\n8. `yield`\n9. On teardown: dispose both effects, stop the scheduler, stop watching, set `stop_event` to release the live mount, cancel the watch task\n\nStep 3 preceding any use of `current_mcp()`/`current_fastapi()` is what makes the target module load reactively.\n\n`run_dev_server(host, port)` is the entry point — `uvicorn.run(build_dev_app(), ..., timeout_graceful_shutdown=1)` — and is called from `main.py`. It blocks until interrupted.\n\n### Logging\n\nReload messages go through `logging.getLogger(\"uvicorn.error\")`, not a module logger. uvicorn configures only its own loggers; a standalone logger at INFO would have its records dropped, and `[HMR]` lines would silently never appear.\n\n---\n\n## Browser live reload: `src/hmr_live_refresh.py`\n\n`ReloaderConnectionManager` is small — `connect` accepts and appends, `disconnect` removes, `refresh` sends `{\"refresh\": 1}` to every socket and prunes the ones that raise. `ws_reloader` is the process-wide singleton.\n\nIts *location* carries the design weight. It holds live browser WebSockets as in-process state (`ws_reloader.active`). If this module were in the reload set, every source change would re-execute it, replace the singleton, and drop the connection list — browser auto-refresh would quietly stop working while everything else looked fine. So `hmr_server.py` passes its path as `excludes`, and a single instance survives every reload.\n\nThat single instance has two classes of caller:\n\n- the reactively-reloaded `src.server`, which serves the `/ws/reloader` route (`fastapi_reloader` → `connect`) and calls `refresh()` after every mutating operation — `createPage`, `mutatePageBatch`, `archivePage`, `renamePage`, `reparentPage`, `reorderPage`, `link`/`unlink`, `setWorkspaceGuidance`, the workspace archive tools, and the HTML routes `route_archive_page` / `route_set_page_status` / `route_unarchive_page`;\n- the stable `src.hmr_server`, which calls `refresh()` on file change.\n\nSo the browser refreshes both when an agent mutates a page over MCP and when a developer edits a file — two triggers, one socket list.\n\nNote that the `/ws/reloader` WebSocket is served by the *reloaded* FastAPI app through `fastapi_dispatch`, while the connections themselves live in the non-reloaded manager. That split is why a reload does not disconnect open browsers.\n\n---\n\n## Reload-error capture: `src/_hmr_debug.py`\n\nThe `hmr` reloader *prints* a module's re-exec traceback and then swallows it (`ErrorFilter` → `sys.excepthook`), and errors raised inside the async reload effect go to the event loop's exception handler. Either way a failed hot reload leaves nothing on disk — you get console output and no artifact a tool can read. This module tees all three sinks to `hmr_debug.log` in the repo root:\n\n- **`sys.excepthook`** — where `ErrorFilter.__exit__` sends re-exec failures\n- **`sys.unraisablehook`** — unraisable exceptions, logged with `args.err_msg`\n- **the asyncio exception handler** — best effort; skipped entirely if there is no running loop at import time\n\n`_log(header, text)` appends a timestamped `===== <iso-stamp> <header> =====` block; `_fmt` formats a traceback triple. Each installed hook chains to the original it replaced, so normal reporting is unaffected.\n\nThe whole module is **import-time side effect only, and idempotent**. Idempotence is achieved by stashing each original on `sys` under a private attribute (`sys._hmr_dbg_excepthook_orig`, `sys._hmr_dbg_unraisable_orig`) and installing only if absent, plus a `_loop._hmr_dbg_installed` flag for the loop handler. That matters because it is wired in by an import at the end of `server.py`, so it hot-loads with the server and gets re-imported on every reload — without the guards, each reload would stack another wrapper and eventually chain a hundred deep.\n\nThe final `_log(\"armed\", ...)` writes a marker on every arm, which doubles as a reload heartbeat in the log.\n\nThe primary thing this makes diagnosable: the **load-ordering races a multi-file change can trigger**, where several modules re-execute and one briefly sees a half-updated dependency. Those surface as a printed traceback and then vanish; here they persist.\n\n---\n\n## Manual probes\n\nThese are deliberately *manual* — not tests. They print everything verbatim and are meant to be rerun at will while investigating a bug, with the failing step and *where* it failed obvious rather than swallowed. All require a server already running.\n\n### `scripts/mcp_probe.py` — transport handshake\n\nWalks the streamable-HTTP handshake against a pasta MCP endpoint: `initialize` → `notifications/initialized` → `tools/list` → `tools/call`. It exists largely because `initialize` is where a missing or unrun MCP lifespan surfaces — the `StreamableHTTPSessionManager task group was not initialized` error named in its docstring — and if `initialize` returns ≥400 the probe stops there rather than cascading meaningless failures.\n\nThree helpers do the work, and are reused by the sibling probe:\n\n- **`rpc(request_id, method, params)`** — builds a JSON-RPC message; pass `request_id=None` for a notification (no `id` field).\n- **`parse_body(response)`** — streamable HTTP may answer with JSON *or* an SSE stream, so `BASE_HEADERS` accepts both and this decodes both: a dict/list for JSON, a list of decoded frames for `text/event-stream` (scraping `data:` lines), raw text if undecodable, `None` if empty.\n- **`show(label, response)`** — prints status line, the interesting headers (`content-type`, `mcp-session-id`, `mcp-protocol-version`), and the decoded body; returns the body.\n\n`run(url)` threads the session id from the `initialize` response header onto every subsequent request. The URL is a **positional** argument so you can aim it at candidate paths — the HMR proxy and the real server can end up at different mount points, exactly the kind of thing this probe is for:\n\n```bash\nuv run python scripts/mcp_probe.py                                  # DEFAULT_URL\nuv run python scripts/mcp_probe.py http://localhost:8000/pasta/mcp/pasta\n```\n\n`just probe` runs the default.\n\n### `scripts/feature_brief_probe.py` — workflow lifecycle\n\nThe sibling probe. Same transport plumbing (it imports `BASE_HEADERS`, `DEFAULT_URL`, `PROTOCOL_VERSION`, `parse_body`, `rpc` directly — running a script puts its own directory on `sys.path`), different target: where `mcp_probe` checks the transport handshake, this checks *the workflow the transport carries*.\n\n`walk()` drives a real feature-brief through its whole lifecycle — draft → grounding → spec → planning → planReview → building → review — authoring the content each stage gates on. After every step it prints the `do` / `blocked` / `humanGates` / `attention` rollup for the brief's entire subtree, so you can see **which instructions the server hands an agent at which stage**.\n\nWhat it is for is *confirming stage-scoping by eye*. Each pinned child is held by a `ParentStateGuard` on its finalize transition, and `next_actions` withholds the field setters of a parent-gated transition, so the children come online one stage at a time:\n\n```\ngrounding  ->  the brief's four grounding setters, all three children silent\nspec       ->  the feature-spec's setters (+ askQuestion); NO addStep/addCase\nplanning   ->  addStep (carrying the step's own detail blocks) and addCase\n```\n\nThe closing summary tallies edge count per stage, so a regression shows up as a stage that got **noisy** — most usefully, an `addStep` appearing during `spec`.\n\nStructure:\n\n- **`class Probe`** — a connected session scoped to one workspace. `handshake()` initializes and carries the session id. `call(tool, **arguments)` is one `tools/call` round-trip returning the decoded payload, raising `ProbeError` on a JSON-RPC error, an `isError` result, or an undecodable body — it prefers `structuredContent`, falling back to JSON-parsing the first text block. `mutate(page_id, *commands)` reads the page's current `status_revision_token`, stamps it as the first entry in each command's args (the server requires it on each), runs the batch, and returns the created ids with nulls dropped.\n- **`cmd(command, /, **args)`** — one `{command, args}` entry. `command` is **positional-only** on purpose: several page-type commands take an arg called `name` (`addComponent`) or `command`, which would otherwise collide with the parameter.\n- **`_result_frame(body)` / `_text_content(result)`** — pick the JSON-RPC message out of a JSON body or the last meaningful frame of an SSE stream, and pull the first text block from a `tools/call` result.\n- **`show(...)`** — prints one stage's rollup and returns its `do` edge count. `do` edges print as *shapes* — kind, page type, command, target field — with each instruction elided via `elide()` to `INSTRUCTION_WIDTH` (44) characters. The point is to see the edge set at a glance; raise the constant or pass `--instructions` for more. `ELLIPSIS` is ASCII `...` on purpose, since the Windows console is cp1252 and mangles `…`.\n- **`find_features_toc(probe)`** — locates the workspace's `Features` toc page to file the brief under, returning `None` if there is none.\n\nThe walk **stops at `review`**: `ship` is a human gate and the probe never crosses one. It then archives the brief and its pinned subtree so repeated runs do not litter the workspace, and verifies it is gone from the default tree. On failure it prints the brief id and the exact `archivePage(...)` call to clean it up by hand, leaving the brief in place for inspection — the answer its own `addDecisions` block records.\n\n```bash\nuv run python scripts/feature_brief_probe.py\njust brief-probe --keep                 # leave the brief for inspection\njust brief-probe --new-workspace        # clean-slate run in a fresh workspace\njust brief-probe --instructions         # 200 chars of each instruction\n```\n\n---\n\n## Offline integrity check: `scripts/validate_workspace.py`\n\nThe odd one out: **no server, no lock, no `src` import**. It reads a workspace JSON document straight off disk and reports structural problems as a human fix-list keyed to line numbers. It never edits anything. Exit code is 0 when clean and 1 when any problem is found, so it works as a check (`just validate`).\n\n```bash\nuv run python scripts/validate_workspace.py [PATH]\n```\n\n### Why there is a hand-rolled line index\n\nFindings need to point a developer at a *line*, and `json.loads` discards position information. So there are two passes over the same file:\n\n- **`build_index(text)`** scans the raw text with regexes into a `PageIndex` per page (`key_line`, `parent_id_line`, ordered `child_lines`, ordered `link_lines`). It also returns `duplicate_keys` — duplicated page-id keys, which must be caught here because JSON parsing silently keeps only the last.\n- **`json.loads(text)`** gives the semantic data that `validate` reasons over.\n\n`_scan_block` dispatches per field into `_scan_string_array` (for `child_ids`) and `_scan_link_array` (for `links[].to`), both of which short-circuit on an inline `[]` and return the line after the closing `]`.\n\nThe regexes are indentation-sensitive — a page key at exactly 4 spaces, fields at 6, string elements at 8, link `to` at 10. **This is exact only for a file written by the store**, which serializes with `json.dumps(..., indent=2)`, one token per line. Hand-reformat the file and the line numbers stop meaning anything.\n\n### What `validate` checks\n\nIt builds `listed_parents` from the tree structure (`root_page_ids` + `child_ids`), which drives rendering and is therefore treated as authoritative for where a page is filed. Then, in order:\n\n1. **Duplicate page ids** — same key twice in `pages`.\n2. **`child_ids` → existence**, plus duplicate child entries within one parent.\n3. **Unique filing** — a page listed by more than one parent, or listed as a child while also appearing in `root_page_ids`.\n4. **`parent_id` agreement** — each page's `parent_id` matches where it is actually filed (or `null` for a root). Skipped when filing is ambiguous, since which `parent_id` is \"right\" is undecidable until finding 3 is resolved.\n5. **Reachability** — every page filed exactly once. A page filed nowhere is an orphan, and the finding says so with teeth: the hourly cleanup sweep stamps an unreachable page with an expiry five days out and deletes it once that passes, so re-file it before then.\n6. **`root_page_ids` sanity** — entries exist and are genuinely parentless.\n7. **Links → existence** — every `links[].to` resolves.\n8. **Empty tocs** — a `toc` page with no non-archived children and no section content is flagged as removable. Emptiness is decided by `_has_section_content` / `_is_empty_value`, which treat `None`, whitespace-only strings, and empty containers as empty.\n\nEach problem becomes a `Finding(line, title, detail)` whose `detail` is phrased as an instruction — *\"Remove that child_ids entry\"*, *\"Set parent_id to null\"* — because the audience is a human about to edit the file. `render_report` groups findings by title, sorts each group by line, and numbers them into a single fix-list. `main` also calls `sys.stdout.reconfigure(errors=\"replace\")` up front so a non-ASCII page title cannot crash the report on a narrow console.\n\n---\n\n## Connections to the rest of the codebase\n\n- **`main.py` → `run_dev_server`** is the only entry into the dev server. `just main` runs it.\n- **`src.server`** is the reactive target: `hmr_server` reads its `mcp`, `app`, and `STORE` attributes only through `import_module`, and imports `_hmr_debug` at its own tail so error capture hot-loads with it.\n- **`src.hmr_live_refresh`** is the shared, non-reloaded singleton — written to by `src.server` on every mutation and by `hmr_server.Reloader.on_changes` on every file change.\n- **`src.cleanup`** is started and restarted by `cleanup_reload_effect`; `validate_workspace.py` documents the same sweep's five-day orphan grace period from the outside.\n- **`justfile`** is the operator surface: `main`, `probe`, `brief-probe *ARGS`, `validate`, plus `dev` which runs `main` and `sphinx` in parallel.\n\n## If you are changing this code\n\nA few things to know before you edit:\n\n- **Never import `src.server` or `src.cleanup` at module top level in `hmr_server.py`.** Hot reload becomes a silent no-op — the worst possible failure mode, because nothing reports it.\n- **Never add `hmr_live_refresh.py` to the reload set.** Browser refresh stops working silently.\n- **The fastmcp internals are a known liability.** `base_app.providers` / `FastMCPProvider` for mount and unmount, and `base_app._mcp_server.run` for session capture, have changed across fastmcp versions. Revisit both on any fastmcp upgrade; the pin is `fastmcp>=3.4.4`.\n- **If a reload misbehaves, read `hmr_debug.log` first.** It is the only durable record of a failed re-exec, and the load-ordering races that multi-file edits trigger are visible nowhere else.\n- **`Reloader.__init__` adds `hmr_server.py` itself to `error_filter.exclude_filenames`**, so the reloader's own frames stay out of reported tracebacks. Keep that in mind when a traceback looks suspiciously short.","introspection-documentation-generation":"# Introspection & Documentation Generation\n\n# Introspection & Documentation Generation\n\nTwo pure modules and one I/O driver turn the page-type registry into machine-readable schemas and a generated Sphinx reference:\n\n| File | Role | Purity |\n| --- | --- | --- |\n| `src/describe.py` | Project a `PageType` (and a `Page`'s current legality) into JSON-shaped dicts | Pure |\n| `src/docsgen.py` | Render those projections into one Markdown doc per page-type *state* | Pure |\n| `scripts/gen_page_type_docs.py` | Write the rendered docs into `docsite/page-types/` | I/O only |\n| `docsite/conf.py` | Sphinx config that makes the generated pages build | — |\n\n`describe.py` has two consumers: the live MCP tools in `src/server.py`, and `docsgen.py`. Keeping one projection layer means the docsite and the tools an agent sees at runtime cannot drift apart — the docs are literally the tool output, rendered.\n\n```mermaid\ngraph LR\n  server[\"server.py<br/>describePageType / describeMutations\"] --> D\n  main[\"gen_page_type_docs.main\"] --> ASD[all_state_docs]\n  main --> RSI[render_states_index]\n  ASD --> SD[state_docs]\n  SD --> D[\"describe.py<br/>describe_page_type<br/>describe_mutations\"]\n  SD --> R[_render_state_doc]\n  D --> LC[\"commands.legal_commands\"]\n  SD --> REG[\"_registry.registered_pagetypes\"]\n```\n\n---\n\n## `src/describe.py` — the projection layer\n\n### `describe_page_type(page_type) -> dict`\n\nThe type-level schema, with no instance involved. Backs the `describePageType` MCP tool. Returns `tag`, `name`, `description`, `fsm` (via `describe_fsm`), `sections`, `workspaceGuidance`, and `commands` (each via `_command_summary`).\n\n`describe_fsm` flattens `page_type.fsm` into `initial`, `states`, a list of `{event, source, dest, agency}` edges, and `statusGuidance`. The guidance is copied into a plain `dict` deliberately — `FSMSpec` itself must stay hashable, so it holds a hashable mapping; the projection has no such constraint.\n\nThe `sections` projection is where a caller learns a field's *vocabulary*. Since no command name encodes a block kind any more, `blockKinds` on a `BLOCKS` field (and `elementBlocks` on a list field whose elements hold blocks) is the only place that vocabulary is published. `elementFields` and `elementStates` describe list fields with per-element structure and per-element lifecycles.\n\nField-level `description` is the authoring instruction. It lives on the `FieldSpec`, **not** on the setter command — `_command_summary`'s comment says so explicitly, and `tests/test_describe.py::test_describe_page_type_keeps_the_instruction_on_the_field_not_the_setter` pins it. If you are tempted to duplicate an instruction onto a command, don't; the docs render it from the field.\n\n### `describe_mutations(page, page_type, ignore_requirements=False) -> list[dict]`\n\nThe full command catalog for a *specific* page — every command the type declares, each with its arg schema and an `available` boolean. It calls `legal_commands(page, page_type, ignore_requirements=...)` and merges the result into `_command_summary` output. It is a full catalog, not a filtered one: illegal commands are still listed, just with `available: False`.\n\n`ignore_requirements` is the one knob that separates the two consumers:\n\n- The live `describeMutations` tool leaves it **False** — an agent should only see what it can actually fire.\n- `docsgen` sets it **True** so a content-gated transition still enumerates on a content-less page. The `legal_in` status lock still applies, so a status-scoped command lock is documented truthfully even in this mode.\n\n### `command_arg_schema(command) -> dict`\n\nA JSON Schema `object` for one command's arguments. Two properties are structural:\n\n1. **`statusRevisionToken` always comes first and is always required.** It's the optimistic-concurrency stamp; the store reads and strips it before the pure core sees the remaining arguments. Its description also carries the batching rule: a transition regenerates the token, so a batch holds at most one transition, and only as its final command.\n2. **Block arguments expand.** When `arg.content == BLOCK_ARRAY` and `arg.block_kinds` is set, the property is replaced wholesale with `{\"type\": \"array\", \"items\": _block_schema(...)}`. `_block_schema` emits a `oneOf` branch per accepted kind, each with a `kind` const and the kind's declared `body_args` as properties. Those body args are the same source `validate_block` reads, so schema and grammar agree by construction.\n\n`enum` (from `arg.choices`) and `description` are layered on after that replacement, so they apply to block-array args too.\n\n### `_command_summary` and the `legalIn` suppression\n\nOne rule is easy to trip over: `legalIn` is emitted **only for non-transition commands**.\n\n```python\n\"legalIn\": (list(command.legal_in) if command.legal_in\n            and command.kind not in (TRANSITION, COMPOUND) else None),\n```\n\nFor a `TRANSITION`/`COMPOUND` command, `legal_in` is by definition the edge's source status, which the FSM transition list already reports. Repeating it would just clutter the describe output.\n\n`requires` is projected as `[{\"section\": ..., \"field\": ...}]` — the content that must exist before a transition is legal. `docsgen` renders it as a \"blocked until …\" note.\n\n---\n\n## `src/docsgen.py` — rendering state pages\n\nThe unit of output is a **page-type-state**: one Markdown file per `(tag, state)` pair, stem `<tag>-<state>` (`_stem`). A state page is self-contained — it carries the state-specific parts *and* the whole type schema — so a reader landing on it never has to navigate elsewhere.\n\n### Why the FSM walk is trivial\n\nTwo design facts make this module small, and both are load-bearing:\n\n- **The `StateMachine` classes in `src.statecharts` are guardless.** Required-content preconditions and status-scoped locks live in `commands.py`, not in the machine. So the `statemachine-diagram` directive can replay any `:events:` path against a content-less machine, and a plain BFS over `FSMSpec.transitions` reaches every state.\n- **`describe_mutations(..., ignore_requirements=True)`** lets a content-less seed page still enumerate content-gated transitions.\n\nBreak either one — add a guard to a machine, or start filtering requirements in the doc path — and state pages silently lose states or transitions.\n\n### `reachable_states(fsm) -> dict[str, list[str]]`\n\nBreadth-first from `fsm.initial`, mapping each reachable state to the **shortest** event sequence that reaches it (initial maps to `[]`). That sequence is exactly what goes into the diagram directive's `:events:` option, so shortest keeps the option short. `tests/test_docsgen.py::test_every_declared_state_is_reachable` asserts no declared state is orphaned.\n\n### `_seed_page(page_type, state)`\n\nA content-less `Page` pinned at `state`, with `sections=initial_sections(page_type)` and id `<tag>:doc`. It exists purely so `describe_mutations` has something to evaluate; nothing is persisted.\n\n### `page_machine_qualname(tag)` and `_bindings_module()`\n\nThe diagram directive imports the machine class by dotted path, so `docsgen` has to name it. The convention: a machine is built under its `FSMSpec`'s own name and bound with a `Machine` suffix, so the path is `f\"{module.__name__}.{page_type.fsm.name}Machine\"`.\n\nBoth lookups raise `KeyError` rather than degrading:\n\n- unknown `tag` in the registry;\n- no attribute of that name on the bindings module.\n\nThat second check is the point — a page type whose binding was never added fails doc generation loudly instead of going silently undocumented.\n\n`_bindings_module()` picks `src.testcharts` when `is_test_mode()` and `src.statecharts` otherwise, importing **inside the function** so the test fixtures never enter a live server's import graph. Keep that import local.\n\n### Anatomy of a rendered state page\n\n`_render_state_doc` assembles, in order:\n\n| Part | Built by | Notes |\n| --- | --- | --- |\n| `# <tag> - <state>` heading | inline | |\n| Intro paragraph | inline | The state's own `statusGuidance`, or a placeholder if it declares none |\n| Diagram block | `_diagram_block` | ` ```{statemachine-diagram} <qualname}` with `:format: dot` and the BFS `:events:` path |\n| All-states nav line | `_all_states_line` | Current state bolded, siblings linked |\n| `## Transitions` | `_transitions_section` | Available commands whose `kind` is in `_PAGE_TRANSITION_KINDS` |\n| `## Authoring commands` | `_authoring_section` | Everything else that's available |\n| `## Page type schema` | `_page_type_section` | `describe_page_type` rendered in full: description, sections/fields, all commands |\n\nThe split uses `_PAGE_TRANSITION_KINDS = (TRANSITION, COMPOUND)`. `element_transition` is deliberately *not* in that tuple: it fires an element's own FSM, so from the page's point of view it is an authoring command.\n\n`_transitions_section` resolves each command's destination through `event_dest`, a map built from the described FSM edges whose `source == state`. It indexes that map directly (`event_dest[command[\"event\"]]`), which relies on `legal_commands` having already applied its topology check — a transition is only reported available when its source is the current status. If you loosen that check in `commands.py`, this lookup is where it will surface.\n\nTerminal states and locked states render explicit sentences rather than empty sections (`\"`<state>` is a terminal state - it has no outgoing transitions.\"`, `\"No authoring commands are legal in `<state>`.\"`).\n\n### The bullet formatter\n\n`_bullet(marker, description, notes)` is shared by `_field_line`, `_command_line`, and `_authoring_section`, and it encodes one Markdown constraint worth knowing before you edit it:\n\n- A **one-line** description stays inline after the marker, with `·`-joined notes trailing.\n- A **multi-line** description (a wrapped field instruction) becomes an indented block computed from the marker's own indentation plus two spaces. Flush left, it would terminate the list item. In this branch the notes move up onto the marker line, next to the key they annotate.\n\nThree tests pin exactly these three behaviours (`test_bullet_keeps_a_single_line_description_inline`, `test_bullet_indents_a_multiline_instruction_past_its_marker`, `test_bullet_keeps_notes_on_the_header_line`).\n\n`_field_line` turns the field projection into notes: `choices`, `elementFields`, `elementStates`, `elementBlocks`, `blockKinds`. `_command_line` renders `name(sig)` via `_arg_signature` — a compact `name, optional?` list derived from the JSON Schema's `properties` and `required` — plus `requires` and `legalIn` notes.\n\n### Public API\n\n```python\nstate_docs(page_type)                    -> dict[str, str]   # one type, keyed <tag>-<state>\nall_state_docs(registry=None)            -> dict[str, str]   # whole registry\nrender_states_index(registry=None)       -> str              # the states.md toctree\nSTATES_INDEX_STEM = \"states\"\n```\n\n`state_docs` captures `describe_page_type` **once** and `describe_mutations` **per state**; those two captures are the entire input to rendering. State ordering follows `fsm.states` declaration order (filtered to reachable) for readable navigation, not BFS order.\n\nBoth registry-wide functions default to `registered_pagetypes()` but accept an explicit registry — that parameter is what makes them testable against fixtures.\n\n---\n\n## `scripts/gen_page_type_docs.py` — the driver\n\n```\nuv run python scripts/gen_page_type_docs.py\n```\n\nIt inserts the repo root on `sys.path` so `src` imports as a bare script, calls `all_state_docs()`, adds `render_states_index()` under `STATES_INDEX_STEM`, and writes each entry to `docsite/page-types/<stem>.md` with `newline=\"\\n\"`.\n\nBehaviours to know:\n\n- **Unchanged files are skipped.** It reads back an existing file and compares before writing; a missing file is the normal case on a clean checkout or after `just docs` wipes the directory.\n- **It never deletes.** Drop a state from a page type and the stale `<tag>-<state>.md` stays until you remove it by hand.\n- **It never touches hand-authored `page-types/<tag>.md` overviews.** Only `<tag>-<state>.md` files and `states.md` are generated.\n\nRe-run after changing the page-type registry or any doc template in `docsgen.py`.\n\n---\n\n## Sphinx integration\n\n`docsite/conf.py` puts the repo root on `sys.path` so the `statemachine-diagram` directive can import the machine classes that `page_machine_qualname` names. Extensions: `myst_parser` (the generated files are Markdown), `sphinxcontrib.mermaid`, `statemachine.contrib.diagram.sphinx_ext`, and `autodoc2` over `../src`.\n\n`docsite/page-types.md` hand-links to the generated `page-types/states.md`, which in turn toctrees every state page — that chain is what keeps generated pages out of Sphinx's \"document isn't in any toctree\" warnings.\n\nOne inconsistency to be aware of: `docsgen._DIAGRAM_FORMAT` is `\"dot\"`, while the `conf.py` docstring describes the diagrams as Mermaid via `:format: mermaid`. The emitted directive is what actually runs; the docstring hasn't been updated. If you change `_DIAGRAM_FORMAT`, fix the docstring in the same change.\n\n---\n\n## Contributing\n\n**Adding a field attribute.** Project it in `describe_page_type`'s field dict, then render it as a note in `_field_line`. Both halves are needed — a key added only to the projection appears in the MCP tool output but nowhere in the docs.\n\n**Adding a command attribute.** Add it to `_command_summary`; if it belongs in the arg schema instead, put it in `command_arg_schema`. Then decide whether `_command_line` (type schema section) and/or `_transitions_section` / `_authoring_section` (state-specific sections) should surface it.\n\n**Adding a page type.** Bind its machine as `<FSMSpecName>Machine` in `statecharts.py` (or `testcharts.py` for fixtures), or `page_machine_qualname` raises. Then re-run the driver.\n\n**Adding a new command kind.** Decide whether it fires the page-status FSM. If it does, it belongs in `_PAGE_TRANSITION_KINDS`; if it fires something else (as `element_transition` does), leave it out so it renders as an authoring command.\n\n**Testing.** `tests/test_describe.py` covers the projections (arg schema shape, revision-token ordering, block vocabulary, `ignore_requirements`, availability marking, terminal-state behaviour). `tests/test_docsgen.py` covers the walk and the renderers, including `test_all_state_docs_covers_every_reachable_state` and `test_all_state_docs_is_idempotent`. Everything in both modules is pure and returns strings or dicts, so unit tests need no filesystem — keep it that way and leave I/O in the driver.","markdown-rendering":"# Markdown Rendering\n\n# Markdown Rendering — `src/render.py`\n\nPure rendering. Takes model objects (`Page`, `Workspace`) plus their page-type declarations and returns strings. No I/O, no store access, no registry lookups except one (`get_page_type`, used only while walking a tree). Everything the renderer needs about *other* pages arrives as an explicit `RefContext` argument, which is what keeps the module testable without a store.\n\nIt produces three distinct artifacts:\n\n| Artifact | Entry point | Consumed by |\n| --- | --- | --- |\n| One page as Markdown | `render_page(page, page_type, level, ref_context)` | `Store.render_markdown` → `renderPage` MCP tool, and the web page route |\n| A whole workspace as one Markdown document | `render_tree(workspace, show_archived)` | `Store.render_markdown` when `page_id is None` (MCP-only) |\n| The nav tree as a nested Markdown link list | `render_workspace_links(tree, ...)` | `route_page` / `route_tree` in `src/server.py` |\n| A flat text projection | `page_text(page, page_type)` | `Store.search` |\n\nTwo helpers are public because other renderers need to agree with this one: `render_blocks` and `checkbox_state` are imported by `src/render_html.py`, and `escape_markdown` is imported directly by `src/server.py` for the workspace index page.\n\n---\n\n## The two render paths\n\nThe same functions serve two callers with one behavioural difference, carried on `RefContext.escape_plain_text`:\n\n- **MCP path** (`renderPage`) — Markdown is the deliverable. It is returned as authored, unescaped.\n- **Web path** — the rendered Markdown is fed through a single top-level Markdown→HTML pass (`md2html.render`). That pass cannot distinguish the renderer's *deliberate* structural Markdown (headings, `-` bullets, `[x]` checkboxes, table pipes, links) from an author's field value that happens to contain `*` or `#`. So on this path every plain-text leaf is escaped **as it is emitted**, before it reaches the pass.\n\n`Store.render_markdown(..., escape_plain_text=True)` is how the web route opts in; `Store.render_html` always passes `True`. The whole-tree render is MCP-only and therefore always unescaped.\n\n```mermaid\ngraph LR\n  MCP[renderPage MCP tool] --> SM[Store.render_markdown]\n  WEB[route_page] --> SM\n  WEB --> SH[Store.render_html]\n  SRCH[Store.search] --> PT[page_text]\n  SM --> BRC[build_ref_context]\n  SM --> RP[render_page]\n  SM --> RT[render_tree]\n  SH --> RHP[render_page_html]\n  RHP -.imports.-> RB[render_blocks / checkbox_state]\n  RP --> RB\n```\n\n### `escape_markdown`\n\nApplied at each leaf via the tiny `_plain(text, ref_context)` gate — if there is no context, or the flag is off, the value passes through untouched. Three layers:\n\n1. `_GLOBAL_ESCAPES` — backslash **first** (so the backslashes added by later rules are not themselves re-escaped), then `*`, `` ` ``, `_`, `[`, `]`.\n2. `_BLOCK_LINE` — a zero-width multiline match on lines that *open* a block construct (`-`, `+ `, ATX `#`, `~~~`, `>`, a setext `=` underline) gets a leading backslash. Backtick fences and `*`/`_` thematic breaks are already handled by layer 1.\n3. `_ORDERED_LINE` — for `N. `, the **dot** is escaped, not the digit: a backslash before a digit renders as a visible backslash.\n\nOnly plain text goes through it. Inline code spans (`{\"code\": ...}`), `href` targets, and page-route URLs are emitted raw — they are structure, not author prose.\n\n---\n\n## `RefContext`\n\nA frozen snapshot of everything the renderer needs to know about *other* pages, built by `build_ref_context(workspace, show_archived, escape_plain_text)`:\n\n- `titles` / `types` / `statuses` — every page id in the workspace, **archived included**, so an archived target can still be labelled rather than dropped to a bare id.\n- `archived_ids` — the subset that is archived, letting child and reference lists hide or flag them.\n- `workspace_id` — the link prefix: `/<workspace_id>/page/<id>`.\n- `show_archived` — appends `?archived=true` to every emitted link so following one keeps the archived view.\n- `escape_plain_text` — the render-mode flag described above.\n\n`ref_context` is optional everywhere. Omit it (a direct render with no workspace) and refs, child pages, and reference targets degrade gracefully to their bare ids. This is the shape the unit tests use.\n\n---\n\n## Page anatomy — `render_page`\n\n```\n# <title>\n\n*<type>* · `<status>` [· rev `<status_revision_token>`]\n\n## <Section name>\n\n<field>…\n\n## References\n## Child pages\n```\n\n`level` controls the title depth; sections sit one level below (`level + 1`). The revision segment appears only when `page.status_revision_token is not None`.\n\nEvery declared section and every declared field is emitted, whether or not it holds content — an empty one renders the italic `_NONE` fallback (`*None.*`). That is deliberate: a page's *shape* should be visible before it is filled, so an author can see what there is to write.\n\n### The `toc` exception\n\nA page type tagged `toc` renders as title, meta line, and a bare child list — no `References` or `Child pages` headings. A toc has no authoring commands, hence no `addLink`, hence its References list can never be non-empty; and its child list *is* the table of contents, so a heading above it is noise.\n\n### Field rendering — `_field_content`\n\nDispatches on `FieldSpec.kind` (`SCALAR`, `PROSE`, `LIST`, `BLOCKS` from `pagetypes/core/specs.py`):\n\n- **`SCALAR`** keeps its `- **key:** value` label even when empty, so the field stays *named*. It is the only kind that does.\n- **`PROSE`** renders bare — the section heading names it.\n- **`LIST`** → `_render_list`.\n- **`BLOCKS`** → `render_blocks`.\n\nAnything else falls through to `*None.*`.\n\n### Lists — `_render_list`\n\nOne bullet per element:\n\n```\n- [x] <text>; <key>: <value>; … _[status]_\n```\n\n- `id` is dropped, `None` values are dropped, and any field named in `block_element_fields(field_spec)` is *withheld* from the flattened body — block-bearing fields render as indented Markdown **below** the bullet instead.\n- `text` leads; remaining fields become `key: value` pairs joined with `; `. `bodysep` only appears when both sides are non-empty.\n- `status`, when present, is echoed as a trailing `_[status]_` *in addition to* any checkbox.\n- Block fields are rendered with `render_blocks` and passed through `_indent_list_content`, which prefixes two spaces to every non-blank line. Without that indent a fenced code block or nested list would terminate the list item. Blank lines are left genuinely blank — the repo trims trailing whitespace, so emitting `\"  \"` would churn.\n\n### Checkboxes — `checkbox_state` / `_checkbox`\n\n`checkbox_state(status, element_fsm)` is the single authority, returning `\"done\"`, `\"todo\"`, or `None`:\n\n- `\"done\"` when `status == element_fsm.checkmark_done`\n- `\"todo\"` when `status == element_fsm.initial`\n- `None` otherwise — any intermediate state, an `ElementFSMSpec` with no `checkmark_done`, or a list field with no element FSM at all\n\nIt is public so `render_html.element_view` can ask the same question and spell the answer its own way (an HTML checkbox rather than `[x] `). `_checkbox` is this module's spelling: `\"[x] \"`, `\"[ ] \"`, or `\"\"`.\n\n---\n\n## Blocks and inline runs\n\n`render_blocks(blocks, ref_context)` walks an ordered array of typed block dicts and joins the results with a blank line, returning `None` for an empty list (so `_field_content` can substitute `*None.*`). Supported `kind` values: `heading` (level clamped to 1–6), `paragraph`, `code`, `list` (ordered or not), `quote`, `table`, `divider`, `decision`. An unrecognised kind falls back to `str(block)` — visibly wrong rather than silently dropped.\n\nText inside a block comes from `_inline_or_text`: rich `inlines` runs when present, otherwise the bounded plain-text `text` key.\n\n`_render_run` handles the four run shapes declared in `specs.py`:\n\n| Shape | Renders as |\n| --- | --- |\n| `\"literal string\"` | escaped plain text |\n| `{\"code\": s}` | `` `s` `` (never escaped) |\n| `{\"ref\": pageId}` | `[<target title>](/<ws>/page/<id>[?archived=true])`, or the **bare id** when there is no context or the id resolves to nothing |\n| `{\"text\", \"bold\"?, \"italic\"?, \"href\"?}` | italic inside bold inside link — applied in that order |\n\nTables (`_render_table`) emit a header row, a separator row built from `_ALIGN_SEP` (`:---` / `:---:` / `---:` / `---`, defaulting to `---` for an unknown value), then the body rows; every cell is an inline-run array.\n\n---\n\n## Child pages and references\n\nBoth lists render the same link form — `[title](/ws/page/id) *type* · ` status ` ` — and both honour archiving the way the tree render does: an archived target is **hidden** unless `ref_context.show_archived`, in which case it is listed with a bold `**(A)** ` marker prefixed *before* the link.\n\nTwo details worth knowing before you touch either function:\n\n- `_render_child_pages` sorts children by `_is_archived` before emitting. `sorted` is stable and `False < True`, so archived children sink below active ones with each group's relative order preserved — matching how `Store.tree` orders every level.\n- The skip condition differs between the two. A child is skipped only when `archived and not page.archived and not show_archived` — an archived page still lists its own archived children, since hiding them would leave an archived page looking childless. `_render_references` has no such carve-out; an archived link target is hidden whenever `show_archived` is off.\n\n`_render_references` reads `page.links` (outgoing typed edges, `{\"to\", \"role\"}`) and appends ` - <role>` to each line.\n\n---\n\n## Whole-tree render — `render_tree`\n\nEmits `# <workspace name>`, builds one `RefContext` up front, then depth-first walks `workspace.root_page_ids`. An archived page returns immediately, pruning its whole subtree; a page whose type is not registered is skipped (its children are still walked). Heading depth is `min(depth, 6)`, starting at 2 for roots.\n\n`show_archived` here does **not** widen which pages render — archived subtrees are always skipped. It only rides onto the inline-ref links so that following a ref out of the tree keeps the archived view.\n\n---\n\n## Nav tree — `render_workspace_links`\n\nThe odd one out: it takes a `store.tree()` **dict**, not model objects, and does its own escaping (calling `escape_markdown` directly rather than through `_plain`, since there is no `RefContext` in play). It recurses over `nodes` / `children`, indenting two spaces per depth level, and is used twice by the server with different flags:\n\n- `show_meta=True` (the tree route) appends ` *type* · ` status ` ` to every line.\n- `show_meta=False` (the page-route sidebar) instead appends the status in parentheses to the link *text* — but only for the types in `_STATUS_SUFFIX_TYPES` (`feature-brief`, `simple-change`, `bug-report`). Those are the pages a user tracks through a lifecycle; structural pages like `toc` or `architecture` have a status that is not worth the glance.\n\nArchived nodes get the same `**(A)** ` prefix, and `show_archived` adds `?archived=true` to every link.\n\n---\n\n## Search projection — `page_text`\n\nA flat, space-joined string of everything searchable on a page: the title, then every string value under every declared field. It deliberately does *not* reuse the Markdown renderer — search wants words, not structure.\n\nThe nesting it has to reach through is the subtle part:\n\n1. Scalar and prose values are strings — taken directly.\n2. A list element's fields are taken as strings, minus `id`.\n3. For a `BLOCKS` field, each entry is a block whose rich text lives inside inline runs, not as top-level strings — `_block_inline_text` pulls it out of `inlines`, `items`, `paragraphs`, `header`, and `rows`.\n4. A list element's *block fields* (from `block_element_fields`) nest one level deeper again: each block contributes both its top-level strings and its own inline text.\n\n`_runs_text` skips `{\"ref\": id}` runs — a ref carries an opaque page id, not words a user would search for. Its title is already indexed on the target page.\n\n---\n\n## Contributing notes\n\n- **Keep it pure.** No store, no filesystem, no request context. If a renderer needs to know something about another page, it belongs on `RefContext`, not fetched here.\n- **Escape at the leaf, not at the end.** Escaping the finished document would destroy the structure this module just built. Any new author-provided text must go out through `_plain`; anything you emit yourself must not.\n- **Answer questions once.** `checkbox_state` and `render_blocks` exist as public functions so the HTML renderer agrees with the Markdown one by construction. If you add a rendering decision both paths need, follow that shape rather than duplicating the logic in `render_html.py`.\n- **Empty must render.** `*None.*` is a feature. A new field kind that renders nothing for an empty value breaks the \"shape is visible before it is filled\" contract.\n- **Tests** live in `tests/test_render.py` and mostly drive `render_page` end-to-end against a small in-test page type, asserting on the Markdown string. `escape_markdown` and `checkbox_state` have direct unit tests. Run with `pytest --testmon`.","mcp-server-web-interface":"# MCP Server & Web Interface\n\n# MCP Server & Web Interface\n\n`src/server.py` is pasta's single entry surface. It builds one FastAPI application that serves two audiences from the same process and the same `Store`:\n\n- **agents**, over MCP at `/pasta/mcp` (streamable HTTP) or over stdio,\n- **humans**, over HTML at `/`, `/ws:<id>`, and `/ws:<id>/page/<pageId>`.\n\nEverything below the surface — page types, the FSM, mutation validation, persistence — lives elsewhere. This module is a thin, uniform adapter: it unwraps route/tool arguments, delegates to `Store`, fires a browser refresh on every write, and translates errors into the shape each audience expects.\n\n## Module map\n\n| File | Responsibility |\n| --- | --- |\n| `main.py` | CLI entrypoint: `--stdio` runs `mcp.run(transport=\"stdio\")`, otherwise `run_dev_server()` from `src/hmr_server.py` |\n| `src/server.py` | The FastAPI app, the MCP tool surface, the websocket reloader route, error handling |\n| `src/render_html.py` | Structured HTML render of one page (the web-only second render path) |\n| `src/templates/` | Jinja2 templates + the three inline scripts (`_reloader.js`, `_theme.js`, `_view_toggle.js`) |\n| `src/static/` | `styles.css` (water.css overrides + `.pasta-page` rules) and the vendored water.css themes |\n\n## Application assembly\n\nImport of `src/server.py` is not side-effect free, deliberately:\n\n```python\nvalidate_registry()                       # fail fast: every page type checked once, at load\nDATA_DIR = os.environ.get(\"PASTA_DATA_DIR\", \".pasta-data\")\nSTORE = Store(DATA_DIR)\n```\n\n`validate_registry()` runs on a cold start **and on every HMR reload** (the module re-executes then), so a misconfigured page type surfaces all of its errors at once rather than piecemeal on a later request.\n\nThe app is then composed from two lifespans and three mounts:\n\n```python\nmcp: FastMCP = FastMCP(\"pasta\")\nmcp_app = mcp.http_app(path=\"/mcp\")\napp = FastAPI(lifespan=combine_lifespans(app_lifespan, mcp_app.lifespan))\napp.mount(\"/static\", StaticFiles(directory=\"src/static\"))\napp.mount(\"/sphinx\", StaticFiles(directory=\"docsite/_build/html\"))\napp.mount(\"/pasta\", mcp_app)              # MCP endpoint at /pasta/mcp\n```\n\n`app_lifespan` starts and stops the hourly cleanup scheduler (`cleanup.start_scheduler(STORE)` / `cleanup.stop_scheduler()`). **It only fires under plain ASGI hosting** — under the HMR dev server the app is served through a reactive dispatcher, and `hmr_server.reloader_lifespan` owns the scheduler instead (`start_scheduler` is idempotent, so both call sites are safe).\n\n`mcp_app.lifespan` must be combined in; FastMCP's HTTP transport does not work without it.\n\n### No HTTP caching\n\nOne `@app.middleware(\"http\")` stamps `Cache-Control: no-cache, no-store, must-revalidate` on every response whose path does not end in `.css`. The server is only ever hosted locally, so caching buys nothing and was serving stale images. Middleware — rather than per-route headers — is what reaches the `/static` and `/sphinx` `StaticFiles` mounts where images live. `BaseHTTPMiddleware` only sees HTTP scopes, so the `/ws/reloader` websocket passes through untouched.\n\n## The two guards\n\nEvery route and every tool body runs inside exactly one of two context managers. This is the module's core convention — a new route or tool should not invent a third error path.\n\n```python\n@contextmanager\ndef _guard_http():     # any Exception -> InternalError(traceback) -> error.html, HTTP 500\n@contextmanager\ndef _guard_tool():     # PastaError   -> ToolError(str(exc))      -> client-visible message\n```\n\n`_guard_tool` catches only `PastaError` — the domain's *expected* rejections (unknown workspace, illegal transition, stale revision token, archived page). Those become `ToolError`, which the MCP client sees as a readable failure it can act on. Anything else propagates as a genuine server error.\n\n`_guard_http` catches everything, wraps the `TracebackException`, and re-raises `InternalError`. The registered `@app.exception_handler(InternalError)` renders `error.html` with the formatted exception and full chained traceback at status 500 — and because `error.html` extends `_base.html`, the page still carries the reloader script, so a fix plus an HMR reload refreshes the error page back into a working one.\n\nA handful of tools also raise `ToolError` directly for argument-level problems the store never sees (`describePageType` on an unknown type name, `describeMutations` on a page whose stored type is unregistered).\n\n## MCP tool surface\n\nTools are declared with `@mcp.tool`; the function name *is* the tool name, so the camelCase naming is load-bearing. They fall into five groups.\n\n**Bootstrapping.** `instructions()` returns the long prose contract that teaches an agent how to use pasta: find a workspace, describe page types, create a page before exploring code, read the echoed `next` after every write, stop at human gates. It is the only tool that returns a static string rather than touching the store.\n\n**Reads** — `listWorkspaces`, `tree`, `getPage`, `outline`, `renderPage`, `search`, `nextActions`, `attention`, `describePageType`, `describeMutations`. These delegate straight to `STORE` (or to `describe.py` for the two `describe*` tools) and never fire a refresh.\n\n**Writes** — `createWorkspace`, `createPage`, `mutatePageBatch`, `setWorkspaceGuidance`.\n\n**Archiving** — `archiveWorkspace`, `unarchiveWorkspace`, `archivePage`, `unarchivePage`.\n\n**Structure and graph** — `reparentPage`, `reorderPage`, `renamePage`, `link`, `unlink`.\n\nEvery write-shaped tool follows the same three beats:\n\n```python\nwith _guard_tool():\n    page, created = STORE.mutate_page_batch(workspaceId, pageId, commands)\n    next_actions = STORE.next_actions(workspaceId, pageId)   # self-direction\n    await ws_reloader.refresh()                              # browsers reload\n    return {\"pageId\": ..., \"status\": ..., \"statusRevisionToken\": ..., \"next\": next_actions}\n```\n\nThe `next` echo is what makes the wiki self-directing: `createPage` and `mutatePageBatch` re-read `STORE.next_actions` after committing and return it inline, so an agent never has to poll `nextActions` to learn what to author next. `mutatePageBatch` also echoes the regenerated `statusRevisionToken` — a status transition invalidates the old one, which is why at most one transition is legal per batch and only as its final command.\n\n`getPage` and `renderPage` can exceed the MCP response limit; large results are persisted to a temp JSON file on disk rather than inlined (handled downstream in the store/serialization layer, but documented on the tool so callers expect it).\n\n## Web routes\n\nFour GETs and three POSTs, all guarded by `_guard_http`.\n\n| Route | Renders |\n| --- | --- |\n| `GET /` | `index.html` — workspace list as Markdown links, through `md2html` |\n| `GET /ws:{workspaceIdPart}` | `tree.html` — `STORE.tree()` through `render_workspace_links` |\n| `GET /ws:{workspaceIdPart}/page/{pageId}
